name = "beehive-admin"
main = "src/index.js"
compatibility_date = "2026-09-01"

# The panel must be reachable ONLY at admin.beehivebin.co, which is the hostname
# Cloudflare Access guards. Left on, beehive-admin.<subdomain>.workers.dev would
# serve the same Worker with no Access in front of it — the JWT check would
# reject every request, but a backstop is not a front door.
workers_dev = false

# Attaching the custom domain creates the DNS record for admin.beehivebin.co,
# which is the hostname the Access application guards.
routes = [
  { pattern = "admin.beehivebin.co", custom_domain = true }
]

# IMPORTANT: this Worker trusts Cloudflare Access to have already authenticated
# the visitor. Put an Access application in front of admin.beehivebin.co before
# the first deploy — the Worker rejects requests without a valid Access JWT, so
# an unprotected deploy fails closed rather than open, but don't leave it that way.

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /api must reach the Worker, never the SPA fallback.
run_worker_first = ["/api/*"]

[vars]
# From the Zero Trust dashboard: Settings → Custom Pages shows your team domain.
ACCESS_TEAM_DOMAIN = "beehivebin.cloudflareaccess.com"
# Access → Applications → (this app) → Overview → "Application Audience (AUD) Tag".
# Without the right value here, a token minted for any other app in the team
# would be accepted. It is an identifier, not a secret.
ACCESS_AUD = "d3430bffb95667e30bcafcd5788b23f3f2306b8a4dd4865bc4abb09cffda5816"
ALLOWED_EMAIL_DOMAIN = "beehivebin.co"

[[d1_databases]]
binding = "DB"
database_name = "beehive"
database_id = "4dfd9b23-a6a4-40ba-87ee-0e9abc57d828"       # `wrangler d1 create beehive` prints this
migrations_dir = "../migrations"
