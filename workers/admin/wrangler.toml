name = "beehive-admin"
main = "src/index.js"
compatibility_date = "2026-09-01"

# The panel must be reachable ONLY at admin.beehivebin.co, which is the hostname
# Cloudflare Access guards. Left on, beehive-admin.<subdomain>.workers.dev would
# serve the same Worker with no Access in front of it — the JWT check would
# reject every request, but a backstop is not a front door.
workers_dev = false

# Attaching the custom domain creates the DNS record for admin.beehivebin.co,
# which is the hostname the Access application guards.
routes = [
  { pattern = "admin.beehivebin.co", custom_domain = true }
]

# IMPORTANT: this Worker trusts Cloudflare Access to have already authenticated
# the visitor. Put an Access application in front of admin.beehivebin.co before
# the first deploy — the Worker rejects requests without a valid Access JWT, so
# an unprotected deploy fails closed rather than open, but don't leave it that way.

# Photo retention. Daily at 09:00 UTC — early morning Mountain, well away from
# anyone working a delivery.
[triggers]
crons = ["0 9 * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /api must reach the Worker, never the SPA fallback.
run_worker_first = ["/api/*"]

[vars]
# From the Zero Trust dashboard: Settings → Custom Pages shows your team domain.
ACCESS_TEAM_DOMAIN = "beehivebin.cloudflareaccess.com"
# Access → Applications → (this app) → Overview → "Application Audience (AUD) Tag".
# Without the right value here, a token minted for any other app in the team
# would be accepted. It is an identifier, not a secret.
ACCESS_AUD = "d3430bffb95667e30bcafcd5788b23f3f2306b8a4dd4865bc4abb09cffda5816"
ALLOWED_EMAIL_DOMAIN = "beehivebin.co"

# Square. Flip SQUARE_ENV to "production" and swap in the production location id
# below when the sandbox run-through looks right — and remember the access token
# is a different secret in each environment.
#   production location: LEN3W9Q3WM2N8
# Where the customer confirmation flow answers (see workers/form-handler).
BOOKING_HOST = "book.beehivebin.co"
SQUARE_ENV = "sandbox"
SQUARE_LOCATION_ID = "LJR9D95SRQSN7"

# Sales tax. Square does NOT apply a location's tax settings to orders created
# through the API, so the rate has to be named here or invoices go out untaxed.
#
# Preferred: create a Tax in the Square dashboard (Items & services → Taxes) and
# put its id here — the rate then lives with the accounting and changes without
# a deploy. Otherwise set SQUARE_TAX_PERCENTAGE to a string like "7.25".
#
# /api/square/ping reports which is in force, and says so loudly when neither is.
SQUARE_TAX_CATALOG_ID = ""
SQUARE_TAX_PERCENTAGE = ""
SQUARE_TAX_NAME = "Utah sales tax"
# SQUARE_ACCESS_TOKEN is a secret, set with:
#   npx wrangler secret put SQUARE_ACCESS_TOKEN -c workers/admin/wrangler.toml

# Resend lives on beehive-forms, so the panel asks it to send rather than
# holding a second copy of the API key. RPC entrypoints have no URL, so this
# adds nothing publicly reachable.
# Delivery and pickup photos. Images do not belong in D1; the database holds
# the index and R2 holds the bytes.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "beehive-photos"

[[services]]
binding = "MAILER"
service = "beehive-forms"
entrypoint = "Mailer"

[[d1_databases]]
binding = "DB"
database_name = "beehive"
database_id = "4dfd9b23-a6a4-40ba-87ee-0e9abc57d828"       # `wrangler d1 create beehive` prints this
migrations_dir = "../migrations"
