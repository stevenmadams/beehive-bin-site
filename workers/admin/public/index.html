          <select id="n-dcity"><option value="">Pick a city…</option>${cities.map(c => `<option>${esc(c)}</option>`).join('')}</select></div>
        <div><label class="fl" for="n-pcity">Pickup city</label>
          <select id="n-pcity"><option value="">Same as delivery</option>${cities.map(c => `<option>${esc(c)}</option>`).join('')}</select></div>
      </div>

      <label class="fl" for="n-notes">Notes from the customer</label>
      <textarea id="n-notes" placeholder="Stairs, gate codes, custom quantities\u2026"></textarea>

      <div style="height:12px"></div>
      <label class="fl" for="n-internal">Internal notes</label>
      <textarea id="n-internal" placeholder="Only staff see this."></textarea>

      <div id="n-msg" style="margin-top:14px"></div>
      <div class="actions" style="margin-top:16px;border-top:1px solid var(--line);padding-top:18px">
        <button class="btn primary" id="n-save">Create request</button>
        <button class="btn" id="n-cancel">Cancel</button>
      </div>
    </div>`));

  document.body.append(scrim, drawer);
  const q = id => drawer.querySelector('#' + id);

  // Mirror the site's quote so a phoned-in customer hears the same number the
  // website would have shown them.
  const sync = () => {
    const bins = +q('n-bins').value;
    const weeks = Math.max(1, +q('n-weeks').value || 1);
    q('n-quote').textContent = '$' + (PRICES[bins] + (weeks - 1) * EXTRA[bins]);
    const start = q('n-start').value;
    if (start) {
      const d = new Date(start + 'T12:00:00');
      d.setDate(d.getDate() + 7 * weeks);
      q('n-back').textContent = '\u00B7 back ' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    } else q('n-back').textContent = '';
  };
  ['n-bins', 'n-weeks', 'n-start'].forEach(id => q(id).addEventListener('input', sync));
  sync();

  const isReserve = () => q('n-kind').value === 'reserve';
  q('n-kind').addEventListener('change', () => { q('n-reserve').hidden = !isReserve(); });

  drawer.querySelector('.x').addEventListener('click', close);
  q('n-cancel').addEventListener('click', close);

  q('n-save').addEventListener('click', async () => {
    const btn = q('n-save');
    btn.disabled = true;
    q('n-msg').replaceChildren();
    try {
      const { request } = await api('/requests', { method: 'POST', body: JSON.stringify({
        kind: q('n-kind').value,
        first_name: q('n-first').value, last_name: q('n-last').value,
        phone: q('n-phone').value, email: q('n-email').value,
        contact_pref: q('n-pref').value,
        bins: q('n-bins').value, weeks: q('n-weeks').value,
        start_date: q('n-start').value, delivery_city: q('n-dcity').value,
        pickup_city: q('n-pcity').value, quoted_total: q('n-override').value,
        customer_notes: isReserve() ? q('n-notes').value : '',
        message: isReserve() ? '' : q('n-notes').value,
        internal_notes: q('n-internal').value,
      })});
      close();
      await refreshCounts();
      await viewRequests();
      location.hash = `#/requests/${request.id}`;
    } catch (err) {
      q('n-msg').replaceChildren(banner(err.message));
      btn.disabled = false;
    }
  });
}

/* ---------- rentals ---------- */
const rentState = { status: 'active' };
const RENT_FILTERS = [['active','Active'],['stalled','Stalled'],['pending','Pending'],
  ['out','Out'],['to_inspect','To inspect']];

const isLate = r => r.status === 'out' && r.due_date && r.due_date < todayISO();

async function viewRentals() {
  const view = $(`<div>
    <div class="head"><h1>Rentals</h1><span class="count" id="ncount"></span></div>
    <p class="sub">Live jobs, from agreement through inspection. Finished ones live on the customer.</p>
    <div class="toolbar">
      <div class="seg">${RENT_FILTERS.map(([f, label]) =>
        `<button data-f="${f}" aria-pressed="${f === rentState.status}">${label}</button>`).join('')}</div>
    </div>
    <div class="card" id="nlist"><div class="empty">Loading…</div></div>
  </div>`);
  render('rentals', view);

  view.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    rentState.status = b.dataset.f;
    viewRentals();
  }));

  const list = view.querySelector('#nlist');
  try {
    const { rentals } = await api(`/rentals?status=${rentState.status}`);
    view.querySelector('#ncount').textContent = rentals.length || '';

    if (!rentals.length) {
      list.replaceChildren($(`<div class="empty"><strong>Nothing here</strong>${
        rentState.status === 'active'
          ? 'No active rentals. Approve a request to start one.'
          : 'No rentals in this list.'}</div>`));
      return;
    }

    const rows = rentals.map(r => `<tr class="clickable${isLate(r) ? ' late' : r.stalled ? ' stale' : ''}" data-id="${r.id}">
      <td><span class="pill ${r.status}">${r.status}</span>${
        r.status === 'returned' && !r.inspected_at ? ' <span class="pill stalled" title="Back, not yet inspected">inspect</span>'
        : isLate(r) ? ' <span class="pill overdue">late</span>'
        : r.stalled ? ' <span class="pill stalled" title="Never confirmed and the start date has passed">stalled</span>' : ''}</td>
      <td><div class="who">${esc(fullName(r))}<small>${esc(r.delivery_city || '—')}</small></div></td>
      <td class="nowrap">${r.bins} bins · ${r.weeks === 1 ? '1 wk' : r.weeks + ' wks'}</td>
      <td class="nowrap num">${esc(niceDate(r.start_date))}</td>
      <td class="nowrap num">${esc(niceDate(r.due_date))}</td>
      <td class="nowrap num hide-sm">${esc(money(r.total_cents))}</td>
      <td class="nowrap hide-sm">${[
        r.agreement_signed_at ? 'signed' : '', r.paid_at ? 'paid' : '',
      ].filter(Boolean).join(' · ') || '<span style="color:var(--muted)">—</span>'}</td>
    </tr>`).join('');

    const table = $(`<table><thead><tr>
      <th>Status</th><th>Who</th><th>Package</th><th>Out</th><th>Back</th>
      <th class="hide-sm">Total</th><th class="hide-sm">Steps</th>
    </tr></thead><tbody>${rows}</tbody></table>`);
    table.querySelectorAll('tbody tr').forEach(tr =>
      tr.addEventListener('click', () => { location.hash = `#/rentals/${tr.dataset.id}`; }));
    list.replaceChildren(table);
  } catch (err) {
    list.replaceChildren($(`<div class="empty"><strong>Could not load rentals</strong>${esc(err.message)}</div>`));
  }
}

const STEPS = [
  ['agreement', 'agreement_signed_at', 'Agreement signed'],
  ['paid',      'paid_at',             'Paid'],
  ['delivered', 'delivered_at',        'Bins delivered'],
  ['returned',  'returned_at',         'Bins back'],
  ['inspected', 'inspected_at',        'Inspected & cleaned'],
];

/* A rental is a page, not a drawer. There is too much on it — five steps,
   photos, addresses, the bins, charges, notes — for a panel that slides in
   over the list. The work runs down the left; the facts sit on the right. */
async function openRental(id) {
  closeAnyDrawer();
  const drawer = $('<div class="rentalpage"><div class="empty">Loading…</div></div>');
  render('rentals', drawer);
  const close = () => { location.hash = '#/rentals'; };
  // Keep the scroll position across the many re-renders a rental goes through.
  const scrollY = window.scrollY;

  let r, photos = [];
  try {
    // Fetched together so the checklist can render its own evidence rather than
    // filling in underneath a moment later.
    const [rental, shots] = await Promise.all([
      api(`/rentals/${id}`),
      api(`/rentals/${id}/photos`).catch(() => ({ photos: [] })),
    ]);
    r = rental.rental;
    photos = shots.photos || [];
  }
  catch (err) {
    drawer.replaceChildren($(`<div class="banner err">${esc(err.message)}</div>`));
    return;
  }

  const pref = r.contact_pref;
  const actions = contactActions(r);

  drawer.replaceChildren($(`
    <div class="rhead">
      <a class="back" href="#/rentals">&larr; Rentals</a>
      <div class="title">
        <h1>${esc(fullName(r))}</h1>
        <div class="meta">Rental #${r.id}${r.request_id ? ` · from request #${r.request_id}` : ''}${
          r.customer_id ? ` · <a href="#/customers/${r.customer_id}">customer record</a>` : ''}
          · ${r.bins} bins · ${r.weeks === 1 ? '1 week' : r.weeks + ' weeks'} · ${esc(niceDate(r.start_date))} &rarr; ${esc(niceDate(r.due_date))}</div>
      </div>
      <span class="pill ${r.status}">${r.status}</span>
    </div>
    <div class="rgrid">
      <div class="rmain">
        ${isLate(r) ? '<div class="banner err">Past its return date and still out.</div>' : ''}
      ${r.stalled ? `<div class="banner err">This never got confirmed and its start date
        (${esc(niceDate(r.start_date))}) has passed. Chase it or cancel it &mdash; the bins
        are not going anywhere while it sits here.</div>` : ''}

      
        ${/* Gated on the link being sent, not on an invoice existing — the invoice
            is now raised by the customer's card at the end, so waiting for one
            would hide the checklist for the whole rental. */
        !r.confirm_sent_at ? `
      <div class="kickoff">
        <h4>Start this rental</h4>
        <p>Nothing else can happen until the customer has their link &mdash; they
        confirm the details, sign the agreement, put a card on file and pay from
        it. The invoice is raised and charged when they do.</p>
        ${isOwner() ? `<button class="btn primary" id="r-invoice"${r.email ? '' : ' disabled'}>
          ${r.email ? 'Email them the link' : 'No email address on this rental'}</button>
        <span class="to">${esc(money(r.total_cents))} + tax${r.email ? ` &rarr; ${esc(r.email)}` : ''}</span>`
        : '<span class="to">An owner sends the link.</span>'}
      </div>` : `
      <div class="steps">${STEPS.map(([key, col, label]) => {
        const done = r[col] ? 1 : 0;
        if (key === 'inspected') return inspectRow(r, label, done);

        /* Payment is the one row with anything to do, so the invoice controls
           live in it rather than in a separate card repeating its status. */
        if (key === 'paid') {
          const locked = r.square_status === 'PAID';
          // The checklist only renders once an invoice exists, so this row is
          // never the place an invoice gets created.
          const acts = r.square_invoice_id
            ? `${r.square_invoice_url ? `<a class="btn sm" href="${esc(r.square_invoice_url)}" target="_blank" rel="noopener">Open</a>` : ''}
               ${locked ? '' : '<button class="btn sm" id="r-sync">Check</button>'}`
            : `<span class="amt">${r.square_card_id ? 'card saved, raising invoice…' : 'waiting on the customer'}</span>`;
          return `
          <div class="step payrow" data-done="${done}" data-locked="${locked ? 1 : 0}">
            <button class="tick" data-step="paid" data-done="${done}"
              data-locked="${locked ? 1 : 0}" title="${locked ? 'Square has this paid' : 'Mark paid by hand'}">✓</button>
            <span class="lbl">Payment</span>
            <span class="amt">${r.tax_cents != null
              ? `${esc(money(r.total_cents + r.tax_cents))} inc. tax` : `${esc(money(r.total_cents))} + tax`}</span>
            ${locked ? '<span class="src">via Square</span>'
              : r.square_invoice_id ? `<span class="src">${esc(r.square_status || 'sent')}</span>` : ''}
            <div class="acts">${acts}${
              r[col] ? `<span class="when">${esc(ago(r[col]))}</span>` : ''}</div>
          </div>`;
        }

        /* Delivery and pickup each carry the photo that proves them, in the row
           that needs it — a separate gallery lower down meant taking the photo
           and ticking the box were two different places on the screen. */
        if (key === 'delivered' || key === 'returned') {
          const kind = key === 'delivered' ? 'delivery' : 'pickup';
          const mine = photos.filter(ph => ph.kind === kind);
          // Nothing comes back before it goes out, so the pickup row waits.
          const waiting = key === 'returned' && !r.delivered_at;
          // Once the visit is marked done these are the record of it, so they
          // stop being removable — the way out is reopening the step.
          const committed = !!r[col];
          const thumbs = mine.map(ph => `
            <figure>
              <img loading="lazy" src="/api/photo/${encodeURIComponent(ph.r2_key)}"
                data-photo="${ph.id}" data-kind="${kind}"
                alt="${kind} photo" title="Click to view · ${esc(ph.taken_by)} · ${esc(stamp(ph.taken_at))}">
              ${committed ? '' : `<button class="rm" data-rm="${ph.id}" title="Remove">×</button>`}
            </figure>`).join('');
          /* Not due yet, and not unlocked. Openable, not forbidden — you drop
             the evening before, or collect early when someone finishes — and
             the history records that you did. Both ends behave the same way;
             two cards that look identical should not follow different rules. */
          const today = todayISO();
          const notDue = !done && (
            (key === 'delivered' && !r.delivery_unlocked_at && r.start_date && r.start_date > today) ||
            (key === 'returned' && !waiting && !r.pickup_unlocked_at && r.due_date && r.due_date > today));
          const dueOn = key === 'delivered' ? r.start_date : r.due_date;
          return `
          <div class="step photorow${waiting ? ' waiting' : ''}${notDue ? ' datelocked' : ''}" data-done="${done}">
            <div class="top">
              <button class="tick"${waiting || notDue ? ' disabled' : ` data-step="${key}"`} data-done="${done}">✓</button>
              <span class="lbl">${label}</span>
              ${waiting ? '<span class="soon">after the bins are delivered</span>' : ''}
              ${notDue ? `<span class="notdue">not due ${key === 'delivered' ? 'out' : 'back'} until ${esc(niceDate(dueOn))}</span>
                <button class="lockbtn" data-unlock="${key}" title="Open this step early">🔒 Unlock</button>`
                : `<span class="when" style="margin-left:auto">${r[col] ? esc(ago(r[col])) : ''}</span>`}
            </div>
            ${r[col] ? `<div class="by">${key === 'delivered' ? 'Dropped off' : 'Collected'}
              <strong>${esc(stamp(r[col]))}</strong>${
                (key === 'delivered' ? r.delivered_by : r.returned_by)
                  ? ` by <strong>${esc((key === 'delivered' ? r.delivered_by : r.returned_by).split('@')[0])}</strong>` : ''}
              <span style="opacity:.7">&middot; Mountain Time</span></div>` : ''}
            <div class="addr">
              <label>${kind === 'delivery' ? 'Delivery address' : 'Pickup address'}</label>
              ${(() => {
                const val = (kind === 'delivery' ? r.delivery_address : r.pickup_address) || '';
                const id = kind === 'delivery' ? 'r-daddr' : 'r-paddr';
                return `
                <div class="shown">
                  <span class="val${val ? '' : ' empty'}">${
                    esc(val || (kind === 'delivery' ? 'Not given yet' : 'Same as delivery'))}</span>
                  ${r[col] ? '' : `<button class="btn sm" data-editaddr="${id}">${val ? 'Edit' : 'Add'}</button>`}
                </div>
                <div class="edit" hidden>
                  <input data-part="${kind}_street" value="${esc(r[kind + '_street'] || '')}"
                    placeholder="Street address">
                  <input data-part="${kind}_unit" value="${esc(r[kind + '_unit'] || '')}"
                    placeholder="Apartment or unit (optional)" style="margin-top:7px">
                  <div style="display:flex;gap:7px;margin-top:7px">
                    <input data-part="${kind}_city" value="${esc((kind === 'delivery' ? r.delivery_city : r.pickup_city) || '')}"
                      placeholder="City" style="flex:1">
                    <input data-part="${kind}_zip" value="${esc(r[kind + '_zip'] || '')}"
                      placeholder="ZIP" maxlength="5" style="width:80px">
                  </div>
                  <div class="saverow">
                    <button class="btn sm primary" data-saveaddr="1">Save</button>
                    <button class="btn sm" data-canceladdr="1">Cancel</button>
                    <span class="saved" data-savedmsg="1"></span>
                  </div>
                </div>`;
              })()}
              ${(kind === 'delivery' ? r.delivery_notes : r.pickup_notes)
                ? `<div class="cust"><b>From the customer</b>${
                    esc(kind === 'delivery' ? r.delivery_notes : r.pickup_notes)}</div>` : ''}
              ${r[col] ? '' : `<div class="win" data-winbox="${kind}">
                <label for="w-${kind}">Window</label>
                <input id="w-${kind}" data-window="${kind}_window" value="${esc(r[kind + '_window'] || '')}"
                  placeholder="6–8pm" maxlength="40">
                <span class="saved" data-winmsg="${kind}"></span>
              </div>`}
            </div>
            <div class="ev">
              ${notDue
                ? `<span class="soon">Unlock this step to add a photo.</span>`
                : waiting
                ? '<span class="soon">The pickup photo is taken when the bins come back.</span>'
                : `${thumbs || (committed ? '' : `<span class="need">Photo needed</span>`)}
                   ${committed ? '' : `<label class="shoot">
                     <input type="file" accept="image/*" capture="environment" data-kind="${kind}" data-step="${key}" multiple>
                     <span>📷 ${mine.length ? 'Add another' : `Take ${kind} photo`}</span>
                   </label>`}`}
            </div>
            ${committed ? '<div class="locked-note">Photos are part of this record and can no longer be removed.</div>' : `
            <div class="staged" id="stage-${key}" hidden>
              <div class="strip" id="strip-${key}"></div>
              <button class="btn sm primary commit" data-commit="${key}"></button>
            </div>`}
          </div>`;
        }

        // A customer's own signature is locked here, the way Square's payment is.
        const sigLocked = key === 'agreement' && r.signed_at && !r.agreement_manual;
        return `
        <button class="step" data-step="${key}" data-done="${done}" data-locked="${sigLocked ? 1 : 0}"${
          sigLocked ? ' aria-disabled="true"' : ''}>
          <span class="tick">✓</span><span class="lbl">${label}</span>
          ${sigLocked ? '<span class="src">signed by customer</span>' : ''}
          <span class="when">${r[col] ? esc(ago(r[col])) : ''}</span>
        </button>`; }).join('')}</div>`}

      
        <div id="rent-charges"></div>
        <div id="r-msg" style="margin-top:14px"></div>
      
      </div>
      <aside class="rside">
        <div class="card side">
      ${actions ? `<div class="contactbar">${actions}${
        pref ? `<span class="prefnote">prefers ${esc(pref)}</span>` : ''}</div>` : ''}

      
        <dl class="kv">
        <dt>Package</dt><dd>${r.bins} bins · ${r.weeks === 1 ? '1 week' : r.weeks + ' weeks'}</dd>
        <dt>Total</dt><dd>${esc(money(r.total_cents))} <span style="color:var(--muted);font-weight:400">before tax</span></dd>
        <dt>Delivered</dt><dd>${esc(niceDate(r.start_date))}</dd>
        <dt>Back by</dt><dd>${esc(niceDate(r.due_date))}</dd>
        <dt>Phone</dt><dd>${esc(r.phone || '—')}</dd>
        <dt>Email</dt><dd>${esc(r.email || '—')}</dd>
      </dl>
        </div>
        ${r.confirm_token ? `<div class="linkbox">
          <h4>Confirmation link${r.confirm_sent_at
            ? ` — emailed to ${esc(r.email)} ${esc(ago(r.confirm_sent_at))}`
            : ' — not sent yet'}</h4>
          <code>${esc(`https://${bookingHost}/${r.confirm_token}`)}</code>
          <div class="row">
            ${isOwner() ? `<button class="btn sm${r.confirm_sent_at ? '' : ' primary'}" id="r-send">${
              r.confirm_sent_at ? 'Resend email' : 'Email it to them'}</button>` : ''}
            <button class="btn sm" id="r-copy">Copy link</button>
            <a class="btn sm" href="${esc(`https://${bookingHost}/${r.confirm_token}`)}" target="_blank" rel="noopener">Preview</a>
          </div>
        </div>` : ''}

      ${r.signed_at ? (r.agreement_manual
        ? `<p class="signed"><span style="color:var(--warn);font-weight:700">Recorded by staff</span> —
           ${esc(r.agreement_manual_by || '—')} ${esc(ago(r.signed_at))}${
             r.agreement_manual_reason ? ` · ${esc(r.agreement_manual_reason)}` : ''}.
           Not a customer e-signature.</p>`
        : `<p class="signed">Signed by <strong>${esc(r.agreement_name)}</strong>
           ${esc(ago(r.signed_at))} · agreement ${esc(r.agreement_version || '—')}${
             r.signed_on_behalf ? ` · <span style="color:var(--warn);font-weight:700">on behalf of ${esc(fullName(r))}</span>` : ''}</p>`) : ''}


      
        <div class="card side" id="rent-bins"></div>
        


      <div style="height:20px"></div>
      ${r.square_invoice_id ? `<label class="holdline">
        <input type="checkbox" id="ph-hold"${r.photo_hold ? ' checked' : ''}>
        <span>Keep photos past the 90-day limit &mdash; there&rsquo;s a dispute open</span>
      </label>` : ''}
      
      <div id="rent-exts"></div>
      <div id="rent-notes"></div>
      <div id="rent-history" style="margin-top:6px"></div>

      
        <div class="actions" style="margin-top:20px;border-top:1px solid var(--line);padding-top:18px">
        ${!isOwner() ? ''
          : r.status === 'cancelled'
          ? '<button class="btn" data-status="pending">Reinstate</button>'
          : r.returned_at
          /* Finished. Offering "cancel" on a rental that ran its course invites
             erasing something that happened; the honest remedies are a refund
             in Square and a note explaining it. */
          ? `<span style="color:var(--muted);font-size:13px">Finished ${esc(stamp(r.returned_at))}.
             Refunds are issued in Square.</span>`
          : `${r.delivered_at ? '' : '<button class="btn" id="r-move">Change date</button>'}
             <button class="btn danger" data-status="cancelled">Cancel rental</button>`}
      </div>
    
      </aside>
    </div>`));
  window.scrollTo(0, scrollY);
  const msg = drawer.querySelector('#r-msg');

  const patch = async (body) => {
    msg.replaceChildren();
    const res = await api(`/rentals/${id}`, { method: 'PATCH', body: JSON.stringify(body) });
    await refreshCounts();
    return res;
  };

  drawer.querySelectorAll('.step[data-step], .payrow .tick, .photorow .tick, .inspectrow .tick').forEach(b => b.addEventListener('click', async () => {
    if (b.dataset.locked === '1') return;
    const done = b.dataset.done === '1';
    // Undoing a milestone is a correction, not a routine action — a stray click
    // should not quietly rewrite what happened.
    const label = b.querySelector('.lbl')?.textContent || 'Payment';
    if (done && !confirm(`Undo "${label}"?`)) return;
    try {
      await patch({ milestone: b.dataset.step, done: !done });
      openRental(id);
    } catch (err) {
      // Delivering something unpaid is allowed, but only on purpose.
      // A hard ordering rule — nothing comes back before it goes out. No reason
      // makes it true, so there is nothing to prompt for.
      if (/cannot come back|already marked back|nothing to photograph/i.test(err.message)) {
        msg.replaceChildren(banner(err.message));
        return;
      }
      // Delivering early is a decision, not an error.
      if (/Deliver anyway\?/i.test(err.message)) {
        if (!confirm(err.message)) return;
        try { await patch({ milestone: b.dataset.step, done: true, force: true }); openRental(id); }
        catch (e2) { msg.replaceChildren(banner(e2.message)); }
        return;
      }
      // The customer signs through their own link; recording it here instead is
      // allowed but has to say how they actually agreed.
      if (/say how they agreed/i.test(err.message)) {
        const why = prompt('The customer signs through their own link.\n\nIf they agreed another way — a paper copy at the door, or on a call — say how:');
        if (why === null || !why.trim()) return;
        try { await patch({ milestone: 'agreement', done: true, reason: why }); openRental(id); }
        catch (e2) { msg.replaceChildren(banner(e2.message)); }
        return;
      }
      // No photo. Allowed, but the reason is recorded rather than shrugged off.
      if (/photo yet/i.test(err.message)) {
        const why = prompt(`${err.message}\n\nWhy is there no photo?`);
        if (why === null || !why.trim()) return;
        try {
          await patch({ milestone: b.dataset.step, done: true, force: true, photo_reason: why });
          openRental(id);
        } catch (e2) { msg.replaceChildren(banner(e2.message)); }
        return;
      }
      msg.replaceChildren(banner(err.message));
    }
  }));

  drawer.querySelectorAll('[data-unlock]').forEach(b => b.addEventListener('click', async () => {
    const step = b.dataset.unlock;
    const when = niceDate(step === 'delivered' ? r.start_date : r.due_date);
    const what = step === 'delivered' ? "aren't due out" : "aren't due back";
    if (!confirm(`These bins ${what} until ${when}.\n\nUnlock this step anyway? It'll be recorded.`)) return;
    try { await api(`/rentals/${id}/unlock`, { method: 'POST', body: JSON.stringify({ step }) }); openRental(id); }
    catch (err) { msg.replaceChildren(banner(err.message)); }
  }));

  /* Photos are staged in the browser and committed with the milestone in one
     action. A visit is one event: uploading the first picture should not decide
     the delivery happened while someone is still walking round taking the rest. */
  const staged = { delivered: [], returned: [] };

  const drawStage = step => {
    const box = drawer.querySelector(`#stage-${step}`);
    if (!box) return;
    const strip = drawer.querySelector(`#strip-${step}`);
    const list = staged[step];
    box.hidden = !list.length;
    strip.replaceChildren(...list.map((f, i) => {
      const fig = $(`<figure><img alt="new photo"><button class="rm" title="Remove">×</button></figure>`);
      fig.querySelector('img').src = URL.createObjectURL(f);
      fig.querySelector('.rm').addEventListener('click', () => {
        staged[step].splice(i, 1);
        drawStage(step);
      });
      return fig;
    }));
    box.querySelector('[data-commit]').textContent =
      `Upload ${list.length} photo${list.length === 1 ? '' : 's'} and mark ${
        step === 'delivered' ? 'delivered' : 'returned'}`;
  };

  drawer.querySelectorAll('.photorow input[type="file"]').forEach(input =>
    input.addEventListener('change', () => {
      const step = input.dataset.step;
      staged[step].push(...input.files);
      input.value = '';
      drawStage(step);
    }));

  drawer.querySelectorAll('[data-commit]').forEach(b => b.addEventListener('click', async () => {
    const step = b.dataset.commit;
    const kind = step === 'delivered' ? 'delivery' : 'pickup';
    const files = staged[step];
    if (!files.length) return;
    b.disabled = true;
    msg.replaceChildren();
    try {
      for (const [i, file] of files.entries()) {
        b.textContent = `Uploading ${i + 1} of ${files.length}…`;
        const res = await fetch(`/api/rentals/${id}/photos?kind=${kind}`, {
          method: 'POST',
          headers: { 'Content-Type': file.type || 'image/jpeg' },
          body: file,
        });
        if (!res.ok) throw new Error((await res.json()).error || `Upload failed (${res.status})`);
      }
      b.textContent = 'Marking…';
      // Photos are up; the milestone is the commit. Forced because the
      // evidence is already stored — refusing now would leave them orphaned.
      await patch({ milestone: step, done: true, force: true, photo_reason: 'photographed' });
      openRental(id);
    } catch (err) {
      b.disabled = false;
      drawStage(step);
      msg.replaceChildren(banner(err.message));
    }
  }));

  drawer.querySelectorAll('.photorow figure img[data-photo]').forEach(img =>
    img.addEventListener('click', () => {
      const kind = img.dataset.kind;
      const set = photos.filter(p => p.kind === kind);
      openLightbox(set, set.findIndex(p => String(p.id) === img.dataset.photo));
    }));

  drawer.querySelectorAll('.photorow [data-rm]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Remove this photo? The record that it existed stays.')) return;
    try { await api(`/photos/${b.dataset.rm}`, { method: 'DELETE' }); openRental(id); }
    catch (err) { msg.replaceChildren(banner(err.message)); }
  }));

  drawer.querySelector('#ph-hold')?.addEventListener('change', async e => {
    try {
      await api(`/rentals/${id}/photo-hold`, { method: 'POST', body: JSON.stringify({ hold: e.target.checked }) });
    } catch (err) {
      e.target.checked = !e.target.checked;
      msg.replaceChildren(banner(err.message));
    }
  });

  chargesPanel(drawer.querySelector('#rent-charges'), id, r);
  binsPanel(drawer.querySelector('#rent-bins'), id, r);
  extensionsPanel(drawer.querySelector('#rent-exts'), id, r);
  notesPanel(drawer.querySelector('#rent-notes'), 'rentals', id);
  historyPanel(drawer.querySelector('#rent-history'), 'rentals', id);

  drawer.querySelector('#r-send')?.addEventListener('click', async e => {
    const was = e.target.textContent;
    e.target.disabled = true; e.target.textContent = 'Sending…';
    msg.replaceChildren();
    try {
      await api(`/rentals/${id}/send`, { method: 'POST' });
      openRental(id);
    } catch (err) {
      msg.replaceChildren(banner(err.message));
      e.target.disabled = false; e.target.textContent = was;
    }
  });

  drawer.querySelector('#r-copy')?.addEventListener('click', async e => {
    try {
      await navigator.clipboard.writeText(`https://${bookingHost}/${r.confirm_token}`);
      e.target.textContent = 'Copied';
      setTimeout(() => { e.target.textContent = 'Copy link'; }, 1500);
    } catch { e.target.textContent = 'Copy failed'; }
  });

  drawer.querySelector('#r-invoice')?.addEventListener('click', async e => {
    e.target.disabled = true;
    e.target.textContent = 'Sending…';
    msg.replaceChildren();
    try {
      await api(`/rentals/${id}/invoice`, { method: 'POST' });
      await refreshCounts();
      openRental(id);
    } catch (err) {
      msg.replaceChildren(banner(err.message));
      e.target.disabled = false;
      e.target.textContent = 'Create invoice & email the customer';
    }
  });

  drawer.querySelector('#r-sync')?.addEventListener('click', async e => {
    e.target.disabled = true;
    e.target.textContent = 'Checking…';
    msg.replaceChildren();
    try {
      await api(`/rentals/${id}/sync`, { method: 'POST' });
      await refreshCounts();
      openRental(id);
    } catch (err) {
      msg.replaceChildren(banner(err.message));
      e.target.disabled = false;
      e.target.textContent = 'Check for payment';
    }
  });

  drawer.querySelectorAll('[data-editaddr]').forEach(b => b.addEventListener('click', () => {
    const box = b.closest('.addr');
    box.querySelector('.shown').hidden = true;
    box.querySelector('.edit').hidden = false;
    box.querySelector('input').focus();
  }));

  drawer.querySelectorAll('[data-canceladdr]').forEach(b => b.addEventListener('click', () => {
    const box = b.closest('.addr');
    box.querySelector('.edit').hidden = true;
    box.querySelector('.shown').hidden = false;
  }));

  // Either row's Save writes both fields — they are one record, and a driver
  // correcting the pickup address should not silently drop an edit to delivery.
  drawer.querySelectorAll('[data-saveaddr]').forEach(b => b.addEventListener('click', async () => {
    const state = b.parentElement.querySelector('[data-savedmsg]');
    b.disabled = true; state.textContent = 'Saving…';
    try {
      const parts = {};
      drawer.querySelectorAll('[data-part]').forEach(i => { parts[i.dataset.part] = i.value; });
      await patch(parts);
      openRental(id);
      return;
    } catch (err) { state.textContent = ''; msg.replaceChildren(banner(err.message)); }
    b.disabled = false;
  }));

  drawer.querySelectorAll('[data-status]').forEach(b => b.addEventListener('click', async () => {
    let reason;
    if (b.dataset.status === 'cancelled') {
      /* §8: full refund 48h or more before delivery, half under that. The
         panel does the arithmetic so the person on the phone does not have to,
         and says it before the reason is typed, not after. */
      let head = 'Why is this being cancelled?';
      if (r.paid_at) {
        try {
          const p = await api(`/rentals/${id}/cancel-preview`);
          head = `They paid ${money(p.paid_cents)}. This is ${p.hours_before >= 48 ? '48 hours or more' : 'under 48 hours'} before delivery, so §8 says refund ${p.percent}% — ${money(p.cents)}.\n\nCancelling here does NOT move money: issue the ${money(p.cents)} refund in Square.\n\nWhy is it being cancelled?`;
        } catch { head = 'This rental has been paid. Cancelling here does NOT refund anything — issue that in Square.\n\nWhy is it being cancelled?'; }
      }
      reason = prompt(head);
      if (reason === null || !reason.trim()) return;
    }
    try {
      const res = await patch({ status: b.dataset.status, reason });
      if (res.refund?.cents) alert(`Cancelled. Refund ${money(res.refund.cents)} (${res.refund.percent}%) in Square — it is on the history for this rental.`);
      openRental(id);
    }
    catch (err) { msg.replaceChildren(banner(err.message)); }
  }));

  /* Moving the dates. Only before the bins go out — after that it is an
     extension, and the button is not there to tempt anyone. */
  /* When hours have been entered, the window is one of tonight's slots with
     room, not free text — the same list the customer chose from. Free text
     stays for a rental whose day has nobody on (a favour, a one-off). */
  for (const kind of ['delivery', 'pickup']) {
    const box = drawer.querySelector(`[data-winbox="${kind}"]`);
    if (!box) continue;
    const date = kind === 'delivery' ? r.start_date : r.due_date;
    if (!date) continue;
    api(`/coverage?from=${date}&days=1`).then(({ days: [day] }) => {
      if (!day.configured || !day.open) return;
      // A window typed before slots existed still lights its button.
      const cur = r[`${kind}_slot`] || day.slots.find(sl => sl.label === r[`${kind}_window`])?.start;
      const opts = day.slots.map(sl => `<button class="slotbtn${sl.start === cur ? ' on' : ''}${sl.free <= 0 && sl.start !== cur ? ' full' : ''}"
        data-slot="${sl.start}" title="${sl.free} of ${sl.capacity} free">${esc(sl.label)}</button>`).join('');
      box.replaceChildren($(`<div class="slotrow"><label>Window</label>${opts}<span class="saved" data-winmsg="${kind}"></span></div>`));
      box.querySelectorAll('.slotbtn').forEach(b => b.addEventListener('click', async () => {
        const msg = box.querySelector('[data-winmsg]');
        const full = b.classList.contains('full');
        if (full && !confirm(`${b.textContent} is full. Book it anyway?`)) return;
        try {
          await api(`/rentals/${id}`, { method: 'PATCH', body: JSON.stringify({ [`${kind}_slot`]: b.dataset.slot, force: full }) });
          box.querySelectorAll('.slotbtn').forEach(x => x.classList.toggle('on', x === b));
          msg.textContent = 'Saved';
        } catch (err) { msg.textContent = err.message; }
      }));
    }).catch(() => {});
  }

  /* The window saves itself on the way out of the field — it is one phrase,
     and a Save button for one phrase is a button nobody presses. */
  drawer.querySelectorAll('[data-window]').forEach(inp => inp.addEventListener('change', async () => {
    const msg = drawer.querySelector(`[data-winmsg="${inp.dataset.window.split('_')[0]}"]`);
    try {
      await api(`/rentals/${id}`, { method: 'PATCH', body: JSON.stringify({ [inp.dataset.window]: inp.value }) });
      msg.textContent = 'Saved';
      r[inp.dataset.window] = inp.value.trim() || null;
    } catch (err) { msg.textContent = err.message; }
  }));

  drawer.querySelector('#r-move')?.addEventListener('click', async () => {
    const to = prompt(`New delivery date (currently ${r.start_date}). The return date moves with it — ${r.weeks === 1 ? '1 week' : r.weeks + ' weeks'} stays ${r.weeks === 1 ? '1 week' : r.weeks + ' weeks'}.\n\nYYYY-MM-DD:`, r.start_date);
    if (to === null || !to.trim() || to.trim() === r.start_date) return;
    const reason = prompt('Why? (optional — goes on the history and in the email to the customer)') ?? '';
    try {
      const res = await api(`/rentals/${id}/reschedule`, { method: 'POST', body: JSON.stringify({ start_date: to.trim(), reason }) });
      if (res.note) alert(res.note);
      openRental(id);
    } catch (err) { msg.replaceChildren(banner(err.message)); }
  });
}

/* ---------- availability ----------

   When each person can drive: a weekly pattern, and days that differ. Shown
   on the Employees tab. Staff edit their own row; an owner edits anyone's.
   What it produces — who is on tonight, which hours have room — is on the
   Schedule tab and, for customers, on the address step of their link. */

const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const hhmm = v => /^([01]\d|2[0-3]):[0-5]\d$/.test(v) ? v : null;
const tlabel = t => { const [h, m] = t.split(':').map(Number); return `${h % 12 || 12}${m ? ':' + String(m).padStart(2, '0') : ''}${h < 12 ? 'am' : 'pm'}`; };

function availabilityPanel(container, employees) {
  const draw = async () => {
    let shifts;
    try { ({ shifts } = await api('/shifts')); }
    catch (err) { container.replaceChildren(banner(err.message)); return; }

    const canEdit = e => me.role === 'owner' || e.id === me.id;
    const people = employees.filter(e => e.active);
    const rows = people.map(e => {
      const mine = shifts.filter(s => s.employee_id === e.id);
      const pattern = WD.map((d, wd) => {
        const s = mine.find(x => x.weekday === wd);
        return `<td class="wd${s ? ' on' : ''}" data-emp="${e.id}" data-wd="${wd}" title="${d}${s ? ` ${tlabel(s.start)}–${tlabel(s.end)}` : ''}">${
          s ? `<b>${esc(tlabel(s.start))}</b><small>to ${esc(tlabel(s.end))}</small>` : '<span class="no">—</span>'}</td>`;
      }).join('');
      const oneOffs = mine.filter(s => s.date).sort((a, b) => a.date.localeCompare(b.date)).map(s =>
        `<span class="oneoff${s.off ? ' off' : ''}" title="${esc(s.note || '')}">${esc(niceDate(s.date))}: ${
          s.off ? `off${s.note ? ` — ${esc(s.note)}` : ''}` : `${esc(tlabel(s.start))}–${esc(tlabel(s.end))}`}${
          canEdit(e) ? ` <button class="linkish" data-rmshift="${s.id}">×</button>` : ''}</span>`).join('');
      return `<tr>
        <td><strong>${esc(e.name || e.email)}</strong>${canEdit(e) ? `<br><button class="linkish" data-addday="${e.id}">+ a day that differs</button>` : ''}</td>
        ${pattern}
        <td class="oneoffs">${oneOffs || '<span style="color:var(--muted)">—</span>'}</td>
      </tr>`;
    }).join('');

    container.replaceChildren($(`<div>
      <p class="sub">Click a day to set hours. ${shifts.length ? '' : '<strong>Nothing entered yet</strong> — until someone is, every evening counts as covered.'}</p>
      <table class="avail"><thead><tr><th>Who</th>${WD.map(d => `<th>${d}</th>`).join('')}<th>Days that differ</th></tr></thead>
      <tbody>${rows}</tbody></table>
      <div id="av-msg"></div>
    </div>`));

    const fail = err => container.querySelector('#av-msg').replaceChildren(banner(err.message));
    container.querySelectorAll('td.wd').forEach(td => td.addEventListener('click', async () => {
      const e = people.find(p => p.id === +td.dataset.emp);
      if (!canEdit(e)) return;
      const wd = +td.dataset.wd;
      const cur = shifts.find(s => s.employee_id === e.id && s.weekday === wd);
      const ans = prompt(`${e.name || e.email} on ${WD[wd]}s — hours as HH:MM-HH:MM (24h), or blank for not working:`, cur ? `${cur.start}-${cur.end}` : '17:00-21:00');
      if (ans === null) return;
      try {
        if (!ans.trim()) { if (cur) await api(`/shifts/${cur.id}`, { method: 'DELETE' }); }
        else {
          const [a, b] = ans.split(/\s*[-–]\s*/);
          if (!hhmm(a) || !hhmm(b)) throw new Error('Use HH:MM-HH:MM, like 17:00-21:00.');
          await api('/shifts', { method: 'POST', body: JSON.stringify({ employee_id: e.id, weekday: wd, start: a, end: b }) });
        }
        draw();
      } catch (err) { fail(err); }
    }));
    container.querySelectorAll('[data-addday]').forEach(b => b.addEventListener('click', async () => {
      const e = people.find(p => p.id === +b.dataset.addday);
      const date = prompt('Which date? (YYYY-MM-DD)', todayISO());
      if (!date) return;
      const ans = prompt('Hours as HH:MM-HH:MM, or "off" (add a reason after: off Dentist):', 'off');
      if (ans === null) return;
      try {
        const m = /^off\s*(.*)$/i.exec(ans.trim());
        if (m) await api('/shifts', { method: 'POST', body: JSON.stringify({ employee_id: e.id, date, off: true, note: m[1] }) });
        else {
          const [a, c] = ans.split(/\s*[-–]\s*/);
          if (!hhmm(a) || !hhmm(c)) throw new Error('Use HH:MM-HH:MM, or "off".');
          await api('/shifts', { method: 'POST', body: JSON.stringify({ employee_id: e.id, date, start: a, end: c }) });
        }
        draw();
      } catch (err) { fail(err); }
    }));
    container.querySelectorAll('[data-rmshift]').forEach(b => b.addEventListener('click', async () => {
      try { await api(`/shifts/${b.dataset.rmshift}`, { method: 'DELETE' }); draw(); } catch (err) { fail(err); }
    }));
  };
  draw();
}

/* ---------- calendar ----------

   A month at a glance: for each day, who is on, how many jobs are booked,
   and how many bins are free. The question it answers is "when can we take
   the next one" — the stoplight, but for a date you have not been asked for
   yet. */
async function viewCalendar() {
  const first = (schedState.month || todayISO()).slice(0, 8) + '01';
  const d0 = new Date(`${first}T12:00:00Z`);
  const monthName = d0.toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
  const startPad = d0.getUTCDay();
  const daysIn = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 0)).getUTCDate();
  const shift = n => { const d = new Date(d0); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 10); };

  const view = $(`<div>
    <div class="head"><h1>Calendar</h1>
      <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
        <button class="btn sm" id="cal-prev">‹</button><strong style="min-width:150px;text-align:center">${esc(monthName)}</strong><button class="btn sm" id="cal-next">›</button>
      </div></div>
    <p class="sub">Who is driving, what is booked, and how many bins are free each day. <a href="#/schedule">Back to tonight</a>.</p>
    <div class="month" id="month"><div class="empty">Loading…</div></div>
  </div>`);
  render('schedule', view);
  view.querySelector('#cal-prev').addEventListener('click', () => { schedState.month = shift(-1); viewCalendar(); });
  view.querySelector('#cal-next').addEventListener('click', () => { schedState.month = shift(1); viewCalendar(); });

  try {
    const [cov, sched, inv] = await Promise.all([
      api(`/coverage?from=${first}&days=${daysIn}`), api(`/schedule?from=${first}&days=${daysIn}`), api(`/inventory?from=${first}&days=${daysIn}`),
    ]);
    const cells = [];
    for (let i = 0; i < startPad; i++) cells.push('<div class="cell pad"></div>');
    for (let i = 0; i < daysIn; i++) {
      const c = cov.days[i], s = sched.days[i], a = inv.days[i];
      const past = c.date < todayISO();
      const jobs = s.jobs.length;
      const free = a.available;
      const cls = ['cell', past ? 'past' : '', c.date === todayISO() ? 'today' : '',
        c.blackout ? 'closed' : !c.open && c.configured ? 'nobody' : '', free < 0 ? 'over' : ''].filter(Boolean).join(' ');
      cells.push(`<a class="${cls}" href="#/schedule/${c.date}">
        <div class="n">${i + 1}${c.closedDay ? `<small>${esc(c.closedDay.slice(0, 3))} · closed</small>` : ''}</div>
        ${c.blackout ? `<div class="tag">Closed${c.blackout !== 'closed' ? ` · ${esc(c.blackout)}` : ''}</div>`
          : c.configured && !c.staff.length ? '<div class="tag">Nobody on</div>'
          : c.staff.length ? `<div class="who">${c.staff.map(x => esc(x.name.split('@')[0])).join(', ')}</div>` : ''}
        ${jobs ? `<div class="jobs">${jobs} job${jobs === 1 ? '' : 's'}${s.binsOut ? ` · ${s.binsOut} out` : ''}${s.binsBack ? ` · ${s.binsBack} back` : ''}</div>` : ''}
        <div class="free${free <= 0 ? ' none' : ''}">${free < 0 ? `${-free} short` : `${free} free`}</div>
      </a>`);
    }
    view.querySelector('#month').replaceChildren($(`<div>
      <div class="dow">${WD.map(d => `<div>${d}</div>`).join('')}</div>
      <div class="grid">${cells.join('')}</div>
    </div>`));
  } catch (err) {
    view.querySelector('#month').replaceChildren(banner(err.message));
  }
}

/* ---------- my hours ----------

   The staff view of the Employees page: one row, theirs. The list, roles and
   the activity log are the owner's business. */
async function viewMyHours() {
  const view = $(`<div>
    <div class="head"><h1>My hours</h1></div>
    <p class="sub">When you can drive. Click a day to set hours; add a day that differs for time off or extra shifts.</p>
    <div class="card" id="avail" style="padding:16px 18px"><div class="empty">Loading…</div></div>
  </div>`);
  render('employees', view);
  availabilityPanel(view.querySelector('#avail'), [{ id: me.id, name: me.name, email: me.email, active: 1 }]);
}

/* ---------- customers ----------

   One row per person: everyone who has asked for bins or rented them. The
   list answers "have we dealt with them" and "who should we call in March";
   the record holds their rentals, their requests — including the declined
   and lapsed ones, which are leads rather than dead rows — and notes that
   outlive any one rental. */

const custState = { filter: 'all', q: '' };
const CUST_FILTERS = [['all', 'Everyone'], ['renters', 'Past renters'], ['lapsed', 'Lapsed'], ['declined', 'Declined']];
const custName = c => [c.first_name, c.last_name].filter(Boolean).join(' ') || c.email || c.phone || '(no name)';
const fmtPhone = p => p && p.length === 10 ? `(${p.slice(0, 3)}) ${p.slice(3, 6)}-${p.slice(6)}` : (p || '');

async function viewCustomers() {
  const view = $(`<div>
    <div class="head"><h1>Customers</h1><span class="count" id="ccount"></span></div>
    <p class="sub">Everyone who has asked or rented. Finished rentals and answered requests live here.</p>
    <div class="toolbar">
      <div class="seg">${CUST_FILTERS.map(([f, label]) =>
        `<button data-f="${f}" aria-pressed="${f === custState.filter}">${label}</button>`).join('')}</div>
      <input class="search" placeholder="Name, email, phone, city…" value="${esc(custState.q)}">
    </div>
    <div class="card" id="clist"><div class="empty">Loading…</div></div>
  </div>`);
  render('customers', view);
  view.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { custState.filter = b.dataset.f; viewCustomers(); }));
  let t;
  view.querySelector('.search').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { custState.q = e.target.value; load(); }, 200); });

  const list = view.querySelector('#clist');
  const load = async () => {
    try {
      const { customers } = await api(`/customers?filter=${custState.filter}&q=${encodeURIComponent(custState.q)}`);
      view.querySelector('#ccount').textContent = customers.length || '';
      if (!customers.length) {
        list.replaceChildren($(`<div class="empty"><strong>Nobody here</strong>${custState.q ? 'Try a different search.' : 'People appear as requests come in.'}</div>`));
        return;
      }
      const rows = customers.map(c => `<tr class="clickable" data-id="${c.id}">
        <td><div class="who">${esc(custName(c))}<small>${esc(c.email || '')}${c.email && c.phone ? ' · ' : ''}${esc(fmtPhone(c.phone))}</small></div></td>
        <td class="hide-sm">${esc(c.city || '—')}</td>
        <td class="nowrap">${c.finished ? `${c.finished} rental${c.finished === 1 ? '' : 's'}` : '<span style="color:var(--muted)">—</span>'}${
          c.rentals > c.finished ? ` <span class="pill confirmed">${c.rentals - c.finished} live</span>` : ''}</td>
        <td class="nowrap num hide-sm">${c.spent_cents ? esc(money(c.spent_cents)) : '—'}</td>
        <td class="nowrap">${c.open_requests && !c.lapsed ? '<span class="pill new">asking</span>' : ''}${
          c.lapsed ? '<span class="pill lapsed">lapsed</span>' : ''}${c.declined ? ' <span class="pill declined">declined</span>' : ''}</td>
        <td class="nowrap hide-sm" style="color:var(--muted)">${c.last_seen ? esc(ago(c.last_seen)) : ''}</td>
      </tr>`).join('');
      const table = $(`<table><thead><tr><th>Who</th><th class="hide-sm">City</th><th>Rented</th><th class="hide-sm">Spent</th><th></th><th class="hide-sm">Last</th></tr></thead><tbody>${rows}</tbody></table>`);

      list.replaceChildren(table);
    } catch (err) { list.replaceChildren($(`<div class="empty">${esc(err.message)}</div>`)); }

  load();
}

async function viewCustomer(id) {

    <td class="nowrap">${q.kind === 'contact' ? '<em style="color:var(--muted)">Question</em>' : esc(pkg(q))}</td>
    <td class="nowrap num">${esc(niceDate(q.start_date))}</td>
    <td class="hide-sm" style="color:var(--muted)">${esc(q.decline_reason || q.message?.slice(0, 60) || '')}</td>

    <div class="rhead">
      <a class="back" href="#/customers">&larr; Customers</a>
      <div class="title"><h1>${esc(custName(c))}</h1>
        <div class="meta">${[c.city, c.email, fmtPhone(c.phone)].filter(Boolean).map(esc).join(' · ')}
          · customer since ${esc(niceDate(c.created_at.slice(0, 10)))}</div></div>
    </div>
    <div class="rgrid">
      <div class="rmain">
        ${live.length ? `<h3 class="sect">Live rental${live.length === 1 ? '' : 's'}</h3>
          <div class="card"><table><tbody>${live.map(rentalRow).join('')}</tbody></table></div>` : ''}
        <h3 class="sect">Past rentals <span class="cnt">${past.length}${spent ? ` · ${esc(money(spent))} paid` : ''}</span></h3>
        <div class="card">${past.length ? `<table><tbody>${past.map(rentalRow).join('')}</tbody></table>`
          : '<div class="empty">No finished rentals yet.</div>'}</div>
        <h3 class="sect">Requests <span class="cnt">${requests.length}</span></h3>
        <div class="card">${requests.length ? `<table><tbody>${requests.map(requestRow).join('')}</tbody></table>`
          : '<div class="empty">None.</div>'}</div>
      </div>
      <aside class="rside">
        <div class="card side">
          ${contact ? `<div class="contactbar">${contact}</div>` : ''}
          <dl class="kv">
            <dt>Email</dt><dd>${esc(c.email || '—')}</dd>
            <dt>Phone</dt><dd>${esc(fmtPhone(c.phone) || '—')}</dd>
            <dt>City</dt><dd>${esc(c.city || '—')}</dd>
          </dl>
          ${isOwner() ? '<button class="btn sm" id="c-edit" style="margin-top:10px">Edit details</button>' : ''}
        </div>
        <div id="cust-notes"></div>
      </aside>
    </div>`));

  page.querySelectorAll('[data-rental]').forEach(tr => tr.addEventListener('click', () => { location.hash = `#/rentals/${tr.dataset.rental}`; }));
  page.querySelectorAll('[data-request]').forEach(tr => tr.addEventListener('click', () => openRequest(tr.dataset.request)));
  notesPanel(page.querySelector('#cust-notes'), 'customers', id);
  page.querySelector('#c-edit')?.addEventListener('click', async () => {
    const first = prompt('First name', c.first_name || ''); if (first === null) return;
    const last = prompt('Last name', c.last_name || ''); if (last === null) return;
    const email = prompt('Email', c.email || ''); if (email === null) return;
    const phone = prompt('Phone', fmtPhone(c.phone)); if (phone === null) return;
    const city = prompt('City', c.city || ''); if (city === null) return;
    try {
      await api(`/customers/${id}`, { method: 'PATCH', body: JSON.stringify({ first_name: first, last_name: last, email, phone, city }) });
      viewCustomer(id);
    } catch (err) { page.querySelector('.rside').prepend(banner(err.message)); }
  });
}

    <p class="sub">Everything anyone has done, newest first.</p>
    <div class="card" id="activity"><div class="empty">Loading…</div></div>
  </div>`);
  render('employees', view);

  const msg = view.querySelector('#emsg');
  const reload = async () => {
    try {
      const { employees, domain } = await api('/employees');
      view.querySelector('#emform').replaceChildren(
        $(`<div class="banner info">Anyone with an <strong>@${esc(domain)}</strong> mailbox can sign in and is added here automatically. Add addresses below to let in anyone else.</div>`),
      );
      if (me.role === 'owner') {
        const form = $(`<form class="formrow">
          <div class="f"><label class="fl" for="nemail">Email</label><input id="nemail" type="email" required placeholder="person@example.com"></div>
          <div class="f"><label class="fl" for="nname">Name</label><input id="nname" placeholder="Optional"></div>
          <div class="f" style="max-width:130px"><label class="fl" for="nrole">Role</label>
            <select id="nrole"><option value="staff">Staff</option><option value="owner">Owner</option></select></div>
          <button class="btn primary" type="submit">Add</button>
        </form>`);
        form.addEventListener('submit', async e => {
          e.preventDefault();
          msg.replaceChildren();
          const btn = form.querySelector('button');
          btn.disabled = true;
          try {
            await api('/employees', { method: 'POST', body: JSON.stringify({
              email: form.querySelector('#nemail').value,
              name: form.querySelector('#nname').value,
              role: form.querySelector('#nrole').value,

            form.reset();

          } catch (err) { msg.replaceChildren(banner(err.message)); }

      const rows = employees.map(e => `<tr>
        <td><div class="who">${esc(e.name || '—')}<small>${esc(e.email)}</small></div></td>
        <td><span class="pill ${e.role}">${e.role}</span></td>
        <td>${e.active ? '<span style="color:var(--ok);font-weight:600">Active</span>' : '<span class="pill off">Revoked</span>'}</td>
        <td class="nowrap hide-sm" style="color:var(--muted)">${e.last_seen_at ? esc(ago(e.last_seen_at)) : 'never'}</td>
        <td class="nowrap" style="text-align:right">${
          me.role === 'owner' && e.email !== me.email
            ? `<button class="btn sm ${e.active ? 'danger' : ''}" data-id="${e.id}" data-active="${e.active ? 0 : 1}">${e.active ? 'Revoke' : 'Restore'}</button>`
            : '<span style="color:var(--muted);font-size:12px">—</span>'}</td>
      </tr>`).join('');

      const table = $(`<table><thead><tr>
        <th>Person</th><th>Role</th><th>Access</th><th class="hide-sm">Last seen</th><th></th>
      </tr></thead><tbody>${rows}</tbody></table>`);
      loadActivity(view.querySelector('#activity'));

      table.querySelectorAll('button[data-id]').forEach(b => b.addEventListener('click', async () => {
        msg.replaceChildren();
        b.disabled = true;
        try {
          await api(`/employees/${b.dataset.id}`, { method: 'PATCH', body: JSON.stringify({ active: b.dataset.active === '1' }) });
