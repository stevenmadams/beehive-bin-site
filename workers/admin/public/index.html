<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Beehive Bin Co. — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FFC400; --yellow-deep:#E3A800;
  --ink:#15130F; --char:#211E18; --paper:#F2F1EB; --white:#fff;
  --muted:#6B675C; --line:rgba(21,19,15,.14);
  --ok:#1F7A4C; --warn:#B4531A; --bad:#A32C2C;
  --font-display:"Archivo Black","Archivo","Arial Black",system-ui,sans-serif;
  --font-body:"Archivo",Inter,system-ui,-apple-system,sans-serif;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font-body);background:var(--paper);color:var(--ink);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:400;letter-spacing:-.02em;line-height:1.05;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}

/* ---- shell ---- */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{background:var(--ink);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand .name{font-family:var(--font-display);font-size:16px;letter-spacing:.01em;display:block}
.brand .tag{display:block;font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--yellow);text-transform:uppercase;margin-top:4px}
nav{padding:12px 10px;flex:1;overflow:auto}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;text-decoration:none;
  color:rgba(255,255,255,.72);font-weight:500;margin-bottom:2px}
nav a:hover{background:rgba(255,255,255,.07);color:#fff}
nav a[aria-current="page"]{background:var(--yellow);color:var(--ink);font-weight:600}
nav a .ico{width:17px;height:17px;flex:none;opacity:.9;display:inline-flex}
nav a .ico svg{width:17px;height:17px}
nav a .badge{margin-left:auto;background:var(--yellow);color:var(--ink);font-size:11px;font-weight:700;
  border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
nav a[aria-current="page"] .badge{background:var(--ink);color:var(--yellow)}
nav a.soon{opacity:.42;cursor:default}
nav a.soon:hover{background:none;color:rgba(255,255,255,.72)}
.rail-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:rgba(255,255,255,.6)}
.rail-foot strong{display:block;color:#fff;font-weight:600;font-size:13px;word-break:break-all}
.rail-foot .role{display:inline-block;margin-top:5px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--yellow);font-weight:700}

main{padding:26px 30px 60px;max-width:1160px}
.head{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.head h1{font-size:30px}
.head .count{color:var(--muted);font-weight:600}
.head .newreq{margin-left:auto;align-self:center}
.pill.manual{background:rgba(21,19,15,.08);color:var(--muted);font-weight:600}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.frow.one{grid-template-columns:1fr}
.dbody input,.dbody select{width:100%;padding:9px 11px;border:1px solid var(--line);
  border-radius:9px;background:var(--white)}
.quote{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:11px 14px;
  margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.quote strong{font-family:var(--font-display);font-size:21px}
.quote small{color:var(--muted)}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.contactbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.contactbar .prefnote{font-size:11px;color:var(--muted);font-weight:700;
  text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--muted);margin:0 0 20px}

/* ---- controls ---- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;background:rgba(21,19,15,.06);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;
  color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.search{flex:1;min-width:190px;max-width:320px;padding:8px 12px;border:1px solid var(--line);
  border-radius:999px;background:var(--white)}
.search:focus{outline:2px solid var(--yellow);outline-offset:1px}

.btn{border:1px solid var(--line);background:var(--white);padding:8px 14px;border-radius:9px;
  font-weight:600;cursor:pointer}
.btn:hover{border-color:rgba(21,19,15,.3)}
.btn.primary{background:var(--yellow);border-color:var(--yellow-deep);color:var(--ink)}
.btn.primary:hover{background:var(--yellow-deep)}
.btn.danger{color:var(--bad);border-color:rgba(163,44,44,.3)}
.btn.danger:hover{background:rgba(163,44,44,.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}

/* ---- table ---- */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);background:rgba(21,19,15,.02)}
td{padding:12px 14px;border-bottom:1px solid rgba(21,19,15,.07);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:rgba(255,196,0,.09)}
.who{font-weight:600}
.who small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.new{background:rgba(255,196,0,.25);color:#7A5B00}
.pill.approved{background:rgba(31,122,76,.14);color:var(--ok)}
.pill.declined{background:rgba(163,44,44,.12);color:var(--bad)}
.pill.converted{background:rgba(31,122,76,.14);color:var(--ok)}
.pill.pending{background:rgba(255,196,0,.25);color:#7A5B00}
.pill.confirmed{background:rgba(31,122,76,.14);color:var(--ok)}
.pill.out{background:rgba(21,19,15,.85);color:var(--yellow)}
.pill.returned{background:rgba(21,19,15,.1);color:var(--char)}
.pill.cancelled{background:rgba(163,44,44,.12);color:var(--bad)}
.pill.overdue{background:var(--bad);color:#fff}
.pill.lapsed{background:rgba(21,19,15,.75);color:var(--yellow)}
.pill.stalled{background:rgba(180,83,26,.16);color:var(--warn)}
nav a .badge.warn{background:var(--warn);color:#fff}
tr.stale td{background:rgba(21,19,15,.035)}
nav a .badge.overdue{background:var(--bad);color:#fff}
/* A plain count is information, not an alarm, so it stays quiet until something
   is actually wrong. */
nav a .badge.quiet{background:rgba(255,255,255,.16);color:rgba(255,255,255,.9)}
nav a[aria-current="page"] .badge.quiet{background:rgba(21,19,15,.22);color:var(--ink)}
tr.late td{background:rgba(163,44,44,.05)}
.steps{display:flex;flex-direction:column;gap:8px;margin:4px 0 20px}
.step{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;background:var(--white);cursor:pointer;text-align:left;width:100%}
.step:hover{border-color:rgba(21,19,15,.3)}
.step .tick{width:21px;height:21px;border-radius:50%;border:2px solid var(--line);flex:none;
  display:grid;place-items:center;font-size:12px;color:transparent}
.step[data-done="1"] .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.step .lbl{font-weight:600}
.step .when{margin-left:auto;font-size:12px;color:var(--muted)}
.step[data-locked="1"]{cursor:default;background:rgba(21,19,15,.03)}
.step[data-locked="1"]:hover{border-color:var(--line)}
.step .src{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);margin-left:8px}
/* The payment row carries buttons, so it is a div with its own tick control
   rather than one big button — a button inside a button is invalid and stops
   the inner one working. */
/* Before the invoice exists there is nothing to check off, so the checklist is
   replaced by the one thing that can actually be done. */
.kickoff{background:var(--ink);color:#fff;border-radius:12px;padding:20px;margin-bottom:20px}
.kickoff h4{margin:0 0 7px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--yellow)}
.kickoff p{margin:0 0 15px;font-size:13.5px;color:rgba(255,255,255,.72);line-height:1.5}
.kickoff .btn{width:100%;justify-content:center;padding:13px;font-size:15px}
.kickoff .to{display:block;margin-top:11px;font-size:12.5px;color:rgba(255,255,255,.6);text-align:center}
.step.payrow{display:flex;flex-wrap:wrap;gap:10px;cursor:default;align-items:center}
.step.payrow .lbl{flex:none}
.step.payrow:hover{border-color:var(--line)}
.step.payrow .tick{cursor:pointer;background:none;padding:0}
/* These rows use a <button> for the tick, and the class-heavy selectors above
   outrank the generic done-state rule — so the fill has to be restated or the
   row shows a green outline with a white tick on a transparent background. */
.step.payrow[data-done="1"] .tick,
.step.photorow[data-done="1"] .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.step.payrow[data-locked="1"] .tick{cursor:default}
/* Actions sit right; if the row ever does wrap they stay together and stay
   right-aligned rather than scattering. */
.step.payrow .acts{display:flex;gap:7px;align-items:center;margin-left:auto;flex:none}
.step.payrow .amt{color:var(--muted);font-size:12.5px}
/* Delivery and pickup rows carry their own evidence, so they are two-line
   cards: the milestone on top, what proves it underneath. */
.step.photorow{display:block;cursor:default}
.step.photorow:hover{border-color:var(--line)}
.step.photorow .top{display:flex;align-items:center;gap:11px}
.step.photorow .tick{cursor:pointer;background:none;padding:0;flex:none}
.step.photorow[data-locked="1"] .tick{cursor:default}
.step.photorow .ev{display:flex;gap:7px;align-items:center;flex-wrap:wrap;
  margin:11px 0 0 32px}
.step.photorow figure{margin:0;position:relative;width:52px;height:52px;flex:none;z-index:0}
.step.photorow img{width:52px;height:52px;object-fit:cover;border-radius:7px;
  border:1px solid var(--line);display:block;background:rgba(21,19,15,.05)}
.step.photorow .rm{position:absolute;top:2px;right:2px;border:0;border-radius:5px;
  width:17px;height:17px;background:rgba(21,19,15,.75);color:#fff;font-size:11px;
  line-height:1;cursor:pointer;padding:0}
.step.photorow .rm:hover{background:var(--bad)}
.step.photorow .need{font-size:12.5px;color:var(--warn);font-weight:600}
/* A step whose turn has not come is shown, not hidden — the sequence is part of
   what the panel is telling you — but it offers nothing to press. */
.step.waiting{opacity:.55}
.step.waiting .tick{cursor:not-allowed}
.step.waiting .soon{font-size:12.5px;color:var(--muted)}
/* A padlock rather than an empty tick: it reads as "not yet" instead of
   "nobody has got round to it", and it is clearly something you may open. */
/* The lock belongs to the card, not to the checkbox — opening it is a different
   act from saying the bins went out. */
.step .lockbtn{margin-left:auto;border:1px solid var(--line);background:var(--white);
  border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;display:flex;
  align-items:center;gap:5px;color:var(--muted)}
.step .lockbtn:hover{border-color:var(--ink);color:var(--ink)}
.step.datelocked .tick{opacity:.4;cursor:not-allowed}
.step .notdue{font-size:12px;color:var(--muted)}
.step .by{font-size:12px;color:var(--muted);margin:9px 0 0 32px;line-height:1.45}
.step .by strong{color:var(--char);font-weight:600}
.step .staged{border:1px dashed rgba(21,19,15,.3);border-radius:9px;padding:10px;
  margin:9px 0 0 32px;background:rgba(255,196,0,.07)}
.step .staged .strip{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.step .staged figure{width:52px;height:52px}
.step .commit{width:100%;justify-content:center}
.step .locked-note{font-size:11.5px;color:var(--muted);margin:7px 0 0 32px}
.step.photorow img{cursor:zoom-in}
/* Above the drawer (41) and its sticky header — a photo opened for a closer
   look should not have the panel sitting on top of it. */
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(21,19,15,.92);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;animation:fade .12s ease}
.lightbox img{max-width:100%;max-height:calc(100vh - 130px);object-fit:contain;
  border-radius:10px;background:rgba(255,255,255,.05)}
.lightbox .cap{color:rgba(255,255,255,.75);font-size:13px;margin-top:14px;text-align:center}
.lightbox .cap strong{color:#fff;font-weight:600}
.lightbox .close{position:absolute;top:18px;right:18px;border:0;width:38px;height:38px;
  border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer}
.lightbox .close:hover{background:rgba(255,255,255,.26)}
.lightbox .nav{position:absolute;top:50%;transform:translateY(-50%);border:0;
  width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;
  font-size:22px;cursor:pointer;display:grid;place-items:center}
.lightbox .nav:hover{background:rgba(255,255,255,.26)}
.lightbox .nav.prev{left:18px}
.lightbox .nav.next{right:18px}
.lightbox .count{position:absolute;top:22px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.6);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}

/* ---- charges ---- */
.linkish{background:none;border:0;padding:0;color:var(--muted);font:inherit;font-size:11.5px;
  cursor:pointer;text-decoration:underline}
.linkish:hover{color:var(--ink)}


.chgwrap{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.countbox{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#FBFAF6;
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:12px}
.countbox span{font-size:13px;font-weight:700}
.countbox input{width:88px}
.countbox .of{font-weight:400;color:var(--muted)}
.countbox .hint{font-weight:400;color:var(--muted);font-size:12.5px;flex-basis:100%}
.prop,.chg{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;margin-bottom:8px;background:var(--white)}
.prop{border-color:var(--yellow-deep);background:rgba(255,196,0,.09)}
.prop.warn{border-color:rgba(180,83,26,.4);background:rgba(180,83,26,.07)}
.prop .l,.chg .l{flex:1;min-width:0}
.prop .r,.chg .r{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.prop .why,.chg .why{font-size:13.5px;margin-top:3px}
.prop .meta,.chg .meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
.chg.waived{opacity:.55}
.chg.waived .r strong{text-decoration:line-through}
.chg .st{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:2px}
.chg .st.draft{background:rgba(21,19,15,.08);color:var(--muted)}
.chg .st.sent{background:var(--yellow);color:var(--ink)}
.chg .st.paid{background:rgba(31,122,76,.15);color:var(--ok)}
.chg .st.waived{background:rgba(21,19,15,.08);color:var(--muted)}
.chgfoot{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  border-top:1px solid var(--line);padding-top:14px;margin-top:12px}
.chgfoot .meta{font-size:12.5px;color:var(--muted);margin-top:3px;max-width:46ch}
.manual{margin-top:16px}
.manual summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
.manual>div,.manual>label,.manual>input{margin-top:10px}

/* ---- schedule ---- */
.day{margin-bottom:22px}
.day h3{font-size:17px;display:flex;align-items:baseline;gap:10px;margin-bottom:3px}
.day .load{font-size:12.5px;color:var(--muted);font-weight:400;font-family:var(--font-body)}
.day .load b{color:var(--ink)}
.day .load b.over,.day .load b.over ~ *{color:var(--bad)}
.day .load:has(b.over){color:var(--bad);font-weight:600}
.day .sun{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--bad);background:rgba(163,44,44,.1);padding:2px 8px;border-radius:999px}
.day .none{color:var(--muted);font-size:13.5px;padding:8px 0 2px}
.job{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  margin-bottom:9px;display:flex;gap:14px;align-items:flex-start}
.job.done{opacity:.5}
.job .tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;white-space:nowrap;flex:none;margin-top:2px}
.job .tag.deliver{background:var(--yellow);color:var(--ink)}
.job .tag.collect{background:var(--ink);color:var(--yellow)}
.job .tag b{display:block;font-weight:600;text-transform:none;letter-spacing:0;font-size:12px;margin-top:2px}
.job .body{flex:1;min-width:0}
.job .who{font-weight:700;font-size:15px}
.job .addr{font-size:14px;margin-top:2px}
.job .meta{font-size:12.5px;color:var(--muted);margin-top:5px}
.job .cust{background:#FBFAF6;border:1px solid var(--line);border-radius:8px;padding:7px 10px;
  margin-top:8px;font-size:13px;white-space:pre-wrap}
.job .warn{color:var(--warn);font-weight:600;font-size:12.5px;margin-top:6px}
.job .acts{display:flex;flex-direction:column;gap:6px;flex:none}

/* ---- rental page ---- */
.rentalpage{max-width:1180px}
.rhead{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px}
.rhead .back{font-size:13px;color:var(--muted);text-decoration:none;padding-top:10px;white-space:nowrap}
.rhead .back:hover{color:var(--ink)}
.rhead .title{flex:1}
.rhead h1{font-size:30px;margin:0}
.rhead .meta{color:var(--muted);font-size:13.5px;margin-top:4px}
.rhead .pill{margin-top:8px}
.sect{font-size:15px;margin:18px 0 8px}
.sect:first-child{margin-top:0}
.sect .cnt{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.pill.declined{background:rgba(163,44,44,.12);color:var(--bad)}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:26px;align-items:start}
.rside .card.side{padding:16px 18px;margin-bottom:16px}
.rside .contactbar{margin:0 0 12px}
.rside .kv{margin:0}
.rside .linkbox{margin:0 0 16px}
.rside h4{margin:0 0 10px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.rside h4 .cnt{float:right;font-weight:400;text-transform:none;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;
  border:1px solid var(--line);background:var(--white)}
.chip.out{background:rgba(255,196,0,.18);border-color:var(--yellow-deep)}
.chip.back{background:rgba(31,122,76,.12);border-color:rgba(31,122,76,.35)}
.chip.damaged{background:rgba(180,83,26,.14);border-color:rgba(180,83,26,.4)}
.chip.lost{background:rgba(163,44,44,.12);border-color:rgba(163,44,44,.4);text-decoration:line-through}
.chip button{border:0;background:none;font:inherit;cursor:pointer;color:var(--muted);padding:0 0 0 2px;line-height:1}
.chip button:hover{color:var(--bad)}
.binadd{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.binadd input{padding:7px 9px}
.step.inspectrow{display:block;cursor:default}
.step.inspectrow:hover{border-color:var(--line)}
.step.inspectrow .top{display:flex;align-items:center;gap:11px}
.step.inspectrow .tick{cursor:pointer;background:none;padding:0;flex:none}
.step.inspectrow[data-done="1"] .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.inspectlist{margin:10px 0 0 32px}
.insphead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px}

<script type="module">
// Returns the single root when a template has one, otherwise the whole
// fragment — a template with sibling roots (the drawer's header + body) must
// not silently lose everything after the first.
const $ = (h) => {
  const t = document.createElement('template');
  t.innerHTML = h.trim();
  return t.content.children.length === 1 ? t.content.firstElementChild : t.content;
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root = document.getElementById('root');

let me = null;
let counts = {};
let rentalCounts = {};
let bookingHost = 'book.beehivebin.co';
let cities = [];   // the service area, from the Worker — the same list the website offers

/* ---------- api ---------- */
async function api(path, opts = {}) {
  const res = await fetch(`/api${path}`, {
    ...opts,
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
  return body;
}

/* ---------- formatting ---------- */
/* Mountain Time, like the Worker: the panel is open at 7pm on the drive and
   UTC has already moved on to tomorrow. */
const todayISO = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Denver', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
const money = c => (c == null ? '—' : '$' + (c / 100).toLocaleString('en-US', { minimumFractionDigits: c % 100 ? 2 : 0 }));
const fullName = r => [r.first_name, r.last_name].filter(Boolean).join(' ') || '(no name)';

function niceDate(iso) {
  if (!iso) return '—';
  const d = new Date(/^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso + 'T12:00:00' : iso);
  return isNaN(d) ? iso : d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
/* "2h ago" is fine for a glance but useless in a dispute. Shown in Mountain
   Time explicitly: the panel may be open anywhere, and a delivery time that
   silently follows the reader's clock is worse than no time at all. */
function stamp(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleString('en-US', {
    weekday: 'short', month: 'short', day: 'numeric',
    hour: 'numeric', minute: '2-digit', timeZone: 'America/Denver',
  });
}

function ago(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  const mins = Math.round((Date.now() - d) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  if (mins < 1440) return `${Math.round(mins / 60)}h ago`;
  const days = Math.round(mins / 1440);
  return days < 30 ? `${days}d ago` : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
const pkg = r => (r.bins ? `${r.bins} bins · ${r.weeks === 1 ? '1 week' : `${r.weeks} weeks`}` : '—');

  schedule:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  inventory: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="4" cy="6" r="0.5"/></svg>',

const LIGHT = { green: '🟢', yellow: '🟡', red: '🔴', grey: '⚪' };
function lightTitle(f, r) {
  if (!f || f.light === 'grey') return f?.fleet === 0 ? 'No bins on the inventory list yet' : 'Nothing to check';
  const day = f.tightest_day === r.start_date ? 'on the start date' : `on ${niceDate(f.tightest_day)}`;
  if (f.light === 'red') return `Does not fit — only ${f.available} of ${f.fleet} bins free ${day}, ${f.short_by} short`;
  if (f.light === 'yellow') return `Fits, but leaves only ${f.available - r.bins} of ${f.fleet} bins ${day}`;
  return `Fits — ${f.available} of ${f.fleet} bins free ${day}`;
}
const light = (r, cls = '') => r.kind === 'reserve'

const reqState = { status: 'new', q: '' };

async function viewRequests() {
  const view = $('<div></div>');
  const filters = [['new', 'New'], ['lapsed', 'Lapsed']];
  const head = $(`<div>
    <div class="head">
      <h1>Requests</h1><span class="count" id="rcount"></span>
      <button class="btn primary newreq" id="newreq">+ New request</button>

    <div class="toolbar">
      <div class="seg">${filters.map(([f, label]) =>
        `<button data-f="${f}" aria-pressed="${f === reqState.status}">${label}</button>`).join('')}</div>
      <input class="search" type="search" placeholder="Name, email, phone, city…" value="${esc(reqState.q)}">
    </div>
  </div>`);
  const list = $('<div class="card"><div class="empty">Loading…</div></div>');
  view.append(head, list);
  render('requests', view);

  head.querySelector('#newreq').addEventListener('click', openNewRequest);

  head.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    reqState.status = b.dataset.f;
    viewRequests();
  }));

  const search = head.querySelector('.search');
  let timer;
  search.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => { reqState.q = search.value.trim(); loadList(list, head); }, 250);
  });

  loadList(list, head);
}

async function loadList(list, head) {
  try {
    const params = new URLSearchParams({ status: reqState.status });
    if (reqState.q) params.set('q', reqState.q);
    const { requests } = await api(`/requests?${params}`);
    head.querySelector('#rcount').textContent = requests.length
      ? `${requests.length}${requests.length === 200 ? '+' : ''}` : '';

    if (!requests.length) {
      list.replaceChildren($(`<div class="empty"><strong>Nothing here</strong>${
        reqState.q ? 'No request matches that search.'
          : reqState.status === 'lapsed' ? 'Nothing has gone past its date unanswered.'
          : 'Nothing in this list yet.'}</div>`));
      return;
    }

    const rows = requests.map(r => `<tr class="clickable${r.lapsed ? ' stale' : ''}" data-id="${r.id}">
      <td>${r.lapsed
        ? '<span class="pill lapsed" title="The date they asked for has passed">lapsed</span>'
        : `<span class="pill ${r.status}">${r.status}</span>`}${
        r.source === 'manual' ? ' <span class="pill manual" title="Taken by phone">phone</span>' : ''}</td>
      <td><div class="who">${esc(fullName(r))}<small>${esc(r.email || r.phone || '—')}</small></div></td>
      <td class="nowrap">${light(r)}${r.kind === 'contact' ? '<em style="color:var(--muted)">Question</em>' : esc(pkg(r))}</td>
      <td class="nowrap num">${esc(niceDate(r.start_date))}</td>
      <td class="hide-sm">${esc(r.delivery_city || '—')}</td>
      <td class="nowrap num hide-sm">${esc(money(r.quoted_total_cents))}</td>
      <td class="nowrap hide-sm" style="color:var(--muted)">${esc(ago(r.created_at))}</td>
    </tr>`).join('');

    const table = $(`<table>
      <thead><tr>
        <th>Status</th><th>Who</th><th>Package</th><th>Starts</th>
        <th class="hide-sm">City</th><th class="hide-sm">Quoted</th><th class="hide-sm">In</th>
      </tr></thead>
      <tbody>${rows}</tbody></table>`);
    table.querySelectorAll('tbody tr').forEach(tr =>
      tr.addEventListener('click', () => { location.hash = `#/requests/${tr.dataset.id}`; }));
    list.replaceChildren(table);
  } catch (err) {
    list.replaceChildren($(`<div class="empty"><strong>Could not load requests</strong>${esc(err.message)}</div>`));
  }
}

/* Click a thumbnail to see it properly. A 52px square is enough to know a photo
   exists; it is not enough to see whether a lid is cracked, which is the whole
   reason the photo is taken. */
function openLightbox(photos, startIndex) {
  let i = startIndex;
  const box = $(`<div class="lightbox" role="dialog" aria-modal="true">
    <span class="count"></span>
    <button class="close" aria-label="Close">×</button>
    ${photos.length > 1 ? '<button class="nav prev" aria-label="Previous">‹</button>' : ''}
    <img alt="">
    ${photos.length > 1 ? '<button class="nav next" aria-label="Next">›</button>' : ''}
    <div class="cap"></div>
  </div>`);

  const draw = () => {
    const p = photos[i];
    box.querySelector('img').src = `/api/photo/${encodeURIComponent(p.r2_key)}`;
    box.querySelector('img').alt = `${p.kind} photo`;
    box.querySelector('.cap').innerHTML =
      `<strong>${esc(p.kind === 'delivery' ? 'At delivery' : 'At pickup')}</strong> &middot; ${
        esc(stamp(p.taken_at))} &middot; ${esc((p.taken_by || '').split('@')[0])}`;
    box.querySelector('.count').textContent = photos.length > 1 ? `${i + 1} of ${photos.length}` : '';
  };

  const step = n => { i = (i + n + photos.length) % photos.length; draw(); };
  const close = () => { box.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => {
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  };

  box.querySelector('.close').addEventListener('click', close);
  box.querySelector('.prev')?.addEventListener('click', () => step(-1));
  box.querySelector('.next')?.addEventListener('click', () => step(1));
  // Clicking the backdrop closes; clicking the photo itself should not.
  box.addEventListener('click', e => { if (e.target === box) close(); });
  document.addEventListener('keydown', onKey);

  draw();
  document.body.append(box);
}

/* ---------- the bins on a rental ----------

   Which bins went out, and — at inspection — what came back. The side card
   shows and edits the list; the inspection row on the checklist is where
   each one is ticked back or flagged. Both talk to the same rows. */

const stageLabel = i => i.back_at
  ? (i.back_condition === 'lost' ? 'not back' : i.back_condition === 'damaged' ? 'back, damaged' : 'back')
  : 'out';

function inspectRow(r, label, done) {
  const waiting = !r.returned_at;
  return `
  <div class="step inspectrow${waiting ? ' waiting' : ''}" data-done="${done}">
    <div class="top">
      <button class="tick"${waiting ? ' disabled' : ' data-step="inspected"'} data-done="${done}">✓</button>
      <span class="lbl">${label}</span>
      ${waiting ? '<span class="soon">after the bins are back</span>'
        : `<span class="when" style="margin-left:auto">${r.inspected_at ? esc(ago(r.inspected_at)) : ''}</span>`}
    </div>
    ${r.inspected_at ? `<div class="by">Inspected <strong>${esc(stamp(r.inspected_at))}</strong>${
      r.inspected_by ? ` by <strong>${esc(r.inspected_by.split('@')[0])}</strong>` : ''}</div>` : ''}
    ${waiting ? '' : `<div class="inspectlist" id="inspect-list"><span class="soon">Loading the bins…</span></div>`}
  </div>`;
}

/* Fills the inspection row: one line per bin with a tick and "Flag an issue". */
async function inspectList(container, rentalId, r) {
  let items;
  try { ({ items } = await api(`/rentals/${rentalId}/items`)); }
  catch (err) { container.replaceChildren(banner(err.message)); return; }
  if (!items.length) {
    container.replaceChildren($(`<p class="soon">No bins are recorded on this rental, so there is nothing to tick through.
      Add them on the right, or tick the step to say they all came back.</p>`));
    return;
  }
  const rows = items.map(i => `<div class="insp${i.back_at ? ' done' : ''}${i.back_condition === 'lost' ? ' lost' : i.back_condition === 'damaged' ? ' dmg' : ''}" data-item="${i.id}">
    <button class="ok" title="Came back fine" data-ok="${i.id}">${i.back_at && i.back_condition === 'good' ? '✓' : ''}</button>
    <span class="lb">${esc(i.label)}</span>
    <span class="st">${i.back_at ? esc(stageLabel(i)) : ''}${i.back_note ? ` — ${esc(i.back_note)}` : ''}</span>
    ${r.inspected_at ? '' : `<button class="linkish" data-flag="${i.id}">${i.back_at && i.back_condition !== 'good' ? 'Change' : 'Flag an issue'}</button>`}
  </div>`).join('');
  container.replaceChildren($(`<div>
    <div class="insphead"><span>${items.filter(i => i.back_at).length} of ${items.length} checked</span>
      ${r.inspected_at ? '' : `<button class="linkish" data-allok="1">All the rest came back fine</button>`}</div>
    ${rows}
    <div class="soon" style="margin-top:8px">Tick the step above when every bin is checked and clean. Anything flagged becomes a charge to decide on.</div>
  </div>`));

  const send = async payload => {
    try { await api(`/rentals/${rentalId}/items/inspect`, { method: 'POST', body: JSON.stringify({ items: payload }) }); openRental(rentalId); }
    catch (err) { container.prepend(banner(err.message)); }
  };
  container.querySelectorAll('[data-ok]').forEach(b => b.addEventListener('click', () => {
    if (r.inspected_at) return;
    send([{ id: +b.dataset.ok, back: true }]);
  }));
  container.querySelector('[data-allok]')?.addEventListener('click', () =>
    send(items.filter(i => !i.back_at).map(i => ({ id: i.id, back: true }))));
  container.querySelectorAll('[data-flag]').forEach(b => b.addEventListener('click', () => {
    const item = items.find(i => i.id === +b.dataset.flag);
    const what = prompt(`${item.label} — what happened?\n\n  d = damaged (came back, not usable)\n  l = lost (did not come back)\n  ok = fine after all`, item.back_condition === 'lost' ? 'l' : item.back_condition === 'damaged' ? 'd' : '');
    if (what === null) return;
    const w = what.trim().toLowerCase();
    if (w === 'ok' || w === 'fine') return send([{ id: item.id, back: true }]);
    if (w !== 'd' && w !== 'l') return;
    const note = prompt(w === 'd' ? 'What is wrong with it? (goes on the bin and on the charge)' : 'Anything to note? (optional)', item.back_note || '') ?? '';
    send([w === 'd' ? { id: item.id, back: true, condition: 'damaged', note } : { id: item.id, back: false, note }]);
  }));
}

/* The side card: the bins on this rental, editable until inspection. */
function binsPanel(container, rentalId, r) {
  const draw = async () => {
    let items;
    try { ({ items } = await api(`/rentals/${rentalId}/items`)); }
    catch (err) { container.replaceChildren(banner(err.message)); return; }
    const editable = !r.inspected_at && r.status !== 'cancelled';
    const bins = items.filter(i => i.kind === 'bin');
    const chips = items.map(i => `<span class="chip ${i.back_at ? (i.back_condition === 'good' ? 'back' : i.back_condition) : (r.delivered_at ? 'out' : '')}" title="${esc(stageLabel(i))}${i.back_note ? ' — ' + esc(i.back_note) : ''}">${esc(i.label)}${
      editable && !i.back_at ? `<button data-unassign="${i.id}" title="Take off this rental">×</button>` : ''}</span>`).join('');
    container.replaceChildren($(`<div>
      <h4>Bins on this rental <span class="cnt">${bins.length} of ${r.bins}</span></h4>
      ${items.length ? `<div class="chips">${chips}</div>`
        : `<p class="soon">${r.delivered_at ? 'None recorded.' : 'Picked automatically from the free ones when they go out — or choose them now.'}</p>`}
      ${editable ? `<div class="binadd">
        ${bins.length < r.bins ? `<button class="btn sm" id="bins-auto">Auto-pick ${r.bins - bins.length}</button>` : ''}
        <input id="bins-label" placeholder="B-017, B-018…" style="flex:1;min-width:120px">
        <button class="btn sm" id="bins-add">Add</button>
      </div><div id="bins-msg"></div>` : ''}
    </div>`));
    const fail = err => container.querySelector('#bins-msg')?.replaceChildren(banner(err.message));
    container.querySelector('#bins-auto')?.addEventListener('click', async () => {
      try { await api(`/rentals/${rentalId}/items`, { method: 'POST', body: JSON.stringify({ auto: true }) }); draw(); } catch (err) { fail(err); }
    });
    container.querySelector('#bins-add')?.addEventListener('click', async () => {
      const labels = container.querySelector('#bins-label').value.split(/[\s,]+/).filter(Boolean);
      if (!labels.length) return;
      try { await api(`/rentals/${rentalId}/items`, { method: 'POST', body: JSON.stringify({ labels }) }); draw(); } catch (err) { fail(err); }
    });
    container.querySelectorAll('[data-unassign]').forEach(b => b.addEventListener('click', async () => {
      try { await api(`/rentals/${rentalId}/items/${b.dataset.unassign}`, { method: 'DELETE' }); draw(); } catch (err) { fail(err); }
    }));
    // The inspection row on the left reads the same list.
    const list = document.getElementById('inspect-list');
    if (list) inspectList(list, rentalId, r);
  };
  draw();
}

/* ---------- charges ----------

   §4 of the agreement allows three charges and no others: a late return at the
   extra-week rate, a missing bin at $15, damage beyond normal wear at $15. The
   panel works those out and then waits. Nothing is charged to a card because a
   date passed — someone decides, and their name goes on it. */

const CHARGE_LABEL = { late: 'Late return', missing: 'Unreturned bins', damage: 'Damage', other: 'Other' };

function chargeState(c) {
  if (c.waived_at) return ['waived', 'Waived'];
  if (c.paid_at) return ['paid', 'Paid'];
  if (c.invoiced_at) return ['sent', c.square_status === 'CANCELED' ? 'Cancelled' : 'Invoiced'];
  return ['draft', 'Not yet charged'];
}

function chargesPanel(container, rentalId, r) {
  const draw = async () => {
    let d;
    try { d = await api(`/rentals/${rentalId}/charges`); }
    catch (err) { container.replaceChildren(banner(err.message)); return; }

    const { charges, proposals: props, owed_cents, outstanding_cents, card } = d;
    const counted = r.bins_returned != null;

    // Nothing has gone wrong and nothing is being counted: stay out of the way.
    if (!charges.length && !props.length && !r.returned_at && !r.delivered_at) {
      container.replaceChildren();
      return;
    }

    const rows = charges.map(c => {
      const [cls, label] = chargeState(c);
      return `<div class="chg ${cls}">
        <div class="l">
          <strong>${esc(CHARGE_LABEL[c.kind] || c.kind)}</strong>
          <span class="st ${cls}">${esc(label)}</span>
          <div class="why">${esc(c.reason)}${c.bin_labels ? ` &middot; ${esc(c.bin_labels)}` : ''}</div>
          <div class="meta">${c.qty} &times; ${esc(money(c.unit_cents))}${c.taxable ? ' plus tax' : ' &middot; not taxed'}
            &middot; added by ${esc(c.created_by)} ${esc(ago(c.created_at))}${
            c.waived_at ? ` &middot; waived by ${esc(c.waived_by)}: ${esc(c.waive_reason)}` : ''}${
            c.paid_at ? ` &middot; paid ${esc(stamp(c.paid_at))}` : ''}</div>
        </div>
        <div class="r">
          <strong>${esc(money(c.amount_cents))}</strong>
          ${cls === 'draft' && isOwner() ? `<button class="linkish" data-waive="${c.id}">Waive</button>` : ''}
          ${c.square_invoice_url && cls !== 'waived'
            ? `<a class="linkish" href="${esc(c.square_invoice_url)}" target="_blank" rel="noopener">Invoice</a>` : ''}
        </div>
      </div>`;
    }).join('');

    const suggestions = props.map((p, i) => p.blocked
      ? `<div class="prop warn"><div class="l"><strong>Worth knowing</strong>
           <div class="why">${esc(p.blocked)}</div></div></div>`
      : `<div class="prop"><div class="l">
           <strong>${esc(CHARGE_LABEL[p.kind])}${p.section === 7 ? ' — treat as unreturned' : ''}</strong>
           <div class="why">${esc(p.reason)}</div>
           <div class="meta">${esc(p.note)}</div>
         </div>
         <div class="r"><strong>${esc(money(p.amount_cents))}</strong>
           ${isOwner() ? `<button class="btn sm primary" data-prop="${i}">Add</button>` : ''}</div></div>`).join('');

    container.replaceChildren($(`<div class="chgwrap">
      <label class="fl">If something went wrong</label>

      ${r.delivered_at ? `<div class="countbox">
        <span>Bins back</span>
        <input type="number" id="c-count" min="0" max="${r.bins}" value="${counted ? r.bins_returned : ''}"
          placeholder="of ${r.bins}">
        <span class="of">of ${r.bins}</span>
        <button class="btn sm" id="c-count-save">${counted ? 'Update' : 'Record the count'}</button>
        ${counted ? '' : '<span class="hint">Counting is what turns a shortfall into a charge.</span>'}
      </div>` : ''}

      ${suggestions ? `<div class="props">${suggestions}</div>` : ''}
      ${rows || ''}

      ${outstanding_cents > 0 ? `<div class="chgfoot">
        <div>
          <strong>${esc(money(outstanding_cents))} outstanding</strong>
          <div class="meta">${card
            ? `Charges to the card on file &mdash; ${esc(card.brand || 'card')} &bull;&bull;${esc(card.last4 || '')}, as §4 allows. Plus tax.`
            : 'No card on file &mdash; this raises an invoice they have to pay themselves. Plus tax.'}</div>
        </div>
        ${isOwner() ? `<button class="btn primary" id="c-invoice">${card ? 'Charge the card' : 'Send an invoice'}</button>`
          : '<span class="meta">An owner charges this.</span>'}
      </div>` : owed_cents > 0 ? `<div class="chgfoot"><div class="meta">All settled &mdash;
        ${esc(money(owed_cents))} charged on this rental.</div></div>` : ''}

      ${isOwner() ? `<details class="manual"><summary>Add something by hand</summary>
        <div class="frow">
          <div><label class="fl" for="c-kind">Kind</label>
            <select id="c-kind">
              <option value="late">Late return</option>
              <option value="missing">Unreturned bins</option>
              <option value="damage">Damage</option>
              <option value="other" selected>Other</option>
            </select></div>
          <div><label class="fl" for="c-qty">Quantity</label>
            <input id="c-qty" type="number" min="1" max="1000" value="1"></div>
        </div>
        <div class="frow">
          <div><label class="fl" for="c-unit">Each</label><input id="c-unit" placeholder="15.00"></div>
          <div><label class="fl" for="c-tax">Sales tax</label>
            <select id="c-tax"><option value="1">Add tax</option><option value="0">No tax</option></select></div>
        </div>
        <label class="fl" for="c-why">What the customer sees on the invoice</label>
        <input id="c-why" placeholder="Two bins returned with tape residue">
        <div style="margin-top:12px"><button class="btn sm" id="c-add">Add charge</button></div>
      </details>` : ''}

      <div id="c-msg"></div>
    </div>`));

    const q = id => container.querySelector('#' + id);
    const fail = err => q('c-msg').replaceChildren(banner(err.message));

    q('c-count-save')?.addEventListener('click', async () => {
      try {
        await api(`/rentals/${rentalId}/counted`, { method: 'POST',
          body: JSON.stringify({ bins_returned: q('c-count').value }) });
        openRental(rentalId);
      } catch (err) { fail(err); }
    });

    container.querySelectorAll('[data-prop]').forEach(b => b.addEventListener('click', async () => {
      const p = props[+b.dataset.prop];
      if (p.confirm && !confirm(`${p.reason}\n\n${p.note}\n\n${p.confirm}`)) return;
      b.disabled = true;
      try {
        await api(`/rentals/${rentalId}/charges`, { method: 'POST', body: JSON.stringify({
          kind: p.kind, qty: p.qty, unit_cents: p.unit_cents,
          taxable: !!p.taxable, reason: p.reason, bin_labels: p.bin_labels || null,
        })});
        draw();
      } catch (err) { fail(err); b.disabled = false; }
    }));

    container.querySelectorAll('[data-waive]').forEach(b => b.addEventListener('click', async () => {
      const why = prompt('Waiving this charge. Why?\n\nThis is the record of the decision.');
      if (why === null || !why.trim()) return;
      try {
        await api(`/charges/${b.dataset.waive}/waive`, { method: 'POST', body: JSON.stringify({ reason: why }) });
        draw();
      } catch (err) { fail(err); }
    }));

    q('c-add')?.addEventListener('click', async () => {
      const unit = Math.round(parseFloat(String(q('c-unit').value).replace(/[^\d.]/g, '')) * 100);
      try {
        await api(`/rentals/${rentalId}/charges`, { method: 'POST', body: JSON.stringify({
          kind: q('c-kind').value, qty: q('c-qty').value, unit_cents: unit,
          taxable: q('c-tax').value === '1', reason: q('c-why').value,
        })});
        draw();
      } catch (err) { fail(err); }
    });

    q('c-invoice')?.addEventListener('click', async () => {
      const what = card
        ? `Charge ${money(outstanding_cents)} plus tax to the ${card.brand || 'card'} ending ${card.last4}?`
        : `Send an invoice for ${money(outstanding_cents)} plus tax?`;
      if (!confirm(`${what}\n\nThey get an email either way.`)) return;
      q('c-invoice').disabled = true;
      try { await api(`/rentals/${rentalId}/charges/invoice`, { method: 'POST' }); draw(); }
      catch (err) { fail(err); q('c-invoice').disabled = false; }
    });
  };
  draw();
}

/* ---------- extensions ----------
   Extra weeks on a rental in progress, priced from the same source as the
   booking form and invoiced separately. */

function extensionsPanel(container, rentalId, r) {
  // Nothing to extend before the rental is real or after the bins are back.
  const canExtend = r.status !== 'cancelled' && !r.returned_at
    && r.agreement_signed_at && r.paid_at;

  const render = exts => {
    const rows = exts.map(e => `
      <div class="ext">
        <span class="w">${e.weeks === 1 ? '1 extra week' : `${e.weeks} extra weeks`}</span>
        <span class="meta">${esc(money(e.amount_cents))} · back ${esc(niceDate(e.new_due_date))}
          · ${esc((e.created_by || '').split('@')[0])} ${esc(ago(e.created_at))}</span>
        ${e.square_invoice_url
          ? `<a class="btn sm" href="${esc(e.square_invoice_url)}" target="_blank" rel="noopener">Invoice</a>` : ''}
        <span class="st ${e.paid_at ? 'paid' : 'due'}">${e.paid_at ? 'paid' : (e.square_status || 'unpaid')}</span>
      </div>`).join('');

    container.replaceChildren($(`<div class="exts">
      ${exts.length ? `<label class="fl">Extensions</label>${rows}` : ''}
      <div id="ext-slot"></div>
    </div>`));

    const slot = container.querySelector('#ext-slot');
    if (!canExtend || !isOwner()) {
      if (!exts.length) container.replaceChildren();
      return;
    }

    const showButton = () => {
      slot.replaceChildren($(`<button class="btn sm">${exts.length ? 'Extend again' : 'Extend this rental'}</button>`));
      slot.querySelector('button').addEventListener('click', showForm);
    };

    const showForm = () => {
      slot.replaceChildren($(`<div class="extform">
        <label class="fl">How many extra weeks?</label>
        <div class="weekpick">${[1,2,3,4,5,6].map(w =>
          `<button type="button" data-w="${w}" aria-pressed="${w === 1}">${w}</button>`).join('')}</div>
        <div class="extquote" id="ext-quote"></div>
        <label class="fl" for="ext-why">Why <span style="text-transform:none;letter-spacing:0;font-weight:400">(optional)</span></label>
        <input id="ext-why" placeholder="Closing delayed, still packing…">
        <div class="actions" style="margin-top:10px">
          <button class="btn sm primary" id="ext-go">Create extension invoice</button>
          <button class="btn sm" id="ext-cancel">Cancel</button>
        </div>
        <div id="ext-msg"></div>
      </div>`));

      let weeks = 1;
      const quote = slot.querySelector('#ext-quote');
      const sync = () => {
        const per = EXTRA[r.bins];
        const back = new Date(`${r.due_date}T12:00:00`);
        back.setDate(back.getDate() + 7 * weeks);
        quote.innerHTML = per == null
          ? `<small>No extra-week rate on file for ${r.bins} bins.</small>`
          : `$${per * weeks} <small>+ tax · back ${back.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' })}</small>`;
      };
      slot.querySelectorAll('[data-w]').forEach(b => b.addEventListener('click', () => {
        weeks = +b.dataset.w;
        slot.querySelectorAll('[data-w]').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.w === weeks)));
        sync();
      }));
      sync();

      slot.querySelector('#ext-cancel').addEventListener('click', showButton);
      slot.querySelector('#ext-go').addEventListener('click', async e => {
        e.target.disabled = true;
        e.target.textContent = 'Creating…';
        try {
          await api(`/rentals/${rentalId}/extensions`, {
            method: 'POST',
            body: JSON.stringify({ weeks, reason: slot.querySelector('#ext-why').value }),
          });
          openRental(rentalId);
        } catch (err) {
          slot.querySelector('#ext-msg').replaceChildren(banner(err.message));
          e.target.disabled = false;
          e.target.textContent = 'Create extension invoice';
        }
      });
    };
    showButton();
  };

  api(`/rentals/${rentalId}/extensions`)
    .then(({ extensions }) => render(extensions))
    .catch(() => container.replaceChildren());
}

/* ---------- internal notes ----------
   Attributed and append-only, so the input only appears when someone is
   actually writing — a permanently open box invites overwriting a colleague's
   note, which is the habit this replaces. */

function notesPanel(container, entity, id) {
  const render = notes => {
    const rows = notes.map(n => `
      <div class="n" data-pinned="${n.pinned}" data-deleted="${n.deleted_at ? 1 : 0}">
        <div class="body">${esc(n.body)}</div>
        <div class="meta">
          <span class="who">${esc(n.author)}</span>
          <span title="${esc(n.created_at)}">${esc(ago(n.created_at))}</span>
          ${n.deleted_at ? `<span>· deleted by ${esc(n.deleted_by || '—')}</span>` : `
            <button data-pin="${n.id}" data-to="${n.pinned ? 0 : 1}" class="pin">${
              n.pinned ? 'Unpin' : 'Pin'}</button>
            ${n.author === me.email || isOwner() ? `<button data-del="${n.id}">Delete</button>` : ''}`}
        </div>
      </div>`).join('');

    container.replaceChildren($(`<div>
      <label class="fl">Internal notes <span style="font-weight:400;text-transform:none;letter-spacing:0">— staff only, never shown to the customer</span></label>
      <div class="notes">
        ${rows || '<div class="empty-n">No notes yet.</div>'}
      </div>
      <div id="n-add"></div>
    </div>`));

    const addBox = container.querySelector('#n-add');
    const showButton = () => {
      addBox.replaceChildren($('<button class="btn sm">Add a note</button>'));
      addBox.querySelector('button').addEventListener('click', showForm);
    };
    const showForm = () => {
      addBox.replaceChildren($(`<div>
        <textarea id="n-body" placeholder="What happened, or what the next person needs to know."></textarea>
        <div class="actions" style="margin-top:8px">
          <button class="btn sm primary" id="n-save">Save note</button>
          <button class="btn sm" id="n-cancel">Cancel</button>
          <label style="display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)">
            <input type="checkbox" id="n-pin"> Pin it
          </label>
        </div>
        <div id="n-msg"></div>
      </div>`));
      const ta = addBox.querySelector('#n-body');
      ta.focus();
      addBox.querySelector('#n-cancel').addEventListener('click', showButton);
      addBox.querySelector('#n-save').addEventListener('click', async e => {
        const text = ta.value.trim();
        if (!text) { ta.focus(); return; }
        e.target.disabled = true;
        try {
          const { notes: fresh } = await api(`/${entity}/${id}/notes`, {
            method: 'POST',
            body: JSON.stringify({ body: text, pinned: addBox.querySelector('#n-pin').checked }),
          });
          render(fresh);
        } catch (err) {
          addBox.querySelector('#n-msg').replaceChildren(banner(err.message));
          e.target.disabled = false;
        }
      });
    };
    showButton();

    container.querySelectorAll('[data-pin]').forEach(b => b.addEventListener('click', async () => {
      try { render((await api(`/notes/${b.dataset.pin}`, { method: 'PATCH', body: JSON.stringify({ pinned: b.dataset.to === '1' }) })).notes); }
      catch (err) { container.prepend(banner(err.message)); }
    }));
    container.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('Delete this note? It stays in the record, marked deleted.')) return;
      try { render((await api(`/notes/${b.dataset.del}`, { method: 'PATCH', body: JSON.stringify({ deleted: true }) })).notes); }
      catch (err) { container.prepend(banner(err.message)); }
    }));
  };

  container.replaceChildren($('<div class="empty-n">Loading notes…</div>'));
  api(`/${entity}/${id}/notes`)
    .then(({ notes }) => render(notes))
    .catch(err => container.replaceChildren(banner(err.message)));
}

/* ---------- request drawer ---------- */
/* Only ever one drawer. Hash navigation (browser back/forward, or a link
   straight to another request) otherwise stacks a second one on top of the
   first, leaving a stale panel visible over the one you asked for. */
function closeAnyDrawer() {
  document.querySelectorAll('.scrim, .drawer').forEach(el => el.remove());
}

async function openRequest(id) {
  if (!document.getElementById('app')) await viewRequests();
  closeAnyDrawer();

  const scrim = $('<div class="scrim"></div>');
  const drawer = $('<div class="drawer" role="dialog" aria-modal="true"><div class="dbody">Loading…</div></div>');
  const close = () => { scrim.remove(); drawer.remove(); document.removeEventListener('keydown', onKey);
    if (location.hash.startsWith('#/requests/')) location.hash = '#/requests'; };
  const onKey = e => { if (e.key === 'Escape') close(); };
  scrim.addEventListener('click', close);
  document.addEventListener('keydown', onKey);
  document.body.append(scrim, drawer);

  let r;
  try {
    ({ request: r } = await api(`/requests/${id}`));
  } catch (err) {
    drawer.replaceChildren($(`<div class="dbody"><div class="banner err">${esc(err.message)}</div></div>`));
    return;
  }

  /* tel:/sms: want E.164; the stored string is whatever the customer typed. */
  const digits = String(r.phone || '').replace(/\D/g, '');
  const tel = digits.length === 10 ? `+1${digits}`
    : digits.length === 11 && digits[0] === '1' ? `+${digits}`
    : digits;
  const pref = r.contact_pref;
  // The preferred method is the filled button, so the right move is obvious
  // before reading anything.
  const contactBtn = (kind, href, label) =>
    `<a class="btn sm${pref === kind ? ' primary' : ''}" href="${href}">${label}</a>`;
  const actions = [
    r.phone && digits ? contactBtn('text', `sms:${tel}`, 'Text') : '',
    r.phone && digits ? contactBtn('call', `tel:${tel}`, 'Call') : '',
    r.email ? contactBtn('email', `mailto:${esc(r.email)}`, 'Email') : '',
  ].filter(Boolean).join('');

  const extras = [];
  if (r.kind === 'reserve' && r.return_date) extras.push(['Back by', niceDate(r.return_date)]);
  if (r.pickup_city && r.pickup_city !== r.delivery_city) extras.push(['Pickup city', r.pickup_city]);

  drawer.replaceChildren($(`
    <div class="dhead">
      <div style="flex:1">
        <h2>${esc(fullName(r))}</h2>
        <div class="meta">${r.kind === 'reserve' ? 'Reservation' : 'Question'} · #${r.id} · ${esc(ago(r.created_at))}</div>
      </div>
      <span class="pill ${r.status}" style="margin-top:3px">${r.status}</span>
      <button class="x" aria-label="Close">×</button>
    </div>
    <div class="dbody">
      ${actions ? `<div class="contactbar">${actions}${
        pref ? `<span class="prefnote">prefers ${esc(pref)}</span>` : ''}</div>` : ''}
      <dl class="kv">
        <dt>Phone</dt><dd>${esc(r.phone || '—')}</dd>
        <dt>Email</dt><dd>${esc(r.email || '—')}</dd>
        ${r.kind === 'reserve' ? `
        <dt>Package</dt><dd>${esc(pkg(r))}</dd>
        <dt>Bins free</dt><dd>${light(r)} <span style="font-weight:400">${esc(lightTitle(r.fit, r))}</span></dd>
        <dt>Quoted</dt><dd>${esc(money(r.quoted_total_cents))} <span style="color:var(--muted);font-weight:400">before tax</span></dd>` : ''}
        <dt>${r.kind === 'reserve' ? 'Starts' : 'Needs bins'}</dt><dd>${esc(niceDate(r.start_date))}</dd>
        ${extras.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}
        <dt>Delivery city</dt><dd>${esc(r.delivery_city || '—')}</dd>
        ${r.decided_by ? `<dt>Decided</dt><dd>${esc(r.decided_by)}<br><span style="color:var(--muted);font-weight:400">${esc(ago(r.decided_at))}</span></dd>` : ''}
      </dl>

      ${r.message ? `<div class="note"><h4>Their message</h4>${esc(r.message)}</div>` : ''}
      ${r.customer_notes ? `<div class="note"><h4>Notes from the customer</h4>${esc(r.customer_notes)}</div>` : ''}
      ${r.decline_reason ? `<div class="note"><h4>Why it was declined</h4>${esc(r.decline_reason)}</div>` : ''}

      <div id="req-notes"></div>
      <div id="req-history" style="margin-top:6px"></div>

      <div class="actions" style="margin-top:22px;border-top:1px solid var(--line);padding-top:18px">
        ${!isOwner() ? '<span style="color:var(--muted);font-size:13px">An owner approves or declines this.</span>'
        : r.status === 'converted' ? `<a class="btn" href="#/rentals/${r.rental_id}">Open rental #${r.rental_id}</a>
          <span style="color:var(--muted);font-size:13px">Booked. To call it off, cancel the rental.</span>`
        : r.status === 'new' && r.lapsed ? `
          <button class="btn primary" id="req-redate">New date</button>
          <button class="btn danger" data-act="decline">Decline</button>
          <span style="color:var(--muted);font-size:13px">The day they asked for has passed.</span>`
        : r.status === 'new' ? `
          <button class="btn primary" data-act="approve">Approve</button>
          <button class="btn danger" data-act="decline">Decline</button>`
        : `<button class="btn" data-act="reopen">Reopen as new</button>`}
        ${r.customer_id ? `<a class="linkish" href="#/customers/${r.customer_id}" style="margin-left:auto">Customer record</a>` : ''}
      </div>
      <div id="drawer-msg"></div>
    </div>`));

  drawer.querySelector('.x').addEventListener('click', close);

  const msg = drawer.querySelector('#drawer-msg');
  const act = async (action, extra = {}) => {
    msg.replaceChildren();
    try {
      const res = await api(`/requests/${id}/decision`, { method: 'POST', body: JSON.stringify({ action, ...extra }) });
      await refreshCounts();
      close();
      // Approving creates a rental; go straight to it, since the next thing
      // anyone does is fill in the address and chase the agreement.
      if (res.rental_id) { location.hash = `#/rentals/${res.rental_id}`; return; }
      viewRequests();
    } catch (err) {
      /* Not enough bins free. A refusal rather than a warning, because
         approving is what emails the customer their confirmation link — but
         sometimes you know a set is coming back early, so it can be overridden
         on purpose and the override is recorded. */
      if (/approve anyway/i.test(err.message) && !extra.force) {
        if (confirm(`${err.message}\n\nApprove anyway?`)) return act(action, { ...extra, force: true });
        return;
      }
      msg.replaceChildren(banner(err.message));
    }
  };

  notesPanel(drawer.querySelector('#req-notes'), 'requests', id);
  historyPanel(drawer.querySelector('#req-history'), 'requests', id);
  drawer.querySelector('[data-act="approve"]')?.addEventListener('click', () => act('approve'));
  drawer.querySelector('#req-redate')?.addEventListener('click', async () => {
    const to = prompt(`New delivery date for ${fullName(r)} (they asked for ${r.start_date}):`, todayISO());
    if (!to) return;
    try { await api(`/requests/${id}`, { method: 'PATCH', body: JSON.stringify({ start_date: to.trim() }) }); close(); viewRequests(); }
    catch (err) { msg.replaceChildren(banner(err.message)); }
  });
  drawer.querySelector('[data-act="reopen"]')?.addEventListener('click', () => act('reopen'));
  drawer.querySelector('[data-act="decline"]')?.addEventListener('click', () => {
    const reason = prompt('Why is this being declined? (optional — the customer never sees it)');
    if (reason === null) return;
    act('decline', { reason });
  });
}
