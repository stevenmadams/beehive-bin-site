<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Beehive Bin Co. — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FFC400; --yellow-deep:#E3A800;
  --ink:#15130F; --char:#211E18; --paper:#F2F1EB; --white:#fff;
  --muted:#6B675C; --line:rgba(21,19,15,.14);
  --ok:#1F7A4C; --warn:#B4531A; --bad:#A32C2C;
  --font-display:"Archivo Black","Archivo","Arial Black",system-ui,sans-serif;
  --font-body:"Archivo",Inter,system-ui,-apple-system,sans-serif;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font-body);background:var(--paper);color:var(--ink);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:400;letter-spacing:-.02em;line-height:1.05;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}

/* ---- shell ---- */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{background:var(--ink);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand .name{font-family:var(--font-display);font-size:16px;letter-spacing:.01em;display:block}
.brand .tag{display:block;font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--yellow);text-transform:uppercase;margin-top:4px}
nav{padding:12px 10px;flex:1;overflow:auto}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;text-decoration:none;
  color:rgba(255,255,255,.72);font-weight:500;margin-bottom:2px}
nav a:hover{background:rgba(255,255,255,.07);color:#fff}
nav a[aria-current="page"]{background:var(--yellow);color:var(--ink);font-weight:600}
nav a .ico{width:17px;text-align:center;flex:none;opacity:.9}
nav a .badge{margin-left:auto;background:var(--yellow);color:var(--ink);font-size:11px;font-weight:700;
  border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
nav a[aria-current="page"] .badge{background:var(--ink);color:var(--yellow)}
nav a.soon{opacity:.42;cursor:default}
nav a.soon:hover{background:none;color:rgba(255,255,255,.72)}
.rail-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:rgba(255,255,255,.6)}
.rail-foot strong{display:block;color:#fff;font-weight:600;font-size:13px;word-break:break-all}
.rail-foot .role{display:inline-block;margin-top:5px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--yellow);font-weight:700}

main{padding:26px 30px 60px;max-width:1160px}
.head{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.head h1{font-size:30px}
.head .count{color:var(--muted);font-weight:600}
.head .newreq{margin-left:auto;align-self:center}
.pill.manual{background:rgba(21,19,15,.08);color:var(--muted);font-weight:600}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.frow.one{grid-template-columns:1fr}
.dbody input,.dbody select{width:100%;padding:9px 11px;border:1px solid var(--line);
  border-radius:9px;background:var(--white)}
.quote{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:11px 14px;
  margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.quote strong{font-family:var(--font-display);font-size:21px}
.quote small{color:var(--muted)}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.contactbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.contactbar .prefnote{font-size:11px;color:var(--muted);font-weight:700;
  text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--muted);margin:0 0 20px}

/* ---- controls ---- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;background:rgba(21,19,15,.06);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;
  color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.search{flex:1;min-width:190px;max-width:320px;padding:8px 12px;border:1px solid var(--line);
  border-radius:999px;background:var(--white)}
.search:focus{outline:2px solid var(--yellow);outline-offset:1px}

.btn{border:1px solid var(--line);background:var(--white);padding:8px 14px;border-radius:9px;
  font-weight:600;cursor:pointer}
.btn:hover{border-color:rgba(21,19,15,.3)}
.btn.primary{background:var(--yellow);border-color:var(--yellow-deep);color:var(--ink)}
.btn.primary:hover{background:var(--yellow-deep)}
.btn.danger{color:var(--bad);border-color:rgba(163,44,44,.3)}
.btn.danger:hover{background:rgba(163,44,44,.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}

/* ---- table ---- */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);background:rgba(21,19,15,.02)}
td{padding:12px 14px;border-bottom:1px solid rgba(21,19,15,.07);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:rgba(255,196,0,.09)}
.who{font-weight:600}
.who small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.new{background:rgba(255,196,0,.25);color:#7A5B00}
.pill.approved{background:rgba(31,122,76,.14);color:var(--ok)}
.pill.declined{background:rgba(163,44,44,.12);color:var(--bad)}
.pill.converted{background:rgba(31,122,76,.14);color:var(--ok)}
.pill.pending{background:rgba(255,196,0,.25);color:#7A5B00}
.pill.confirmed{background:rgba(31,122,76,.14);color:var(--ok)}
.pill.out{background:rgba(21,19,15,.85);color:var(--yellow)}
.pill.returned{background:rgba(21,19,15,.1);color:var(--char)}
.pill.cancelled{background:rgba(163,44,44,.12);color:var(--bad)}
.pill.overdue{background:var(--bad);color:#fff}
.pill.lapsed{background:rgba(21,19,15,.75);color:var(--yellow)}
.pill.stalled{background:rgba(180,83,26,.16);color:var(--warn)}
nav a .badge.warn{background:var(--warn);color:#fff}
tr.stale td{background:rgba(21,19,15,.035)}
nav a .badge.overdue{background:var(--bad);color:#fff}
tr.late td{background:rgba(163,44,44,.05)}
.steps{display:flex;flex-direction:column;gap:8px;margin:4px 0 20px}
.step{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;background:var(--white);cursor:pointer;text-align:left;width:100%}
.step:hover{border-color:rgba(21,19,15,.3)}
.step .tick{width:21px;height:21px;border-radius:50%;border:2px solid var(--line);flex:none;
  display:grid;place-items:center;font-size:12px;color:transparent}
.step[data-done="1"] .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.step .lbl{font-weight:600}
.step .when{margin-left:auto;font-size:12px;color:var(--muted)}
.step[data-locked="1"]{cursor:default;background:rgba(21,19,15,.03)}
.step[data-locked="1"]:hover{border-color:var(--line)}
.step .src{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);margin-left:8px}
/* The payment row carries buttons, so it is a div with its own tick control
   rather than one big button — a button inside a button is invalid and stops
   the inner one working. */
/* Before the invoice exists there is nothing to check off, so the checklist is
   replaced by the one thing that can actually be done. */
.kickoff{background:var(--ink);color:#fff;border-radius:12px;padding:20px;margin-bottom:20px}
.kickoff h4{margin:0 0 7px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--yellow)}
.kickoff p{margin:0 0 15px;font-size:13.5px;color:rgba(255,255,255,.72);line-height:1.5}
.kickoff .btn{width:100%;justify-content:center;padding:13px;font-size:15px}
.kickoff .to{display:block;margin-top:11px;font-size:12.5px;color:rgba(255,255,255,.6);text-align:center}
.step.payrow{display:flex;flex-wrap:wrap;gap:10px;cursor:default;align-items:center}
.step.payrow .lbl{flex:none}
.step.payrow:hover{border-color:var(--line)}
.step.payrow .tick{cursor:pointer;background:none;padding:0}
/* These rows use a <button> for the tick, and the class-heavy selectors above
   outrank the generic done-state rule — so the fill has to be restated or the
   row shows a green outline with a white tick on a transparent background. */
.step.payrow[data-done="1"] .tick,
.step.photorow[data-done="1"] .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.step.payrow[data-locked="1"] .tick{cursor:default}
/* Actions sit right; if the row ever does wrap they stay together and stay
   right-aligned rather than scattering. */
.step.payrow .acts{display:flex;gap:7px;align-items:center;margin-left:auto;flex:none}
.step.payrow .amt{color:var(--muted);font-size:12.5px}
/* Delivery and pickup rows carry their own evidence, so they are two-line
   cards: the milestone on top, what proves it underneath. */
.step.photorow{display:block;cursor:default}
.step.photorow:hover{border-color:var(--line)}
.step.photorow .top{display:flex;align-items:center;gap:11px}
.step.photorow .tick{cursor:pointer;background:none;padding:0;flex:none}
.step.photorow[data-locked="1"] .tick{cursor:default}
.step.photorow .ev{display:flex;gap:7px;align-items:center;flex-wrap:wrap;
  margin:11px 0 0 32px}
.step.photorow figure{margin:0;position:relative;width:52px;height:52px;flex:none;z-index:0}
.step.photorow img{width:52px;height:52px;object-fit:cover;border-radius:7px;
  border:1px solid var(--line);display:block;background:rgba(21,19,15,.05)}
.step.photorow .rm{position:absolute;top:2px;right:2px;border:0;border-radius:5px;
  width:17px;height:17px;background:rgba(21,19,15,.75);color:#fff;font-size:11px;
  line-height:1;cursor:pointer;padding:0}
.step.photorow .rm:hover{background:var(--bad)}
.step.photorow .need{font-size:12.5px;color:var(--warn);font-weight:600}
/* A step whose turn has not come is shown, not hidden — the sequence is part of
   what the panel is telling you — but it offers nothing to press. */
.step.waiting{opacity:.55}
.step.waiting .tick{cursor:not-allowed}
.step.waiting .soon{font-size:12.5px;color:var(--muted)}
/* A padlock rather than an empty tick: it reads as "not yet" instead of
   "nobody has got round to it", and it is clearly something you may open. */
/* The lock belongs to the card, not to the checkbox — opening it is a different
   act from saying the bins went out. */
.step .lockbtn{margin-left:auto;border:1px solid var(--line);background:var(--white);
  border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;display:flex;
  align-items:center;gap:5px;color:var(--muted)}
.step .lockbtn:hover{border-color:var(--ink);color:var(--ink)}
.step.datelocked .tick{opacity:.4;cursor:not-allowed}
.step .notdue{font-size:12px;color:var(--muted)}
.step.photorow .addr{margin:12px 0 0 32px}
.step.photorow .addr label{display:block;font-size:11px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.step.photorow .addr input{width:100%;padding:9px 11px;border:1px solid var(--line);
  border-radius:9px;background:var(--white)}
.step.photorow .addr .cust{background:#FBFAF6;border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;margin-top:7px;font-size:12.5px;white-space:pre-wrap}
.step.photorow .addr .cust b{display:block;font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.step.photorow .addr .saverow{display:flex;gap:8px;align-items:center;margin-top:8px}
.step.photorow .addr .saved{font-size:12px;color:var(--muted)}
/* Shown, not offered for editing. The customer supplies this when they confirm;
   staff correcting it is the exception, and an open box invites overwriting
   what they wrote. */
.step.photorow .addr .shown{display:flex;gap:9px;align-items:flex-start}
.step.photorow .addr .shown .val{flex:1;font-weight:600;font-size:14px;padding-top:1px}
.step.photorow .addr .shown .val.empty{font-weight:400;color:var(--muted)}
.step.photorow .addr .edit[hidden]{display:none}
.exts{margin-bottom:18px}
.exts .fl{margin-bottom:7px}
.ext{background:var(--white);border:1px solid var(--line);border-radius:10px;
  padding:10px 13px;margin-bottom:7px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.ext .w{font-weight:600}
.ext .meta{font-size:12px;color:var(--muted)}
.ext .st{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase}
.ext .st.paid{color:var(--ok)}
.ext .st.due{color:var(--warn)}
.extform{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:14px}
.weekpick{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.weekpick button{border:1px solid var(--line);background:var(--white);border-radius:8px;
  padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer}
.weekpick button[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow-deep)}
.extquote{font-family:var(--font-display);font-size:22px;margin:2px 0 12px}
.extquote small{font-family:var(--font-body);font-size:12.5px;color:var(--muted);font-weight:400}
.holdline{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;
  color:var(--muted);margin:-8px 0 20px 2px}
.holdline input{width:16px;height:16px;flex:none;margin-top:1px}
.linkbox{background:var(--ink);color:#fff;border-radius:10px;padding:13px 15px;margin-bottom:18px}
.linkbox h4{margin:0 0 8px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--yellow)}
.linkbox code{display:block;font-size:12px;word-break:break-all;color:rgba(255,255,255,.8);
  margin-bottom:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.linkbox .row{display:flex;gap:8px;flex-wrap:wrap}
.linkbox .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.linkbox .btn:hover{background:rgba(255,255,255,.22)}
.linkbox .btn.primary{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.signed{font-size:12.5px;color:var(--muted);margin:-12px 0 18px}
.notes{margin-bottom:18px}
.notes .n{background:var(--white);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;margin-bottom:8px}
.notes .n[data-pinned="1"]{border-color:var(--yellow-deep);background:rgba(255,196,0,.09)}
.notes .n[data-deleted="1"]{opacity:.55}
.notes .n[data-deleted="1"] .body{text-decoration:line-through}
.notes .body{white-space:pre-wrap;font-size:14px}
.notes .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  font-size:11.5px;color:var(--muted);margin-top:7px}
.notes .meta .who{font-weight:600;color:var(--char)}
.notes .meta button{border:0;background:none;padding:0;color:var(--muted);
  font:inherit;font-size:11.5px;cursor:pointer;text-decoration:underline}
.notes .meta button:hover{color:var(--ink)}
.notes .pin{margin-left:auto}
.notes .empty-n{color:var(--muted);font-size:13.5px;padding:2px 0 10px}
.history summary{cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--muted);padding:6px 0}
.history summary:hover{color:var(--ink)}
.history ol{list-style:none;margin:8px 0 0;padding:0;border-left:2px solid var(--line)}
.history li{padding:5px 0 5px 14px;font-size:13px;position:relative}
.history li::before{content:"";position:absolute;left:-5px;top:11px;width:8px;height:8px;
  border-radius:50%;background:var(--line)}
.history li.bysystem::before{background:var(--yellow-deep)}
.history .what{font-weight:600}
.history .who{color:var(--muted)}
.history .when{color:var(--muted);font-size:12px}
/* A file input styled as a button: on a phone this opens the camera. */
.shoot{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
  background:var(--white);padding:9px 14px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer}
.shoot:hover{border-color:rgba(21,19,15,.3)}
.shoot input{display:none}
.pill.staff{background:rgba(21,19,15,.08);color:var(--char)}
.pill.owner{background:var(--yellow);color:var(--ink)}
.pill.off{background:rgba(163,44,44,.12);color:var(--bad)}

.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--font-display);font-size:19px;color:var(--ink);margin-bottom:6px}

/* ---- drawer ---- */
.scrim{position:fixed;inset:0;background:rgba(21,19,15,.42);z-index:40;animation:fade .15s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--paper);z-index:41;
  overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.2);animation:slide .18s ease}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:.4}}
/* z-index matters: the photo thumbnails are positioned (for their remove
   button) and come later in the DOM, so without this they scroll OVER the
   sticky header rather than under it. */
.drawer .dhead{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:18px 20px;display:flex;
  align-items:flex-start;gap:12px}
.drawer .dhead h2{font-size:21px;flex:1}
.drawer .dhead .meta{color:rgba(255,255,255,.6);font-size:12.5px;margin-top:5px}
.x{border:0;background:rgba(255,255,255,.12);color:#fff;width:28px;height:28px;border-radius:8px;
  font-size:16px;line-height:1;cursor:pointer;flex:none}
.x:hover{background:rgba(255,255,255,.24)}
.dbody{padding:18px 20px 30px}
.kv{display:grid;grid-template-columns:112px 1fr;gap:7px 14px;margin-bottom:20px}
.kv dt{color:var(--muted);font-size:12.5px;font-weight:600}
.kv dd{margin:0;font-weight:500;word-break:break-word}
.note{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  margin-bottom:18px;white-space:pre-wrap}
.note h4{margin:0 0 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--white);
  resize:vertical;min-height:76px}
textarea:focus,input:focus,select:focus{outline:2px solid var(--yellow);outline-offset:1px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
label.fl{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);margin:0 0 5px}

/* ---- forms ---- */
.formrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:16px;background:var(--white);
  border:1px solid var(--line);border-radius:var(--radius);margin-bottom:18px}
.formrow .f{flex:1;min-width:150px}
.formrow input,.formrow select{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--white)}

.banner{border-radius:10px;padding:12px 15px;margin-bottom:18px;font-weight:500}
.banner.err{background:rgba(163,44,44,.09);border:1px solid rgba(163,44,44,.28);color:#7A2020}
.banner.info{background:rgba(255,196,0,.16);border:1px solid rgba(227,168,0,.4)}

.gate{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.gate .box{max-width:430px}
.gate h1{font-size:26px;margin-bottom:10px}
.gate p{color:var(--muted)}

.soonwrap{background:var(--white);border:1px dashed rgba(21,19,15,.22);border-radius:var(--radius);padding:30px}
.soonwrap h3{font-size:19px;margin-bottom:8px}
.soonwrap ul{margin:12px 0 0;padding-left:20px;color:var(--muted)}
.soonwrap li{margin-bottom:5px}

@media (max-width:820px){
  #app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;overflow:auto}
  .brand{border-bottom:0;border-right:1px solid rgba(255,255,255,.12);white-space:nowrap}
  nav{display:flex;padding:8px;gap:4px}
  nav a{margin:0;white-space:nowrap}
  .rail-foot{display:none}
  main{padding:18px 16px 50px}
  .hide-sm{display:none}
}
</style>
</head>
<body>
<div id="root"><div class="gate"><div class="box"><p>Loading…</p></div></div></div>

<script type="module">
// Returns the single root when a template has one, otherwise the whole
// fragment — a template with sibling roots (the drawer's header + body) must
// not silently lose everything after the first.
const $ = (h) => {
  const t = document.createElement('template');
  t.innerHTML = h.trim();
  return t.content.children.length === 1 ? t.content.firstElementChild : t.content;
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root = document.getElementById('root');

let me = null;
let counts = {};
let rentalCounts = {};
let bookingHost = 'book.beehivebin.co';

/* ---------- api ---------- */
async function api(path, opts = {}) {
  const res = await fetch(`/api${path}`, {
    ...opts,
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
  return body;
}

/* ---------- formatting ---------- */
const money = c => (c == null ? '—' : '$' + (c / 100).toLocaleString('en-US', { minimumFractionDigits: c % 100 ? 2 : 0 }));
const fullName = r => [r.first_name, r.last_name].filter(Boolean).join(' ') || '(no name)';

function niceDate(iso) {
  if (!iso) return '—';
  const d = new Date(/^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso + 'T12:00:00' : iso);
  return isNaN(d) ? iso : d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
function ago(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  const mins = Math.round((Date.now() - d) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  if (mins < 1440) return `${Math.round(mins / 60)}h ago`;
  const days = Math.round(mins / 1440);
  return days < 30 ? `${days}d ago` : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
const pkg = r => (r.bins ? `${r.bins} bins · ${r.weeks === 1 ? '1 week' : `${r.weeks} weeks`}` : '—');

/* ---------- shell ---------- */
const NAV = [
  { id: 'requests',  label: 'Requests',  ico: '◎', live: true },
  { id: 'rentals',   label: 'Rentals',   ico: '▦', live: true },
  { id: 'schedule',  label: 'Schedule',  ico: '◫' },
  { id: 'inventory', label: 'Inventory', ico: '▤' },
  { id: 'customers', label: 'Customers', ico: '☺' },
  { id: 'employees', label: 'Employees', ico: '⚑', live: true },
  { id: 'settings',  label: 'Settings',  ico: '⚙' },
];

function shell(active) {
  const links = NAV.map(n => {
    let badge = '';
    if (n.id === 'requests' && counts.new) badge = `<span class="badge">${counts.new}</span>`;
    // Overdue is the only rental number worth interrupting someone for.
    if (n.id === 'rentals' && rentalCounts.overdue) badge = `<span class="badge overdue">${rentalCounts.overdue}</span>`;
    if (!n.live) return `<a class="soon" title="Coming next" href="#/${n.id}"><span class="ico">${n.ico}</span>${n.label}</a>`;
    return `<a href="#/${n.id}"${n.id === active ? ' aria-current="page"' : ''}><span class="ico">${n.ico}</span>${n.label}${badge}</a>`;
  }).join('');

  return $(`<div id="app">
    <aside class="rail">
      <div class="brand"><span class="name">Beehive Bin Co.</span><span class="tag">Operations</span></div>
      <nav>${links}</nav>
      <div class="rail-foot">
        <strong>${esc(me.name || me.email)}</strong>
        ${esc(me.email)}
        <span class="role">${esc(me.role)}</span>
      </div>
    </aside>
    <main id="view"></main>
  </div>`);
}

function render(active, node) {
  root.replaceChildren(shell(active));
  document.getElementById('view').replaceChildren(node);
  // The shell was built from whatever counts we had; re-check in the background
  // so moving between tabs never shows a number from ten minutes ago.
  refreshCounts().then(updateBadges);
}

const banner = (msg, kind = 'err') => $(`<div class="banner ${kind}">${esc(msg)}</div>`);

/* ---------- requests ---------- */
const reqState = { status: 'new', q: '' };

async function viewRequests() {
  const view = $('<div></div>');
  const filters = [['new', 'New'], ['lapsed', 'Lapsed'], ['converted', 'Booked'],
    ['declined', 'Declined'], ['all', 'All']];
  const head = $(`<div>
    <div class="head">
      <h1>Requests</h1><span class="count" id="rcount"></span>
      <button class="btn primary newreq" id="newreq">+ New request</button>
    </div>
    <p class="sub">Everything the reserve and contact forms send in, plus anything taken over the phone.</p>
    <div class="toolbar">
      <div class="seg">${filters.map(([f, label]) =>
        `<button data-f="${f}" aria-pressed="${f === reqState.status}">${label}</button>`).join('')}</div>
      <input class="search" type="search" placeholder="Name, email, phone, city…" value="${esc(reqState.q)}">
    </div>
  </div>`);
  const list = $('<div class="card"><div class="empty">Loading…</div></div>');
  view.append(head, list);
  render('requests', view);

  head.querySelector('#newreq').addEventListener('click', openNewRequest);

  head.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    reqState.status = b.dataset.f;
    viewRequests();
  }));

  const search = head.querySelector('.search');
  let timer;
  search.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => { reqState.q = search.value.trim(); loadList(list, head); }, 250);
  });

  loadList(list, head);
}

async function loadList(list, head) {
  try {
    const params = new URLSearchParams({ status: reqState.status });
    if (reqState.q) params.set('q', reqState.q);
    const { requests } = await api(`/requests?${params}`);
    head.querySelector('#rcount').textContent = requests.length
      ? `${requests.length}${requests.length === 200 ? '+' : ''}` : '';

    if (!requests.length) {
      list.replaceChildren($(`<div class="empty"><strong>Nothing here</strong>${
        reqState.q ? 'No request matches that search.'
          : reqState.status === 'lapsed' ? 'Nothing has gone past its date unanswered.'
          : 'Nothing in this list yet.'}</div>`));
      return;
    }

    const rows = requests.map(r => `<tr class="clickable${r.lapsed ? ' stale' : ''}" data-id="${r.id}">
      <td>${r.lapsed
        ? '<span class="pill lapsed" title="The date they asked for has passed">lapsed</span>'
        : `<span class="pill ${r.status}">${r.status}</span>`}${
        r.source === 'manual' ? ' <span class="pill manual" title="Taken by phone">phone</span>' : ''}</td>
      <td><div class="who">${esc(fullName(r))}<small>${esc(r.email || r.phone || '—')}</small></div></td>
      <td class="nowrap">${r.kind === 'contact' ? '<em style="color:var(--muted)">Question</em>' : esc(pkg(r))}</td>
      <td class="nowrap num">${esc(niceDate(r.start_date))}</td>
      <td class="hide-sm">${esc(r.delivery_city || '—')}</td>
      <td class="nowrap num hide-sm">${esc(money(r.quoted_total_cents))}</td>
      <td class="nowrap hide-sm" style="color:var(--muted)">${esc(ago(r.created_at))}</td>
    </tr>`).join('');

    const table = $(`<table>
      <thead><tr>
        <th>Status</th><th>Who</th><th>Package</th><th>Starts</th>
        <th class="hide-sm">City</th><th class="hide-sm">Quoted</th><th class="hide-sm">In</th>
      </tr></thead>
      <tbody>${rows}</tbody></table>`);
    table.querySelectorAll('tbody tr').forEach(tr =>
      tr.addEventListener('click', () => { location.hash = `#/requests/${tr.dataset.id}`; }));
    list.replaceChildren(table);
  } catch (err) {
    list.replaceChildren($(`<div class="empty"><strong>Could not load requests</strong>${esc(err.message)}</div>`));
  }
}

/* ---------- history ----------
   Everything that mutates already writes to audit_log; this is the first thing
   that reads it back. Collapsed by default — it answers "who did this and
   when", which is asked occasionally and urgently, not continuously. */

const ACTION_LABELS = {
  'request.create': 'Request entered by hand',
  'request.approve': 'Approved',
  'request.decline': 'Declined',
  'request.reopen': 'Moved back to new',
  'request.note': 'Note added',
  'rental.create': 'Rental created',
  'rental.agreement': 'Agreement marked signed',
  'rental.paid': 'Marked paid',
  'rental.delivered': 'Marked delivered',
  'rental.returned': 'Marked returned',
  'rental.update': 'Details updated',
  'rental.invoice': 'Invoice created',
  'rental.confirm_sent': 'Confirmation link emailed',
  'rental.sync': 'Checked Square for payment',
  'rental.agreement_signed': 'Signed by the customer',
  'rental.address_changed': 'Customer changed the address',
  'rental.signed_copy_sent': 'Signed copy emailed',
  'rental.signed_copy_failed': 'Signed copy failed to send',
  'note.add': 'Note added',
  'note.delete': 'Note deleted',
  'note.restore': 'Note restored',
  'square.invoice.payment_made': 'Square recorded payment',
  'square.invoice.updated': 'Square updated the invoice',
};

const SYSTEM_ACTORS = ['square-webhook', 'system', 'auto-enrolled'];

function historyPanel(container, entity, id) {
  api(`/${entity}/${id}/history`).then(({ history }) => {
    if (!history.length) { container.replaceChildren(); return; }
    const rows = history.map(h => `
      <li class="${SYSTEM_ACTORS.includes(h.actor_email) ? 'bysystem' : ''}">
        <span class="what">${esc(ACTION_LABELS[h.action] || h.action)}</span>
        <span class="who">— ${esc(h.actor_email)}</span>
        <div class="when" title="${esc(h.at)}">${esc(ago(h.at))}${
          h.detail ? ` · ${esc(String(h.detail).slice(0, 80))}` : ''}</div>
      </li>`).join('');
    container.replaceChildren($(`<details class="history">
      <summary>History (${history.length})</summary>
      <ol>${rows}</ol>
    </details>`));
  }).catch(() => container.replaceChildren());
}

/* ---------- extensions ----------
   Extra weeks on a rental in progress, priced from the same source as the
   booking form and invoiced separately. */

function extensionsPanel(container, rentalId, r) {
  // Nothing to extend before the rental is real or after the bins are back.
  const canExtend = r.status !== 'cancelled' && !r.returned_at
    && r.agreement_signed_at && r.paid_at;

  const render = exts => {
    const rows = exts.map(e => `
      <div class="ext">
        <span class="w">${e.weeks === 1 ? '1 extra week' : `${e.weeks} extra weeks`}</span>
        <span class="meta">${esc(money(e.amount_cents))} · back ${esc(niceDate(e.new_due_date))}
          · ${esc((e.created_by || '').split('@')[0])} ${esc(ago(e.created_at))}</span>
        ${e.square_invoice_url
          ? `<a class="btn sm" href="${esc(e.square_invoice_url)}" target="_blank" rel="noopener">Invoice</a>` : ''}
        <span class="st ${e.paid_at ? 'paid' : 'due'}">${e.paid_at ? 'paid' : (e.square_status || 'unpaid')}</span>
      </div>`).join('');

    container.replaceChildren($(`<div class="exts">
      ${exts.length ? `<label class="fl">Extensions</label>${rows}` : ''}
      <div id="ext-slot"></div>
    </div>`));

    const slot = container.querySelector('#ext-slot');
    if (!canExtend) {
      if (!exts.length) container.replaceChildren();
      return;
    }

    const showButton = () => {
      slot.replaceChildren($(`<button class="btn sm">${exts.length ? 'Extend again' : 'Extend this rental'}</button>`));
      slot.querySelector('button').addEventListener('click', showForm);
    };

    const showForm = () => {
      slot.replaceChildren($(`<div class="extform">
        <label class="fl">How many extra weeks?</label>
        <div class="weekpick">${[1,2,3,4,5,6].map(w =>
          `<button type="button" data-w="${w}" aria-pressed="${w === 1}">${w}</button>`).join('')}</div>
        <div class="extquote" id="ext-quote"></div>
        <label class="fl" for="ext-why">Why <span style="text-transform:none;letter-spacing:0;font-weight:400">(optional)</span></label>
        <input id="ext-why" placeholder="Closing delayed, still packing…">
        <div class="actions" style="margin-top:10px">
          <button class="btn sm primary" id="ext-go">Create extension invoice</button>
          <button class="btn sm" id="ext-cancel">Cancel</button>
        </div>
        <div id="ext-msg"></div>
      </div>`));

      let weeks = 1;
      const quote = slot.querySelector('#ext-quote');
      const sync = () => {
        const per = EXTRA[r.bins];
        const back = new Date(`${r.due_date}T12:00:00`);
        back.setDate(back.getDate() + 7 * weeks);
        quote.innerHTML = per == null
          ? `<small>No extra-week rate on file for ${r.bins} bins.</small>`
          : `$${per * weeks} <small>+ tax · back ${back.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' })}</small>`;
      };
      slot.querySelectorAll('[data-w]').forEach(b => b.addEventListener('click', () => {
        weeks = +b.dataset.w;
        slot.querySelectorAll('[data-w]').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.w === weeks)));
        sync();
      }));
      sync();

      slot.querySelector('#ext-cancel').addEventListener('click', showButton);
      slot.querySelector('#ext-go').addEventListener('click', async e => {
        e.target.disabled = true;
        e.target.textContent = 'Creating…';
        try {
          await api(`/rentals/${rentalId}/extensions`, {
            method: 'POST',
            body: JSON.stringify({ weeks, reason: slot.querySelector('#ext-why').value }),
          });
          openRental(rentalId);
        } catch (err) {
          slot.querySelector('#ext-msg').replaceChildren(banner(err.message));
          e.target.disabled = false;
          e.target.textContent = 'Create extension invoice';
        }
      });
    };
    showButton();
  };

  api(`/rentals/${rentalId}/extensions`)
    .then(({ extensions }) => render(extensions))
    .catch(() => container.replaceChildren());
}

/* ---------- internal notes ----------
   Attributed and append-only, so the input only appears when someone is
   actually writing — a permanently open box invites overwriting a colleague's
   note, which is the habit this replaces. */

function notesPanel(container, entity, id) {
  const render = notes => {
    const rows = notes.map(n => `
      <div class="n" data-pinned="${n.pinned}" data-deleted="${n.deleted_at ? 1 : 0}">
        <div class="body">${esc(n.body)}</div>
        <div class="meta">
          <span class="who">${esc(n.author)}</span>
          <span title="${esc(n.created_at)}">${esc(ago(n.created_at))}</span>
          ${n.deleted_at ? `<span>· deleted by ${esc(n.deleted_by || '—')}</span>` : `
            <button data-pin="${n.id}" data-to="${n.pinned ? 0 : 1}" class="pin">${
              n.pinned ? 'Unpin' : 'Pin'}</button>
            <button data-del="${n.id}">Delete</button>`}
        </div>
      </div>`).join('');

    container.replaceChildren($(`<div>
      <label class="fl">Internal notes <span style="font-weight:400;text-transform:none;letter-spacing:0">— staff only, never shown to the customer</span></label>
      <div class="notes">
        ${rows || '<div class="empty-n">No notes yet.</div>'}
      </div>
      <div id="n-add"></div>
    </div>`));

    const addBox = container.querySelector('#n-add');
    const showButton = () => {
      addBox.replaceChildren($('<button class="btn sm">Add a note</button>'));
      addBox.querySelector('button').addEventListener('click', showForm);
    };
    const showForm = () => {
      addBox.replaceChildren($(`<div>
        <textarea id="n-body" placeholder="What happened, or what the next person needs to know."></textarea>
        <div class="actions" style="margin-top:8px">
          <button class="btn sm primary" id="n-save">Save note</button>
          <button class="btn sm" id="n-cancel">Cancel</button>
          <label style="display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)">
            <input type="checkbox" id="n-pin"> Pin it
          </label>
        </div>
        <div id="n-msg"></div>
      </div>`));
      const ta = addBox.querySelector('#n-body');
      ta.focus();
      addBox.querySelector('#n-cancel').addEventListener('click', showButton);
      addBox.querySelector('#n-save').addEventListener('click', async e => {
        const text = ta.value.trim();
        if (!text) { ta.focus(); return; }
        e.target.disabled = true;
        try {
          const { notes: fresh } = await api(`/${entity}/${id}/notes`, {
            method: 'POST',
            body: JSON.stringify({ body: text, pinned: addBox.querySelector('#n-pin').checked }),
          });
          render(fresh);
        } catch (err) {
          addBox.querySelector('#n-msg').replaceChildren(banner(err.message));
          e.target.disabled = false;
        }
      });
    };
    showButton();

    container.querySelectorAll('[data-pin]').forEach(b => b.addEventListener('click', async () => {
      try { render((await api(`/notes/${b.dataset.pin}`, { method: 'PATCH', body: JSON.stringify({ pinned: b.dataset.to === '1' }) })).notes); }
      catch (err) { container.prepend(banner(err.message)); }
    }));
    container.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('Delete this note? It stays in the record, marked deleted.')) return;
      try { render((await api(`/notes/${b.dataset.del}`, { method: 'PATCH', body: JSON.stringify({ deleted: true }) })).notes); }
      catch (err) { container.prepend(banner(err.message)); }
    }));
  };

  container.replaceChildren($('<div class="empty-n">Loading notes…</div>'));
  api(`/${entity}/${id}/notes`)
    .then(({ notes }) => render(notes))
    .catch(err => container.replaceChildren(banner(err.message)));
}

/* ---------- request drawer ---------- */
/* Only ever one drawer. Hash navigation (browser back/forward, or a link
   straight to another request) otherwise stacks a second one on top of the
   first, leaving a stale panel visible over the one you asked for. */
function closeAnyDrawer() {
  document.querySelectorAll('.scrim, .drawer').forEach(el => el.remove());
}

async function openRequest(id) {
  if (!document.getElementById('app')) await viewRequests();
  closeAnyDrawer();

  const scrim = $('<div class="scrim"></div>');
  const drawer = $('<div class="drawer" role="dialog" aria-modal="true"><div class="dbody">Loading…</div></div>');
  const close = () => { scrim.remove(); drawer.remove(); document.removeEventListener('keydown', onKey);
    if (location.hash.startsWith('#/requests/')) location.hash = '#/requests'; };
  const onKey = e => { if (e.key === 'Escape') close(); };
  scrim.addEventListener('click', close);
  document.addEventListener('keydown', onKey);
  document.body.append(scrim, drawer);

  let r;
  try {
    ({ request: r } = await api(`/requests/${id}`));
  } catch (err) {
    drawer.replaceChildren($(`<div class="dbody"><div class="banner err">${esc(err.message)}</div></div>`));
    return;
  }

  /* tel:/sms: want E.164; the stored string is whatever the customer typed. */
  const digits = String(r.phone || '').replace(/\D/g, '');
  const tel = digits.length === 10 ? `+1${digits}`
    : digits.length === 11 && digits[0] === '1' ? `+${digits}`
    : digits;
  const pref = r.contact_pref;
  // The preferred method is the filled button, so the right move is obvious
  // before reading anything.
  const contactBtn = (kind, href, label) =>
    `<a class="btn sm${pref === kind ? ' primary' : ''}" href="${href}">${label}</a>`;
  const actions = [
    r.phone && digits ? contactBtn('text', `sms:${tel}`, 'Text') : '',
    r.phone && digits ? contactBtn('call', `tel:${tel}`, 'Call') : '',
    r.email ? contactBtn('email', `mailto:${esc(r.email)}`, 'Email') : '',
  ].filter(Boolean).join('');

  const extras = [];
  if (r.kind === 'reserve' && r.return_date) extras.push(['Back by', niceDate(r.return_date)]);
  if (r.pickup_city && r.pickup_city !== r.delivery_city) extras.push(['Pickup city', r.pickup_city]);

  drawer.replaceChildren($(`
    <div class="dhead">
      <div style="flex:1">
        <h2>${esc(fullName(r))}</h2>
        <div class="meta">${r.kind === 'reserve' ? 'Reservation' : 'Question'} · #${r.id} · ${esc(ago(r.created_at))}</div>
      </div>
      <span class="pill ${r.status}" style="margin-top:3px">${r.status}</span>
      <button class="x" aria-label="Close">×</button>
    </div>
    <div class="dbody">
      ${actions ? `<div class="contactbar">${actions}${
        pref ? `<span class="prefnote">prefers ${esc(pref)}</span>` : ''}</div>` : ''}
      <dl class="kv">
        <dt>Phone</dt><dd>${esc(r.phone || '—')}</dd>
        <dt>Email</dt><dd>${esc(r.email || '—')}</dd>
        ${r.kind === 'reserve' ? `
        <dt>Package</dt><dd>${esc(pkg(r))}</dd>
        <dt>Quoted</dt><dd>${esc(money(r.quoted_total_cents))} <span style="color:var(--muted);font-weight:400">before tax</span></dd>` : ''}
        <dt>${r.kind === 'reserve' ? 'Starts' : 'Needs bins'}</dt><dd>${esc(niceDate(r.start_date))}</dd>
        ${extras.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}
        <dt>Delivery city</dt><dd>${esc(r.delivery_city || '—')}</dd>
        ${r.decided_by ? `<dt>Decided</dt><dd>${esc(r.decided_by)}<br><span style="color:var(--muted);font-weight:400">${esc(ago(r.decided_at))}</span></dd>` : ''}
      </dl>

      ${r.message ? `<div class="note"><h4>Their message</h4>${esc(r.message)}</div>` : ''}
      ${r.customer_notes ? `<div class="note"><h4>Notes from the customer</h4>${esc(r.customer_notes)}</div>` : ''}
      ${r.decline_reason ? `<div class="note"><h4>Why it was declined</h4>${esc(r.decline_reason)}</div>` : ''}

      <div id="req-notes"></div>
      <div id="req-history" style="margin-top:6px"></div>

      <div class="actions" style="margin-top:22px;border-top:1px solid var(--line);padding-top:18px">
        ${r.status === 'new' ? `
          <button class="btn primary" data-act="approve">Approve</button>
          <button class="btn danger" data-act="decline">Decline</button>`
        : `<button class="btn" data-act="reopen">Move back to new</button>`}
      </div>
      <div id="drawer-msg"></div>
    </div>`));

  drawer.querySelector('.x').addEventListener('click', close);

  const msg = drawer.querySelector('#drawer-msg');
  const act = async (action, extra = {}) => {
    msg.replaceChildren();
    try {
      const res = await api(`/requests/${id}/decision`, { method: 'POST', body: JSON.stringify({ action, ...extra }) });
      await refreshCounts();
      close();
      // Approving creates a rental; go straight to it, since the next thing
      // anyone does is fill in the address and chase the agreement.
      if (res.rental_id) { location.hash = `#/rentals/${res.rental_id}`; return; }
      viewRequests();
    } catch (err) {
      msg.replaceChildren(banner(err.message));
    }
  };

  notesPanel(drawer.querySelector('#req-notes'), 'requests', id);
  historyPanel(drawer.querySelector('#req-history'), 'requests', id);
  drawer.querySelector('[data-act="approve"]')?.addEventListener('click', () => act('approve'));
  drawer.querySelector('[data-act="reopen"]')?.addEventListener('click', () => act('reopen'));
  drawer.querySelector('[data-act="decline"]')?.addEventListener('click', () => {
    const reason = prompt('Why is this being declined? (optional — the customer never sees it)');
    if (reason === null) return;
    act('decline', { reason });
  });
}

/* ---------- new request (phone-in) ---------- */
// PRICING:start
const PRICES = { 10: 39, 20: 79, 40: 129, 60: 179 };
const EXTRA  = { 10: 25, 20: 40, 40: 65, 60: 90 };
// PRICING:end

function openNewRequest() {
  closeAnyDrawer();
  const scrim = $('<div class="scrim"></div>');
  const drawer = $('<div class="drawer" role="dialog" aria-modal="true"></div>');
  const close = () => { scrim.remove(); drawer.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  scrim.addEventListener('click', close);
  document.addEventListener('keydown', onKey);

  const today = new Date().toISOString().slice(0, 10);

  drawer.append($(`
    <div class="dhead">
      <div style="flex:1"><h2>New request</h2>
        <div class="meta">Taken by phone or in person</div></div>
      <button class="x" aria-label="Close">\u00D7</button>
    </div>`), $(`
    <div class="dbody">
      <div class="frow one">
        <div><label class="fl" for="n-kind">Type</label>
          <select id="n-kind">
            <option value="reserve">Reservation</option>
            <option value="contact">Question / enquiry</option>
          </select></div>
      </div>
      <div class="frow">
        <div><label class="fl" for="n-first">First name</label><input id="n-first" required></div>
        <div><label class="fl" for="n-last">Last name</label><input id="n-last"></div>
      </div>
      <div class="frow">
        <div><label class="fl" for="n-phone">Phone</label><input id="n-phone" type="tel"></div>
        <div><label class="fl" for="n-email">Email</label><input id="n-email" type="email"></div>
      </div>
      <div class="frow one">
        <div><label class="fl" for="n-pref">Best way to reach them</label>
          <select id="n-pref">
            <option value="text">Text</option>
            <option value="call" selected>Call</option>
            <option value="email">Email</option>
          </select></div>
      </div>

      <div id="n-reserve">
        <div class="frow">
          <div><label class="fl" for="n-bins">Package</label>
            <select id="n-bins">
              <option value="10">10 bins</option><option value="20">20 bins</option>
              <option value="40" selected>40 bins</option><option value="60">60 bins</option>
            </select></div>
          <div><label class="fl" for="n-weeks">Weeks</label>
            <input id="n-weeks" type="number" min="1" max="26" value="1"></div>
        </div>
        <div class="quote">
          <span>Standard rate <small id="n-back"></small></span>
          <strong id="n-quote">\u2014</strong>
        </div>
        <div class="frow">
          <div><label class="fl" for="n-start">Start date</label>
            <input id="n-start" type="date" min="${today}"></div>
          <div><label class="fl" for="n-override">Custom price</label>
            <input id="n-override" placeholder="Leave blank for standard"></div>
        </div>
      </div>

      <div class="frow">
        <div><label class="fl" for="n-dcity">Delivery city</label><input id="n-dcity"></div>
        <div><label class="fl" for="n-pcity">Pickup city</label><input id="n-pcity" placeholder="If different"></div>
      </div>

      <label class="fl" for="n-notes">Notes from the customer</label>
      <textarea id="n-notes" placeholder="Stairs, gate codes, custom quantities\u2026"></textarea>

      <div style="height:12px"></div>
      <label class="fl" for="n-internal">Internal notes</label>
      <textarea id="n-internal" placeholder="Only staff see this."></textarea>

      <div id="n-msg" style="margin-top:14px"></div>
      <div class="actions" style="margin-top:16px;border-top:1px solid var(--line);padding-top:18px">
        <button class="btn primary" id="n-save">Create request</button>
        <button class="btn" id="n-cancel">Cancel</button>
      </div>
    </div>`));

  document.body.append(scrim, drawer);
  const q = id => drawer.querySelector('#' + id);

  // Mirror the site's quote so a phoned-in customer hears the same number the
  // website would have shown them.
  const sync = () => {
    const bins = +q('n-bins').value;
    const weeks = Math.max(1, +q('n-weeks').value || 1);
    q('n-quote').textContent = '$' + (PRICES[bins] + (weeks - 1) * EXTRA[bins]);
    const start = q('n-start').value;
    if (start) {
      const d = new Date(start + 'T12:00:00');
      d.setDate(d.getDate() + 7 * weeks);
      q('n-back').textContent = '\u00B7 back ' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    } else q('n-back').textContent = '';
  };
  ['n-bins', 'n-weeks', 'n-start'].forEach(id => q(id).addEventListener('input', sync));
  sync();

  const isReserve = () => q('n-kind').value === 'reserve';
  q('n-kind').addEventListener('change', () => { q('n-reserve').hidden = !isReserve(); });

  drawer.querySelector('.x').addEventListener('click', close);
  q('n-cancel').addEventListener('click', close);

  q('n-save').addEventListener('click', async () => {
    const btn = q('n-save');
    btn.disabled = true;
    q('n-msg').replaceChildren();
    try {
      const { request } = await api('/requests', { method: 'POST', body: JSON.stringify({
        kind: q('n-kind').value,
        first_name: q('n-first').value, last_name: q('n-last').value,
        phone: q('n-phone').value, email: q('n-email').value,
        contact_pref: q('n-pref').value,
        bins: q('n-bins').value, weeks: q('n-weeks').value,
        start_date: q('n-start').value, delivery_city: q('n-dcity').value,
        pickup_city: q('n-pcity').value, quoted_total: q('n-override').value,
        customer_notes: isReserve() ? q('n-notes').value : '',
        message: isReserve() ? '' : q('n-notes').value,
        internal_notes: q('n-internal').value,
      })});
      close();
      await refreshCounts();
      await viewRequests();
      location.hash = `#/requests/${request.id}`;
    } catch (err) {
      q('n-msg').replaceChildren(banner(err.message));
      btn.disabled = false;
    }
  });
}

/* ---------- rentals ---------- */
const rentState = { status: 'active' };
const RENT_FILTERS = [['active','Active'],['stalled','Stalled'],['pending','Pending'],
  ['out','Out'],['returned','Returned'],['all','All']];

const isLate = r => r.status === 'out' && r.due_date && r.due_date < new Date().toISOString().slice(0, 10);

async function viewRentals() {
  const view = $(`<div>
    <div class="head"><h1>Rentals</h1><span class="count" id="ncount"></span></div>
    <p class="sub">Approved jobs, from agreement through pickup.</p>
    <div class="toolbar">
      <div class="seg">${RENT_FILTERS.map(([f, label]) =>
        `<button data-f="${f}" aria-pressed="${f === rentState.status}">${label}</button>`).join('')}</div>
    </div>
    <div class="card" id="nlist"><div class="empty">Loading…</div></div>
  </div>`);
  render('rentals', view);

  view.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    rentState.status = b.dataset.f;
    viewRentals();
  }));

  const list = view.querySelector('#nlist');
  try {
    const { rentals } = await api(`/rentals?status=${rentState.status}`);
    view.querySelector('#ncount').textContent = rentals.length || '';

    if (!rentals.length) {
      list.replaceChildren($(`<div class="empty"><strong>Nothing here</strong>${
        rentState.status === 'active'
          ? 'No active rentals. Approve a request to start one.'
          : 'No rentals in this list.'}</div>`));
      return;
    }

    const rows = rentals.map(r => `<tr class="clickable${isLate(r) ? ' late' : r.stalled ? ' stale' : ''}" data-id="${r.id}">
      <td><span class="pill ${r.status}">${r.status}</span>${
        isLate(r) ? ' <span class="pill overdue">late</span>'
        : r.stalled ? ' <span class="pill stalled" title="Never confirmed and the start date has passed">stalled</span>' : ''}</td>
      <td><div class="who">${esc(fullName(r))}<small>${esc(r.delivery_city || '—')}</small></div></td>
      <td class="nowrap">${r.bins} bins · ${r.weeks === 1 ? '1 wk' : r.weeks + ' wks'}</td>
      <td class="nowrap num">${esc(niceDate(r.start_date))}</td>
      <td class="nowrap num">${esc(niceDate(r.due_date))}</td>
      <td class="nowrap num hide-sm">${esc(money(r.total_cents))}</td>
      <td class="nowrap hide-sm">${[
        r.agreement_signed_at ? 'signed' : '', r.paid_at ? 'paid' : '',
      ].filter(Boolean).join(' · ') || '<span style="color:var(--muted)">—</span>'}</td>
    </tr>`).join('');

    const table = $(`<table><thead><tr>
      <th>Status</th><th>Who</th><th>Package</th><th>Out</th><th>Back</th>
      <th class="hide-sm">Total</th><th class="hide-sm">Steps</th>
    </tr></thead><tbody>${rows}</tbody></table>`);
    table.querySelectorAll('tbody tr').forEach(tr =>
      tr.addEventListener('click', () => { location.hash = `#/rentals/${tr.dataset.id}`; }));
    list.replaceChildren(table);
  } catch (err) {
    list.replaceChildren($(`<div class="empty"><strong>Could not load rentals</strong>${esc(err.message)}</div>`));
  }
}

const STEPS = [
  ['agreement', 'agreement_signed_at', 'Agreement signed'],
  ['paid',      'paid_at',             'Paid'],
  ['delivered', 'delivered_at',        'Bins delivered'],
  ['returned',  'returned_at',         'Bins back'],
];

async function openRental(id) {
  if (!document.getElementById('app')) await viewRentals();
  closeAnyDrawer();

  const scrim = $('<div class="scrim"></div>');
  const drawer = $('<div class="drawer" role="dialog" aria-modal="true"><div class="dbody">Loading…</div></div>');
  const close = () => { scrim.remove(); drawer.remove(); document.removeEventListener('keydown', onKey);
    if (location.hash.startsWith('#/rentals/')) location.hash = '#/rentals'; };
  const onKey = e => { if (e.key === 'Escape') close(); };
  scrim.addEventListener('click', close);
  document.addEventListener('keydown', onKey);
  document.body.append(scrim, drawer);

  let r, photos = [];
  try {
    // Fetched together so the checklist can render its own evidence rather than
    // filling in underneath a moment later.
    const [rental, shots] = await Promise.all([
      api(`/rentals/${id}`),
      api(`/rentals/${id}/photos`).catch(() => ({ photos: [] })),
    ]);
    r = rental.rental;
    photos = shots.photos || [];
  }
  catch (err) {
    drawer.replaceChildren($(`<div class="dbody"><div class="banner err">${esc(err.message)}</div></div>`));
    return;
  }

  const digits = String(r.phone || '').replace(/\D/g, '');
  const tel = digits.length === 10 ? `+1${digits}` : digits.length === 11 && digits[0] === '1' ? `+${digits}` : digits;
  const pref = r.contact_pref;
  const cbtn = (kind, href, label) =>
    `<a class="btn sm${pref === kind ? ' primary' : ''}" href="${href}">${label}</a>`;
  const actions = [
    digits ? cbtn('text', `sms:${tel}`, 'Text') : '',
    digits ? cbtn('call', `tel:${tel}`, 'Call') : '',
    r.email ? cbtn('email', `mailto:${esc(r.email)}`, 'Email') : '',
  ].filter(Boolean).join('');

  drawer.replaceChildren($(`
    <div class="dhead">
      <div style="flex:1">
        <h2>${esc(fullName(r))}</h2>
        <div class="meta">Rental #${r.id}${r.request_id ? ` · from request #${r.request_id}` : ''}</div>
      </div>
      <span class="pill ${r.status}" style="margin-top:3px">${r.status}</span>
      <button class="x" aria-label="Close">×</button>
    </div>
    <div class="dbody">
      ${actions ? `<div class="contactbar">${actions}${
        pref ? `<span class="prefnote">prefers ${esc(pref)}</span>` : ''}</div>` : ''}

      ${isLate(r) ? '<div class="banner err">Past its return date and still out.</div>' : ''}
      ${r.stalled ? `<div class="banner err">This never got confirmed and its start date
        (${esc(niceDate(r.start_date))}) has passed. Chase it or cancel it &mdash; the bins
        are not going anywhere while it sits here.</div>` : ''}

      ${r.confirm_token ? `<div class="linkbox">
          <h4>Confirmation link${r.confirm_sent_at
            ? ` — emailed to ${esc(r.email)} ${esc(ago(r.confirm_sent_at))}`
            : ' — not sent yet'}</h4>
          <code>${esc(`https://${bookingHost}/${r.confirm_token}`)}</code>
          <div class="row">
            <button class="btn sm${r.confirm_sent_at ? '' : ' primary'}" id="r-send">${
              r.confirm_sent_at ? 'Resend email' : 'Email it to them'}</button>
            <button class="btn sm" id="r-copy">Copy link</button>
            <a class="btn sm" href="${esc(`https://${bookingHost}/${r.confirm_token}`)}" target="_blank" rel="noopener">Preview</a>
          </div>
        </div>` : ''}

      ${r.signed_at ? (r.agreement_manual
        ? `<p class="signed"><span style="color:var(--warn);font-weight:700">Recorded by staff</span> —
           ${esc(r.agreement_manual_by || '—')} ${esc(ago(r.signed_at))}${
             r.agreement_manual_reason ? ` · ${esc(r.agreement_manual_reason)}` : ''}.
           Not a customer e-signature.</p>`
        : `<p class="signed">Signed by <strong>${esc(r.agreement_name)}</strong>
           ${esc(ago(r.signed_at))} · agreement ${esc(r.agreement_version || '—')}${
             r.signed_on_behalf ? ` · <span style="color:var(--warn);font-weight:700">on behalf of ${esc(fullName(r))}</span>` : ''}</p>`) : ''}


      ${/* Gated on the link being sent, not on an invoice existing — the invoice
            is now raised by the customer's card at the end, so waiting for one
            would hide the checklist for the whole rental. */
        !r.confirm_sent_at ? `
      <div class="kickoff">
        <h4>Start this rental</h4>
        <p>Nothing else can happen until the customer has their link &mdash; they
        confirm the details, sign the agreement, put a card on file and pay from
        it. The invoice is raised and charged when they do.</p>
        <button class="btn primary" id="r-invoice"${r.email ? '' : ' disabled'}>
          ${r.email ? 'Email them the link' : 'No email address on this rental'}</button>
        <span class="to">${esc(money(r.total_cents))} + tax${r.email ? ` &rarr; ${esc(r.email)}` : ''}</span>
      </div>` : `
      <div class="steps">${STEPS.map(([key, col, label]) => {
        const done = r[col] ? 1 : 0;

        /* Payment is the one row with anything to do, so the invoice controls
           live in it rather than in a separate card repeating its status. */
        if (key === 'paid') {
          const locked = r.square_status === 'PAID';
          // The checklist only renders once an invoice exists, so this row is
          // never the place an invoice gets created.
          const acts = r.square_invoice_id
            ? `${r.square_invoice_url ? `<a class="btn sm" href="${esc(r.square_invoice_url)}" target="_blank" rel="noopener">Open</a>` : ''}
               ${locked ? '' : '<button class="btn sm" id="r-sync">Check</button>'}`
            : `<span class="amt">${r.square_card_id ? 'card saved, raising invoice…' : 'waiting on the customer'}</span>`;
          return `
          <div class="step payrow" data-done="${done}" data-locked="${locked ? 1 : 0}">
            <button class="tick" data-step="paid" data-done="${done}"
              data-locked="${locked ? 1 : 0}" title="${locked ? 'Square has this paid' : 'Mark paid by hand'}">✓</button>
            <span class="lbl">Payment</span>
            <span class="amt">${r.tax_cents != null
              ? `${esc(money(r.total_cents + r.tax_cents))} inc. tax` : `${esc(money(r.total_cents))} + tax`}</span>
            ${locked ? '<span class="src">via Square</span>'
              : r.square_invoice_id ? `<span class="src">${esc(r.square_status || 'sent')}</span>` : ''}
            <div class="acts">${acts}${
              r[col] ? `<span class="when">${esc(ago(r[col]))}</span>` : ''}</div>
          </div>`;
        }

        /* Delivery and pickup each carry the photo that proves them, in the row
           that needs it — a separate gallery lower down meant taking the photo
           and ticking the box were two different places on the screen. */
        if (key === 'delivered' || key === 'returned') {
          const kind = key === 'delivered' ? 'delivery' : 'pickup';
          const mine = photos.filter(ph => ph.kind === kind);
          // Nothing comes back before it goes out, so the pickup row waits.
          const waiting = key === 'returned' && !r.delivered_at;
          const thumbs = mine.map(ph => `
            <figure>
              <img loading="lazy" src="/api/photo/${encodeURIComponent(ph.r2_key)}"
                alt="${kind} photo" title="${esc(ph.taken_by)} · ${esc(ago(ph.taken_at))}">
              <button class="rm" data-rm="${ph.id}" title="Remove">×</button>
            </figure>`).join('');
          /* Not due yet, and not unlocked. Openable, not forbidden — you drop
             the evening before, or collect early when someone finishes — and
             the history records that you did. Both ends behave the same way;
             two cards that look identical should not follow different rules. */
          const today = new Date().toISOString().slice(0, 10);
          const notDue = !done && (
            (key === 'delivered' && !r.delivery_unlocked_at && r.start_date && r.start_date > today) ||
            (key === 'returned' && !waiting && !r.pickup_unlocked_at && r.due_date && r.due_date > today));
          const dueOn = key === 'delivered' ? r.start_date : r.due_date;
          return `
          <div class="step photorow${waiting ? ' waiting' : ''}${notDue ? ' datelocked' : ''}" data-done="${done}">
            <div class="top">
              <button class="tick"${waiting || notDue ? ' disabled' : ` data-step="${key}"`} data-done="${done}">✓</button>
              <span class="lbl">${label}</span>
              ${waiting ? '<span class="soon">after the bins are delivered</span>' : ''}
              ${notDue ? `<span class="notdue">not due ${key === 'delivered' ? 'out' : 'back'} until ${esc(niceDate(dueOn))}</span>
                <button class="lockbtn" data-unlock="${key}" title="Open this step early">🔒 Unlock</button>`
                : `<span class="when" style="margin-left:auto">${r[col] ? esc(ago(r[col])) : ''}</span>`}
            </div>
            <div class="addr">
              <label>${kind === 'delivery' ? 'Delivery address' : 'Pickup address'}</label>
              ${(() => {
                const val = (kind === 'delivery' ? r.delivery_address : r.pickup_address) || '';
                const id = kind === 'delivery' ? 'r-daddr' : 'r-paddr';
                return `
                <div class="shown">
                  <span class="val${val ? '' : ' empty'}">${
                    esc(val || (kind === 'delivery' ? 'Not given yet' : 'Same as delivery'))}</span>
                  <button class="btn sm" data-editaddr="${id}">${val ? 'Edit' : 'Add'}</button>
                </div>
                <div class="edit" hidden>
                  <input data-part="${kind}_street" value="${esc(r[kind + '_street'] || '')}"
                    placeholder="Street address">
                  <input data-part="${kind}_unit" value="${esc(r[kind + '_unit'] || '')}"
                    placeholder="Apartment or unit (optional)" style="margin-top:7px">
                  <div style="display:flex;gap:7px;margin-top:7px">
                    <input data-part="${kind}_city" value="${esc((kind === 'delivery' ? r.delivery_city : r.pickup_city) || '')}"
                      placeholder="City" style="flex:1">
                    <input data-part="${kind}_zip" value="${esc(r[kind + '_zip'] || '')}"
                      placeholder="ZIP" maxlength="5" style="width:80px">
                  </div>
                  <div class="saverow">
                    <button class="btn sm primary" data-saveaddr="1">Save</button>
                    <button class="btn sm" data-canceladdr="1">Cancel</button>
                    <span class="saved" data-savedmsg="1"></span>
                  </div>
                </div>`;
              })()}
              ${(kind === 'delivery' ? r.delivery_notes : r.pickup_notes)
                ? `<div class="cust"><b>From the customer</b>${
                    esc(kind === 'delivery' ? r.delivery_notes : r.pickup_notes)}</div>` : ''}
            </div>
            <div class="ev">
              ${notDue
                ? `<span class="soon">Unlock this step to add a photo.</span>`
                : waiting
                ? '<span class="soon">The pickup photo is taken when the bins come back.</span>'
                : `${thumbs || `<span class="need">Photo needed</span>`}
                   <label class="shoot">
                     <input type="file" accept="image/*" capture="environment" data-kind="${kind}" multiple>
                     <span>📷 ${mine.length ? 'Add' : `Take ${kind} photo`}</span>
                   </label>`}
            </div>
          </div>`;
        }

        // A customer's own signature is locked here, the way Square's payment is.
        const sigLocked = key === 'agreement' && r.signed_at && !r.agreement_manual;
        return `
        <button class="step" data-step="${key}" data-done="${done}" data-locked="${sigLocked ? 1 : 0}"${
          sigLocked ? ' aria-disabled="true"' : ''}>
          <span class="tick">✓</span><span class="lbl">${label}</span>
          ${sigLocked ? '<span class="src">signed by customer</span>' : ''}
          <span class="when">${r[col] ? esc(ago(r[col])) : ''}</span>
        </button>`; }).join('')}</div>`}

      <dl class="kv">
        <dt>Package</dt><dd>${r.bins} bins · ${r.weeks === 1 ? '1 week' : r.weeks + ' weeks'}</dd>
        <dt>Total</dt><dd>${esc(money(r.total_cents))} <span style="color:var(--muted);font-weight:400">before tax</span></dd>
        <dt>Delivered</dt><dd>${esc(niceDate(r.start_date))}</dd>
        <dt>Back by</dt><dd>${esc(niceDate(r.due_date))}</dd>
        <dt>Phone</dt><dd>${esc(r.phone || '—')}</dd>
        <dt>Email</dt><dd>${esc(r.email || '—')}</dd>
      </dl>


      <div style="height:20px"></div>
      ${r.square_invoice_id ? `<label class="holdline">
        <input type="checkbox" id="ph-hold"${r.photo_hold ? ' checked' : ''}>
        <span>Keep photos past the 90-day limit &mdash; there&rsquo;s a dispute open</span>
      </label>` : ''}
      <div id="rent-exts"></div>
      <div id="rent-notes"></div>
      <div id="rent-history" style="margin-top:6px"></div>

      <div id="r-msg" style="margin-top:14px"></div>
      <div class="actions" style="margin-top:20px;border-top:1px solid var(--line);padding-top:18px">
        ${r.status === 'cancelled'
          ? '<button class="btn" data-status="pending">Reinstate</button>'
          : '<button class="btn danger" data-status="cancelled">Cancel rental</button>'}
      </div>
    </div>`));

  drawer.querySelector('.x').addEventListener('click', close);
  const msg = drawer.querySelector('#r-msg');

  const patch = async (body) => {
    msg.replaceChildren();
    const res = await api(`/rentals/${id}`, { method: 'PATCH', body: JSON.stringify(body) });
    await refreshCounts();
    return res;
  };

  drawer.querySelectorAll('.step[data-step], .payrow .tick, .photorow .tick').forEach(b => b.addEventListener('click', async () => {
    if (b.dataset.locked === '1') return;
    const done = b.dataset.done === '1';
    // Undoing a milestone is a correction, not a routine action — a stray click
    // should not quietly rewrite what happened.
    const label = b.querySelector('.lbl')?.textContent || 'Payment';
    if (done && !confirm(`Undo "${label}"?`)) return;
    try {
      await patch({ milestone: b.dataset.step, done: !done });
      openRental(id);
    } catch (err) {
      // Delivering something unpaid is allowed, but only on purpose.
      // A hard ordering rule — nothing comes back before it goes out. No reason
      // makes it true, so there is nothing to prompt for.
      if (/cannot come back|already marked back|nothing to photograph/i.test(err.message)) {
        msg.replaceChildren(banner(err.message));
        return;
      }
      // Delivering early is a decision, not an error.
      if (/Deliver anyway\?/i.test(err.message)) {
        if (!confirm(err.message)) return;
        try { await patch({ milestone: b.dataset.step, done: true, force: true }); openRental(id); }
        catch (e2) { msg.replaceChildren(banner(e2.message)); }
        return;
      }
      // The customer signs through their own link; recording it here instead is
      // allowed but has to say how they actually agreed.
      if (/say how they agreed/i.test(err.message)) {
        const why = prompt('The customer signs through their own link.\n\nIf they agreed another way — a paper copy at the door, or on a call — say how:');
        if (why === null || !why.trim()) return;
        try { await patch({ milestone: 'agreement', done: true, reason: why }); openRental(id); }
        catch (e2) { msg.replaceChildren(banner(e2.message)); }
        return;
      }
      // No photo. Allowed, but the reason is recorded rather than shrugged off.
      if (/photo yet/i.test(err.message)) {
        const why = prompt(`${err.message}\n\nWhy is there no photo?`);
        if (why === null || !why.trim()) return;
        try {
          await patch({ milestone: b.dataset.step, done: true, force: true, photo_reason: why });
          openRental(id);
        } catch (e2) { msg.replaceChildren(banner(e2.message)); }
        return;
      }
      msg.replaceChildren(banner(err.message));
    }
  }));

  drawer.querySelectorAll('[data-unlock]').forEach(b => b.addEventListener('click', async () => {
    const step = b.dataset.unlock;
    const when = niceDate(step === 'delivered' ? r.start_date : r.due_date);
    const what = step === 'delivered' ? "aren't due out" : "aren't due back";
    if (!confirm(`These bins ${what} until ${when}.\n\nUnlock this step anyway? It'll be recorded.`)) return;
    try { await api(`/rentals/${id}/unlock`, { method: 'POST', body: JSON.stringify({ step }) }); openRental(id); }
    catch (err) { msg.replaceChildren(banner(err.message)); }
  }));

  drawer.querySelectorAll('.photorow input[type="file"]').forEach(input =>
    input.addEventListener('change', async () => {
      const files = [...input.files];
      if (!files.length) return;
      const label = input.closest('.shoot').querySelector('span');
      msg.replaceChildren();
      try {
        for (const [i, file] of files.entries()) {
          label.textContent = files.length > 1 ? `${i + 1}/${files.length}…` : 'Uploading…';
          const res = await fetch(`/api/rentals/${id}/photos?kind=${input.dataset.kind}`, {
            method: 'POST',
            headers: { 'Content-Type': file.type || 'image/jpeg' },
            body: file,
          });
          if (!res.ok) throw new Error((await res.json()).error || `Upload failed (${res.status})`);
        }
        openRental(id);
      } catch (err) {
        label.textContent = '📷 Try again';
        msg.replaceChildren(banner(err.message));
      }
    }));

  drawer.querySelectorAll('.photorow [data-rm]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Remove this photo? The record that it existed stays.')) return;
    try { await api(`/photos/${b.dataset.rm}`, { method: 'DELETE' }); openRental(id); }
    catch (err) { msg.replaceChildren(banner(err.message)); }
  }));

  drawer.querySelector('#ph-hold')?.addEventListener('change', async e => {
    try {
      await api(`/rentals/${id}/photo-hold`, { method: 'POST', body: JSON.stringify({ hold: e.target.checked }) });
    } catch (err) {
      e.target.checked = !e.target.checked;
      msg.replaceChildren(banner(err.message));
    }
  });

  extensionsPanel(drawer.querySelector('#rent-exts'), id, r);
  notesPanel(drawer.querySelector('#rent-notes'), 'rentals', id);
  historyPanel(drawer.querySelector('#rent-history'), 'rentals', id);

  drawer.querySelector('#r-send')?.addEventListener('click', async e => {
    const was = e.target.textContent;
    e.target.disabled = true; e.target.textContent = 'Sending…';
    msg.replaceChildren();
    try {
      await api(`/rentals/${id}/send`, { method: 'POST' });
      openRental(id);
    } catch (err) {
      msg.replaceChildren(banner(err.message));
      e.target.disabled = false; e.target.textContent = was;
    }
  });

  drawer.querySelector('#r-copy')?.addEventListener('click', async e => {
    try {
      await navigator.clipboard.writeText(`https://${bookingHost}/${r.confirm_token}`);
      e.target.textContent = 'Copied';
      setTimeout(() => { e.target.textContent = 'Copy link'; }, 1500);
    } catch { e.target.textContent = 'Copy failed'; }
  });

  drawer.querySelector('#r-invoice')?.addEventListener('click', async e => {
    e.target.disabled = true;
    e.target.textContent = 'Sending…';
    msg.replaceChildren();
    try {
      await api(`/rentals/${id}/invoice`, { method: 'POST' });
      await refreshCounts();
      openRental(id);
    } catch (err) {
      msg.replaceChildren(banner(err.message));
      e.target.disabled = false;
      e.target.textContent = 'Create invoice & email the customer';
    }
  });

  drawer.querySelector('#r-sync')?.addEventListener('click', async e => {
    e.target.disabled = true;
    e.target.textContent = 'Checking…';
    msg.replaceChildren();
    try {
      await api(`/rentals/${id}/sync`, { method: 'POST' });
      await refreshCounts();
      openRental(id);
    } catch (err) {
      msg.replaceChildren(banner(err.message));
      e.target.disabled = false;
      e.target.textContent = 'Check for payment';
    }
  });

  drawer.querySelectorAll('[data-editaddr]').forEach(b => b.addEventListener('click', () => {
    const box = b.closest('.addr');
    box.querySelector('.shown').hidden = true;
    box.querySelector('.edit').hidden = false;
    box.querySelector('input').focus();
  }));

  drawer.querySelectorAll('[data-canceladdr]').forEach(b => b.addEventListener('click', () => {
    const box = b.closest('.addr');
    box.querySelector('.edit').hidden = true;
    box.querySelector('.shown').hidden = false;
  }));

  // Either row's Save writes both fields — they are one record, and a driver
  // correcting the pickup address should not silently drop an edit to delivery.
  drawer.querySelectorAll('[data-saveaddr]').forEach(b => b.addEventListener('click', async () => {
    const state = b.parentElement.querySelector('[data-savedmsg]');
    b.disabled = true; state.textContent = 'Saving…';
    try {
      const parts = {};
      drawer.querySelectorAll('[data-part]').forEach(i => { parts[i.dataset.part] = i.value; });
      await patch(parts);
      openRental(id);
      return;
    } catch (err) { state.textContent = ''; msg.replaceChildren(banner(err.message)); }
    b.disabled = false;
  }));

  drawer.querySelectorAll('[data-status]').forEach(b => b.addEventListener('click', async () => {
    let reason;
    if (b.dataset.status === 'cancelled') {
      reason = prompt(r.paid_at
        ? 'This rental has been paid. Cancelling here does NOT refund anything — issue that in Square.\n\nWhy is it being cancelled?'
        : 'Why is this being cancelled?');
      if (reason === null || !reason.trim()) return;
    }
    try { await patch({ status: b.dataset.status, reason }); openRental(id); }
    catch (err) { msg.replaceChildren(banner(err.message)); }
  }));
}

/* ---------- employees ---------- */
async function viewEmployees() {
  const view = $(`<div>
    <div class="head"><h1>Employees</h1></div>
    <p class="sub">Who can sign in to this panel.</p>
    <div id="emsg"></div>
    <div id="emform"></div>
    <div class="card" id="emlist"><div class="empty">Loading…</div></div>

    <div class="head" style="margin-top:34px"><h1 style="font-size:22px">Recent activity</h1></div>
    <p class="sub">Everything anyone has done, newest first.</p>
    <div class="card" id="activity"><div class="empty">Loading…</div></div>
  </div>`);
  render('employees', view);

  const msg = view.querySelector('#emsg');
  const reload = async () => {
    try {
      const { employees, domain } = await api('/employees');
      view.querySelector('#emform').replaceChildren(
        $(`<div class="banner info">Anyone with an <strong>@${esc(domain)}</strong> mailbox can sign in and is added here automatically. Add addresses below to let in anyone else.</div>`),
      );
      if (me.role === 'owner') {
        const form = $(`<form class="formrow">
          <div class="f"><label class="fl" for="nemail">Email</label><input id="nemail" type="email" required placeholder="person@example.com"></div>
          <div class="f"><label class="fl" for="nname">Name</label><input id="nname" placeholder="Optional"></div>
          <div class="f" style="max-width:130px"><label class="fl" for="nrole">Role</label>
            <select id="nrole"><option value="staff">Staff</option><option value="owner">Owner</option></select></div>
          <button class="btn primary" type="submit">Add</button>
        </form>`);
        form.addEventListener('submit', async e => {
          e.preventDefault();
          msg.replaceChildren();
          const btn = form.querySelector('button');
          btn.disabled = true;
          try {
            await api('/employees', { method: 'POST', body: JSON.stringify({
              email: form.querySelector('#nemail').value,
              name: form.querySelector('#nname').value,
              role: form.querySelector('#nrole').value,
            })});
            form.reset();
            reload();
          } catch (err) { msg.replaceChildren(banner(err.message)); }
          btn.disabled = false;
        });
        view.querySelector('#emform').append(form);
      }

      const rows = employees.map(e => `<tr>
        <td><div class="who">${esc(e.name || '—')}<small>${esc(e.email)}</small></div></td>
        <td><span class="pill ${e.role}">${e.role}</span></td>
        <td>${e.active ? '<span style="color:var(--ok);font-weight:600">Active</span>' : '<span class="pill off">Revoked</span>'}</td>
        <td class="nowrap hide-sm" style="color:var(--muted)">${e.last_seen_at ? esc(ago(e.last_seen_at)) : 'never'}</td>
        <td class="nowrap" style="text-align:right">${
          me.role === 'owner' && e.email !== me.email
            ? `<button class="btn sm ${e.active ? 'danger' : ''}" data-id="${e.id}" data-active="${e.active ? 0 : 1}">${e.active ? 'Revoke' : 'Restore'}</button>`
            : '<span style="color:var(--muted);font-size:12px">—</span>'}</td>
      </tr>`).join('');

      const table = $(`<table><thead><tr>
        <th>Person</th><th>Role</th><th>Access</th><th class="hide-sm">Last seen</th><th></th>
      </tr></thead><tbody>${rows}</tbody></table>`);
      loadActivity(view.querySelector('#activity'));

      table.querySelectorAll('button[data-id]').forEach(b => b.addEventListener('click', async () => {
        msg.replaceChildren();
        b.disabled = true;
        try {
          await api(`/employees/${b.dataset.id}`, { method: 'PATCH', body: JSON.stringify({ active: b.dataset.active === '1' }) });
          reload();
        } catch (err) { msg.replaceChildren(banner(err.message)); b.disabled = false; }
      }));
      view.querySelector('#emlist').replaceChildren(table);
    } catch (err) {
      view.querySelector('#emlist').replaceChildren($(`<div class="empty"><strong>Could not load</strong>${esc(err.message)}</div>`));
    }
  };
  reload();
}

/* The same log the per-item history reads, unfiltered — "who is doing what"
   across the business rather than within one rental. */
async function loadActivity(container) {
