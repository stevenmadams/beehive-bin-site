/* Text / Call / Email, with whichever they asked for highlighted. The same
   three buttons belong on the rental drawer and on the run sheet: a phone
   number you have to retype at the kerb is a phone number you do not call. */
function contactActions(r) {
  const digits = String(r.phone || '').replace(/\D/g, '');
  const tel = digits.length === 10 ? `+1${digits}`
    : digits.length === 11 && digits[0] === '1' ? `+${digits}` : digits;
  const btn = (kind, href, label) =>
    `<a class="btn sm${r.contact_pref === kind ? ' primary' : ''}" href="${href}">${label}</a>`;
  return [
    digits ? btn('text', `sms:${tel}`, 'Text') : '',
    digits ? btn('call', `tel:${tel}`, 'Call') : '',
    r.email ? btn('email', `mailto:${esc(r.email)}`, 'Email') : '',
  ].filter(Boolean).join('');
}

/* ---------- schedule ----------

   The question this tab answers is "what am I doing tonight" — in the order it
   gets done, with the address and the phone number in reach, and how many bins
   the van needs to hold. Everything else is a week view of the same thing. */

const schedState = { days: 1, from: null };
const SCHED_RANGES = [[1, 'Tonight'], [7, 'This week'], [30, 'Next 30 days']];

function mapsHref(j) {
  const line = [j.address, j.city && `${j.city}, UT`, j.zip].filter(Boolean).join(', ');
  return `https://maps.google.com/?q=${encodeURIComponent(line)}`;
}

async function viewSchedule() {
  const from = schedState.from || todayISO();
  const view = $(`<div>
    <div class="head"><h1>Schedule</h1><span class="count" id="scount"></span>
      <button class="btn newreq" id="s-print">Print run sheet</button></div>
    <p class="sub">Collections first, then deliveries &mdash; bins coming back can go straight out again.</p>
    <div class="toolbar">
      <div class="seg">${SCHED_RANGES.map(([d, label]) =>
        `<button data-d="${d}" aria-pressed="${d === schedState.days}">${label}</button>`).join('')}</div>
      <input type="date" id="s-from" value="${from}" style="width:auto">
      ${from !== todayISO() ? '<button class="btn sm" id="s-today">Today</button>' : ''}
      <a class="btn sm" href="#/schedule/calendar" style="margin-left:auto">Calendar</a>
    </div>
    <div id="slist"><div class="empty">Loading&hellip;</div></div>
  </div>`);
  render('schedule', view);

  view.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    schedState.days = +b.dataset.d;
    viewSchedule();
  }));
  view.querySelector('#s-from').addEventListener('change', e => {
    schedState.from = e.target.value || null;
    viewSchedule();
  });
  view.querySelector('#s-today')?.addEventListener('click', () => {
    schedState.from = null;
    viewSchedule();
  });
  view.querySelector('#s-print').addEventListener('click', () => window.print());

  const list = view.querySelector('#slist');
  try {
    // The jobs and the bin load for the same window, so each day can say what
    // it is doing and what that leaves on the shelf.
    const [sched, inv] = await Promise.all([
      api(`/schedule?from=${from}&days=${schedState.days}`),
      api(`/inventory?from=${from}&days=${schedState.days}`).catch(() => null),
    ]);
    const avail = Object.fromEntries((inv?.days || []).map(d => [d.date, d]));
    const total = sched.days.reduce((n, d) => n + d.jobs.length, 0);
    view.querySelector('#scount').textContent = total || '';

    if (!total) {
      list.replaceChildren($(`<div class="card"><div class="empty"><strong>Nothing booked</strong>${
        schedState.days === 1 ? 'No deliveries or collections today.' : 'No jobs in this window.'
      }</div></div>`));
      return;
    }

    const frag = document.createDocumentFragment();
    for (const day of sched.days) {
      // A week view full of empty days is noise; a quiet evening you asked
      // about specifically is an answer.
      if (!day.jobs.length && schedState.days > 1) continue;

      const a = avail[day.date];
      const load = [
        day.binsBack ? `<b>${day.binsBack}</b> back` : '',
        day.binsOut ? `<b>${day.binsOut}</b> out` : '',
        // More promised than owned is worth shouting about on the day, not on
        // a report someone reads afterwards.
        a ? (a.committed > a.fleet
          ? `<b class="over">${a.committed}</b> of ${a.fleet} in use — ${a.committed - a.fleet} short`
          : `<b>${a.committed}</b> of ${a.fleet} in use`) : '',
      ].filter(Boolean).join(' &middot; ');

      const who = day.staff?.length
        ? `<span class="who">${day.staff.map(x => `${esc(x.name.split('@')[0])} ${esc(tlabel(x.start))}–${esc(tlabel(x.end))}`).join(' · ')}</span>`
        : day.open === false && !day.blackout ? '<span class="sun">Nobody on</span>' : '';
      const el = $(`<section class="day">
        <h3>${day.date === todayISO() ? 'Tonight' : esc(niceDate(day.date))}
          ${day.closedDay ? `<span class="sun">${esc(day.closedDay)} — closed</span>` : ''}${day.blackout ? `<span class="sun">Closed — ${esc(day.blackout)}</span>` : ''}
          ${who}<span class="load">${load}</span></h3>
        <div class="jobs"></div>
      </section>`);

      const jobs = el.querySelector('.jobs');
      if (!day.jobs.length) {
        jobs.replaceChildren($('<div class="none">Nothing on.</div>'));
      }
      for (const j of day.jobs) {
        const missing = j.job === 'deliver' ? [
          j.agreement_signed_at ? '' : 'not signed',
          j.paid_at ? '' : 'not paid',
        ].filter(Boolean) : [];
        const addr = [esc(j.address), j.unit ? esc(j.unit) : ''].filter(Boolean).join(', ');

        const card = $(`<article class="job${j.done_at ? ' done' : ''}" data-id="${j.id}">
          <span class="tag ${j.job}">${j.job === 'deliver' ? 'Drop off' : 'Pick up'}${
            j.window ? `<b>${esc(j.window)}</b>` : ''}</span>
          <div class="body">
            <div class="who">${esc(fullName(j))} <span style="font-weight:400;color:var(--muted)">&middot; ${j.bins} bins</span></div>
            <div class="addr">${addr
              ? `<a href="${esc(mapsHref(j))}" target="_blank" rel="noopener">${addr}${
                  j.city ? `, ${esc(j.city)}` : ''}${j.zip ? ` ${esc(j.zip)}` : ''}</a>`
              : `<span style="color:var(--warn)">No address yet${j.city ? ` &mdash; ${esc(j.city)}` : ''}</span>`}</div>
            ${j.notes ? `<div class="cust">${esc(j.notes)}</div>` : ''}
            ${missing.length ? `<div class="warn">Not ready to go out &mdash; ${missing.join(' and ')}.</div>` : ''}
            <div class="meta">Rental #${j.id}${
              j.done_at ? ` &middot; ${j.job === 'deliver' ? 'delivered' : 'collected'} ${esc(stamp(j.done_at))}${
                j.done_by ? ` by ${esc(j.done_by)}` : ''}` : ''}</div>
          </div>
          <div class="acts">${contactActions(j)}
            <button class="btn sm open">Open</button></div>
        </article>`);
        card.querySelector('.open').addEventListener('click', () => {
          location.hash = `#/rentals/${j.id}`;
        });
        jobs.append(card);
      }
      frag.append(el);
    }
    list.replaceChildren(frag);
  } catch (err) {
    list.replaceChildren($(`<div class="card"><div class="empty"><strong>Could not load the schedule</strong>${esc(err.message)}</div></div>`));
  }
}

/* ---------- inventory ----------

   A list of things you own: bins, dollies, hand trucks, whatever goes out on a
   job. Condition lives on the item, not in someone's head. Bins are the one
   kind the booking maths cares about — the fleet is however many of them are
   good — and the one kind the agreement prices. */

const invState = { condition: 'all', kind: 'all' };
const CONDITIONS = [['all', 'All'], ['good', 'In service'], ['damaged', 'Damaged'],
  ['retired', 'Retired'], ['lost', 'Lost']];
// Suggested kinds. Anything typed becomes a kind; these just save the typing.
const KIND_SUGGEST = ['bin', 'dolly', 'hand_truck', 'moving_blanket', 'strap'];
const KIND_PREFIX = { bin: 'B', dolly: 'D', hand_truck: 'HT', moving_blanket: 'MB', strap: 'S' };
const kindLabel = k => k === 'bin' ? 'Bin' : k.replace(/_/g, ' ').replace(/^\w/, c => c.toUpperCase());
const kindPlural = (k, n) => {
  const l = kindLabel(k);
  if (n === 1) return l;
  if (/[^aeiou]y$/i.test(l)) return l.slice(0, -1) + 'ies';   // dolly → dollies
  if (/(s|x|ch|sh)$/i.test(l)) return l + 'es';
  return l + 's';
};

async function viewInventory() {
  const view = $(`<div>
    <div class="head"><h1>Inventory</h1><span class="count" id="icount"></span>
      ${me.role === 'owner' ? '<button class="btn primary newreq" id="i-add">+ Add items</button>' : ''}</div>
    <p class="sub">Everything you own, one row each. Bins in service are what can be booked.</p>
    <div id="itiles"></div>
    <div class="toolbar" id="ikinds"></div>
    <div class="toolbar">
      <div class="seg">${CONDITIONS.map(([c, label]) =>
        `<button data-c="${c}" aria-pressed="${c === invState.condition}">${label}</button>`).join('')}</div>
    </div>
    <div class="card" id="ilist"><div class="empty">Loading&hellip;</div></div>
  </div>`);
  render('inventory', view);

  view.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    invState.condition = b.dataset.c;
    viewInventory();
  }));
  let knownKinds = [];
  view.querySelector('#i-add')?.addEventListener('click', () => openAddItems(knownKinds));

  const list = view.querySelector('#ilist');
  try {
    const [{ items, kinds }, inv] = await Promise.all([
      api(`/items?condition=${invState.condition}&kind=${invState.kind}`),
      api(`/inventory?from=${todayISO()}&days=14`).catch(() => null),
    ]);
    view.querySelector('#icount').textContent = items.length || '';

    // One tab per kind that exists, bins first. A kind with nothing in it has
    // no tab: the list is what you own, not what you might own.
    const kindNames = Object.keys(kinds).sort((a, b) => (a === 'bin' ? -1 : b === 'bin' ? 1 : a.localeCompare(b)));
    knownKinds = kindNames;
    if (kindNames.length > 1) {
      const seg = $(`<div class="seg">
        <button data-k="all" aria-pressed="${invState.kind === 'all'}">Everything</button>
        ${kindNames.map(k => `<button data-k="${esc(k)}" aria-pressed="${invState.kind === k}">${
          esc(kindPlural(k, kinds[k].total))} <span class="n">${kinds[k].total}</span></button>`).join('')}
      </div>`);
      seg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        invState.kind = b.dataset.k;
        viewInventory();
      }));
      view.querySelector('#ikinds').replaceChildren(seg);
    } else {
      view.querySelector('#ikinds').remove();
    }

    const bins = kinds.bin || { total: 0 };
    const owned = Object.values(kinds).reduce((a, k) => a + k.total, 0);
    const today = inv?.days?.[0];
    const otherBroken = kindNames.filter(k => k !== 'bin')
      .reduce((n, k) => n + (kinds[k].damaged || 0) + (kinds[k].lost || 0), 0);
    view.querySelector('#itiles').replaceChildren($(`<div class="tiles">
      <div class="tile"><div class="n">${bins.good || 0}</div><div class="l">Bins in service</div></div>
      ${inv ? `<div class="tile"><div class="n">${today?.committed ?? 0}</div><div class="l">Bins out today</div></div>
      <div class="tile${today?.available < 0 ? ' bad' : ''}"><div class="n">${today?.available ?? 0}</div>
        <div class="l">${today?.available < 0 ? 'Bins short today' : 'Bins free today'}</div></div>` : ''}
      ${inv?.outOfService ? `<div class="tile bad"><div class="n">${inv.outOfService}</div><div class="l">Bins out of service</div></div>` : ''}
      ${owned - bins.total > 0 ? `<div class="tile"><div class="n">${owned - bins.total}</div>
        <div class="l">Other equipment${otherBroken ? ` · <span style="color:var(--bad)">${otherBroken} out</span>` : ''}</div></div>` : ''}
    </div>`));

    if (inv?.days?.length && bins.total) {
      // Which day is the tight one, without having to guess a date and check.
      const cal = inv.days.map(d => {
        const cls = d.available < 0 ? 'over' : d.available <= d.fleet * 0.15 ? 'tight' : '';
        const dt = new Date(`${d.date}T12:00:00`);
        return `<div class="d ${cls}" title="${esc(niceDate(d.date))} — ${d.committed} of ${d.fleet} committed">
          <div class="dd">${dt.toLocaleDateString('en-US', { weekday: 'narrow' })} ${dt.getDate()}</div>
          <div class="av">${d.available}</div></div>`;
      }).join('');
      view.querySelector('#itiles').append($(`<div>
        <label class="fl">Bins free to book &mdash; next 14 days</label>
        <div class="cal">${cal}</div>
        <p class="sub" style="margin-bottom:22px">Counts allow ${inv.turnaroundDays === 1
          ? 'a day' : `${inv.turnaroundDays} days`} to clean and restack after a return.</p>
      </div>`));
    }

    if (!items.length) {
      list.replaceChildren($(`<div class="empty"><strong>${
        owned ? 'Nothing matches' : 'Nothing on the list yet'}</strong>${
        owned ? 'Try another filter.'
              : 'Add your bins and the booking guard starts working. Dollies and hand trucks can go on the same list.'}</div>`));
      return;
    }

    const showKind = invState.kind === 'all' && kindNames.length > 1;
    const rows = items.map(b => `<tr class="clickable binrow" data-id="${b.id}">
      <td><strong>${esc(b.label)}</strong>${showKind ? `<small style="display:block;color:var(--muted)">${esc(kindLabel(b.kind))}</small>` : ''}</td>
      <td><span class="cond ${esc(b.condition)}">${esc(b.condition)}</span></td>
      <td style="color:var(--muted)">${esc(b.notes || '')}${
        b.flagged_rental_id ? ` <a href="#/rentals/${b.flagged_rental_id}">rental #${b.flagged_rental_id}</a>` : ''}</td>
      <td class="nowrap num hide-sm">${b.acquired_on ? esc(niceDate(b.acquired_on)) : '—'}</td>
      <td class="nowrap num hide-sm">${b.cost_cents == null ? '—' : esc(money(b.cost_cents))}</td>
      <td class="nowrap hide-sm" style="color:var(--muted)">${b.updated_at ? esc(ago(b.updated_at)) : ''}</td>
    </tr>`).join('');

    const table = $(`<table><thead><tr>
      <th>Item</th><th>Condition</th><th>Notes</th>
      <th class="hide-sm">Acquired</th><th class="hide-sm">Cost</th><th class="hide-sm">Updated</th>
    </tr></thead><tbody>${rows}</tbody></table>`);
    table.querySelectorAll('tbody tr').forEach(tr => tr.addEventListener('click', e => {
      if (e.target.closest('a')) return;
      openItem(items.find(b => b.id === +tr.dataset.id));
    }));
    list.replaceChildren(table);
  } catch (err) {
    list.replaceChildren($(`<div class="empty"><strong>Could not load inventory</strong>${esc(err.message)}</div>`));
  }
}

function openItem(item) {
  closeAnyDrawer();
  const scrim = $('<div class="scrim"></div>');
  const drawer = $('<div class="drawer" role="dialog" aria-modal="true"></div>');
  const close = () => { scrim.remove(); drawer.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  scrim.addEventListener('click', close);
  document.addEventListener('keydown', onKey);
  const isBin = item.kind === 'bin';

  drawer.append($(`
    <div class="dhead">
      <div style="flex:1"><h2>${esc(item.label)}</h2>
        <div class="meta">${esc(kindLabel(item.kind))} #${item.id}${item.acquired_on ? ` · acquired ${esc(niceDate(item.acquired_on))}` : ''}${
          item.cost_cents != null ? ` · ${esc(money(item.cost_cents))}` : ''}</div></div>
      <span class="cond ${esc(item.condition)}" style="margin-top:5px">${esc(item.condition)}</span>
      <button class="x" aria-label="Close">×</button>
    </div>`), $(`
    <div class="dbody">
      <div class="frow one">
        <div><label class="fl" for="b-cond">Condition</label>
          <select id="b-cond">
            <option value="good">In service</option>
            <option value="damaged">Damaged — needs repair</option>
            <option value="retired">Retired — no longer used</option>
            <option value="lost">Lost or not returned</option>
          </select></div>
      </div>
      <p class="sub">${isBin
        ? 'Anything other than in service comes out of the bookable fleet straight away.'
        : 'Equipment is tracked but not booked — the agreement only prices bins, so damage here is charged by hand if at all.'}</p>
      <label class="fl" for="b-notes">Notes</label>
      <textarea id="b-notes" placeholder="${isBin ? 'Cracked lid, tape residue…' : 'Bent frame, flat tyre…'}">${esc(item.notes || '')}</textarea>
      <div style="height:12px"></div>
      <div class="frow one">
        <div><label class="fl" for="b-rental">Blame a rental (optional)</label>
          <input id="b-rental" type="number" min="1" placeholder="Rental number it came back broken from"
            value="${item.flagged_rental_id || ''}"></div>
      </div>
      <div id="b-msg" style="margin-top:14px"></div>
      <div class="actions" style="margin-top:16px;border-top:1px solid var(--line);padding-top:18px">
        <button class="btn primary" id="b-save">Save</button>
        <button class="btn" id="b-cancel">Cancel</button>
        ${me.role === 'owner' ? '<button class="btn danger" id="b-del" style="margin-left:auto">Remove from list</button>' : ''}
      </div>
    </div>`));

  document.body.append(scrim, drawer);
  const q = id => drawer.querySelector('#' + id);
  q('b-cond').value = item.condition;
  drawer.querySelector('.x').addEventListener('click', close);
  q('b-cancel').addEventListener('click', close);

  q('b-save').addEventListener('click', async () => {
    q('b-save').disabled = true;
    try {
      await api(`/items/${item.id}`, { method: 'PATCH', body: JSON.stringify({
        condition: q('b-cond').value,
        notes: q('b-notes').value,
        rental_id: q('b-rental').value || null,
      })});
      close();
      viewInventory();
    } catch (err) {
      q('b-msg').replaceChildren(banner(err.message));
      q('b-save').disabled = false;
    }
  });

  q('b-del')?.addEventListener('click', async () => {
    // Sold or scrapped is a removal; broken is a condition. Deleting loses the
    // history, so it asks.
    if (!confirm(`Remove ${item.label} from the list? Mark it retired instead if you still own it.`)) return;
    try {
      await api(`/items/${item.id}`, { method: 'DELETE' });
      close();
      viewInventory();
    } catch (err) { q('b-msg').replaceChildren(banner(err.message)); }
  });
}

function openAddItems(existingKinds = []) {
  closeAnyDrawer();
  // The suggested kinds, plus anything already on the list that is not one of
  // them — a kind typed once should be a pick from then on.
  const kinds = [...new Set([...KIND_SUGGEST, ...existingKinds])];
  const scrim = $('<div class="scrim"></div>');
  const drawer = $('<div class="drawer" role="dialog" aria-modal="true"></div>');
  const close = () => { scrim.remove(); drawer.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  scrim.addEventListener('click', close);
  document.addEventListener('keydown', onKey);

  drawer.append($(`
    <div class="dhead">
      <div style="flex:1"><h2>Add items</h2>
        <div class="meta">Numbered in a run, continuing where the last batch stopped</div></div>
      <button class="x" aria-label="Close">×</button>
    </div>`), $(`
    <div class="dbody">
      <div class="frow">
        <div><label class="fl" for="a-kind">What</label>
          <select id="a-kind">${kinds.map(k => `<option value="${esc(k)}">${esc(kindLabel(k))}</option>`).join('')}
            <option value="">Something else…</option></select></div>
        <div><label class="fl" for="a-count">How many</label>
          <input id="a-count" type="number" min="1" max="500" value="20"></div>
      </div>
      <div class="frow one" id="a-otherwrap" hidden>
        <div><label class="fl" for="a-other">What are they?</label>
          <input id="a-other" placeholder="e.g. furniture pads"></div>
      </div>
      <div class="frow">
        <div><label class="fl" for="a-prefix">Label prefix</label>
          <input id="a-prefix" value="B" maxlength="12"></div>
        <div><label class="fl" for="a-cost">Cost each</label>
          <input id="a-cost" placeholder="Optional — e.g. 24.50"></div>
      </div>
      <div class="quote"><span>Labels <small id="a-note"></small></span><strong id="a-preview">—</strong></div>
      <div class="frow one">
        <div><label class="fl" for="a-acq">Acquired</label>
          <input id="a-acq" type="date" value="${todayISO()}"></div>
      </div>
      <p class="sub">Type any kind of thing. Only bins count towards what can be booked.</p>
      <div id="a-msg" style="margin-top:14px"></div>
      <div class="actions" style="margin-top:16px;border-top:1px solid var(--line);padding-top:18px">
        <button class="btn primary" id="a-save">Add them</button>
        <button class="btn" id="a-cancel">Cancel</button>
      </div>
    </div>`));

  document.body.append(scrim, drawer);
  const q = id => drawer.querySelector('#' + id);
  const rawKind = () => q('a-kind').value || q('a-other').value;
  const norm = () => rawKind().trim().toLowerCase().replace(/[\s-]+/g, '_').replace(/[^a-z_]/g, '');
  q('a-kind').addEventListener('change', () => {
    const other = q('a-kind').value === '';
    q('a-otherwrap').hidden = !other;
    if (other) q('a-other').focus();
  });
  let prefixTouched = false;
  const preview = () => {
    const n = Math.max(1, Math.min(500, +q('a-count').value || 1));
    const k = norm() || 'bin';
    // The prefix follows the kind until someone types their own.
    if (!prefixTouched) q('a-prefix').value = KIND_PREFIX[k] || k.slice(0, 2).toUpperCase();
    const p = (q('a-prefix').value || 'B').toUpperCase();
    q('a-preview').textContent = n === 1 ? `${p}-001` : `${p}-001 … ${p}-${String(n).padStart(3, '0')}`;
    q('a-note').textContent = '· numbering continues past any that already exist';
  };
  q('a-prefix').addEventListener('input', () => { prefixTouched = true; preview(); });
  ['a-count', 'a-kind', 'a-other'].forEach(id => q(id).addEventListener('input', preview));
  preview();

  drawer.querySelector('.x').addEventListener('click', close);
  q('a-cancel').addEventListener('click', close);

  q('a-save').addEventListener('click', async () => {
    if (!norm()) { q('a-msg').replaceChildren(banner('Say what kind of thing these are.')); return; }
    q('a-save').disabled = true;
    try {
      await api('/items', { method: 'POST', body: JSON.stringify({
        kind: norm(), count: q('a-count').value, prefix: q('a-prefix').value,
        acquired_on: q('a-acq').value, cost_each: q('a-cost').value,
      })});
      close();
      viewInventory();
    } catch (err) {
      q('a-msg').replaceChildren(banner(err.message));
      q('a-save').disabled = false;
    }
  });
}

/* ---------- settings ----------

   A page of facts — "we go out Monday to Saturday, 6–8pm, with a day's
   notice" — that an owner occasionally changes. Read first; the fields only
   appear behind Edit, so the page is something to glance at rather than a
   form waiting to be filled in. */

const WDL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const listOf = (arr, none = 'none') => arr.length === 0 ? none
  : arr.length === 1 ? arr[0] : `${arr.slice(0, -1).join(', ')} and ${arr.at(-1)}`;

async function viewSettings() {
  const owner = me.role === 'owner';
  const view = $(`<div>
    <div class="head"><h1>Settings</h1></div>
    <p class="sub">${owner ? 'What the website and the panel go by. Changes take effect immediately.' : 'What the website and the panel go by. Only an owner can change these.'}</p>
    <div class="card facts" id="sform"><div class="empty">Loading…</div></div>
    <div class="head" style="margin-top:34px"><h1 style="font-size:22px">Days off</h1>
      ${owner ? '<button class="btn sm newreq" id="b-open">+ Add a day off</button>' : ''}</div>
    <p class="sub">One-off days nothing starts on. Holidays and weekly days off are above.</p>
    <div class="card" id="sblack"><div class="empty">Loading…</div></div>
  </div>`);
  render('settings', view);

  const form = view.querySelector('#sform');
  const black = view.querySelector('#sblack');
  let st, hols = [];

  /* Read mode: the facts. */
  const showFacts = () => {
    const holNames = hols.filter(h => (st.closedHolidays || []).includes(h.key)).map(h => h.name);
    const closed = (st.closedWeekdays || []).map(d => WDL[d] + 's');
    form.replaceChildren($(`<div>
      ${owner ? '<button class="btn sm" id="s-edit" style="float:right">Edit</button>' : ''}
      <dl class="factlist">
        <dt>Usual window</dt><dd><b>${esc(st.defaultWindow)}</b> <span>stamped on each new rental; changeable per rental</span></dd>
        <dt>Days off each week</dt><dd><b>${esc(listOf(closed, 'None'))}</b> <span>nothing starts on these, online or by phone</span></dd>
        <dt>Holidays</dt><dd><b>${esc(listOf(holNames, 'None'))}</b> <span>closed every year, worked out automatically</span></dd>
        <dt>Notice online</dt><dd><b>${st.leadDays === 0 ? 'Same day' : st.leadDays === 1 ? '1 day' : `${st.leadDays} days`}</b> <span>the earliest a website booking can start; phone bookings can go inside it</span></dd>
        <dt>Room per hour</dt><dd><b>${st.jobsPerSlot} job${st.jobsPerSlot === 1 ? '' : 's'} per driver</b> <span>how many stops one person makes in an hour</span></dd>
        <dt>Turnaround</dt><dd><b>${st.turnaroundDays === 0 ? 'Same night' : st.turnaroundDays === 1 ? '1 day' : `${st.turnaroundDays} days`}</b> <span>bins held after a return, to clean and restack</span></dd>
        <dt>Bookable fleet</dt><dd><b>${st.fleetTotal} bins</b> <span>in service on the Inventory tab${st.outOfService ? `; ${st.outOfService} out of service` : ''}</span></dd>
      </dl>
    </div>`));
    form.querySelector('#s-edit')?.addEventListener('click', showForm);
  };

  /* Edit mode: the same facts as fields, with Save and Cancel. */
  const showForm = () => {
    const closedSet = new Set(st.closedHolidays || []);
    form.replaceChildren($(`<div>
      <div class="frow">
        <div><label class="fl" for="s-window">Usual delivery window</label>
          <input id="s-window" value="${esc(st.defaultWindow)}" maxlength="40"></div>
        <div><label class="fl" for="s-lead">Notice the website needs (days)</label>
          <input id="s-lead" type="number" min="0" max="30" value="${st.leadDays}"></div>

            `<label><input type="checkbox" data-closed="${i}"${(st.closedWeekdays || []).includes(i) ? ' checked' : ''}> ${d}</label>`).join('')}</div>
          <p class="sub" style="margin:6px 0 0">The rental agreement says Sundays — if you change this, change the agreement too.</p></div>
      </div>
      <div class="frow one">
        <div><label class="fl">Holidays we close on</label>
          <div class="holrow">${hols.map(h =>
            `<label><input type="checkbox" data-hol="${esc(h.key)}"${closedSet.has(h.key) ? ' checked' : ''}> ${esc(h.name)} <small>${esc(niceDate(h.date).replace(/^\w+, /, ''))}</small></label>`).join('')}</div>
          <p class="sub" style="margin:6px 0 0">The actual day, not the observed Monday.</p></div>
      </div>
      <div class="frow">
        <div><label class="fl" for="s-jobs">Jobs per driver per hour</label>
          <input id="s-jobs" type="number" min="1" max="10" value="${st.jobsPerSlot ?? 2}"></div>
        <div><label class="fl" for="s-turn">Turnaround after a return (days)</label>
          <input id="s-turn" type="number" min="0" max="14" value="${st.turnaroundDays}"></div>

        <button class="btn primary" id="s-save">Save</button>
        <button class="btn" id="s-cancel">Cancel</button>
        <span id="s-msg" style="font-size:13px;color:var(--bad)"></span>
      </div>
    </div>`));
    form.querySelector('#s-cancel').addEventListener('click', showFacts);
    form.querySelector('#s-save').addEventListener('click', async () => {
      try {

          defaultWindow: form.querySelector('#s-window').value,
          leadDays: form.querySelector('#s-lead').value,

  const drawBlackouts = async (adding = false) => {
    let bl;
    try { bl = await api('/blackouts'); } catch (err) { black.replaceChildren(banner(err.message)); return; }
    const rows = bl.blackouts.map(b => `<tr>
      <td class="nowrap"><strong>${esc(niceDate(b.date))}</strong> <span style="color:var(--muted)">${esc(b.date)}</span></td>
      <td>${esc(b.reason || '')}</td>
      <td class="hide-sm" style="color:var(--muted)">${esc(b.created_by)}</td>
      <td style="text-align:right">${owner ? `<button class="linkish" data-unblack="${b.date}">Remove</button>` : ''}</td>
    </tr>`).join('');
    black.replaceChildren($(`<div>
      ${adding ? `<div style="display:flex;gap:8px;align-items:flex-end;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap">

        <div style="flex:1;min-width:160px"><label class="fl" for="b-why">Why (optional)</label><input id="b-why" placeholder="Away, van in the shop" maxlength="80"></div>
        <button class="btn primary" id="b-add">Add</button><button class="btn" id="b-cancel">Cancel</button>
      </div>` : ''}
      ${rows ? `<table><thead><tr><th>Day</th><th>Why</th><th class="hide-sm">Added by</th><th></th></tr></thead><tbody>${rows}</tbody></table>`

    black.querySelector('#b-cancel')?.addEventListener('click', () => drawBlackouts(false));
    black.querySelector('#b-add')?.addEventListener('click', async () => {

          alert(`Added ${res.days === 1 ? 'the day' : res.days + ' days'}. Already booked in that time:\n\n${res.affected.map(a => `• ${a.name} — ${a.job === 'deliver' ? 'delivery' : 'pickup'} ${niceDate(a.date)} (rental #${a.id})`).join('\n')}\n\nMove or contact them.`);
        }
        drawBlackouts(false);
      } catch (err) { black.querySelector('#b-msg').replaceChildren(banner(err.message)); }
    });
    black.querySelectorAll('[data-unblack]').forEach(b => b.addEventListener('click', async () => {
      try { await api(`/blackouts/${b.dataset.unblack}`, { method: 'DELETE' }); drawBlackouts(false); }
      catch (err) { black.querySelector('#b-msg').replaceChildren(banner(err.message)); }
    }));
  };
  view.querySelector('#b-open')?.addEventListener('click', () => drawBlackouts(true));

  try {
    [st, { holidays: hols }] = await Promise.all([api('/settings'), api(`/holidays?year=${todayISO().slice(0, 4)}`)]);
  } catch (err) { form.replaceChildren(banner(err.message)); return; }
  showFacts();
  drawBlackouts(false);
}

/* ---------- boot + routing ---------- */
/* ---------- staying current ----------

   Requests arrive from the website while the panel is open, so a number that
   was fetched at boot is wrong within minutes. Badges are patched in place
   rather than re-rendered, because a full redraw while someone is mid-search or
   mid-typing is worse than a stale number. */

function updateBadges() {
  const setBadge = (href, value, cls = '', title = '') => {
    const link = document.querySelector(`nav a[href="${href}"]`);
    if (!link) return;
    let el = link.querySelector('.badge');
    if (!value) { el?.remove(); return; }
    if (!el) {
      el = document.createElement('span');
      link.append(el);
    }
    el.className = `badge ${cls}`.trim();
    el.textContent = value;
    if (title) el.title = title;
  };

  setBadge('#/requests', counts.new || 0, '', 'new requests');

  /* Rentals always shows a number, because "how many jobs are live" is worth
     knowing at a glance — but it escalates rather than averaging: something
     overdue outranks something stalled, which outranks a plain count of what is
     on. The colour carries which it is. */
  if (rentalCounts.overdue) {
    setBadge('#/rentals', rentalCounts.overdue, 'overdue', 'overdue — past the return date and still out');
  } else if (rentalCounts.stalled) {
    setBadge('#/rentals', rentalCounts.stalled, 'warn', 'stalled — never confirmed and the start date has passed');
  } else {
    setBadge('#/rentals', rentalCounts.active || 0, 'quiet', 'active rentals');
  }
}

let pollTimer = null;

/* Only redraw when something actually changed, and never over a drawer or an
   in-progress search — the cost of interrupting real work is higher than the
   cost of a list being a few seconds behind. */
async function poll() {
  if (document.visibilityState !== 'visible') return;
  const before = JSON.stringify([counts, rentalCounts]);
  await refreshCounts();
  updateBadges();
  if (JSON.stringify([counts, rentalCounts]) === before) return;

  if (document.querySelector('.drawer')) return;
  const search = document.querySelector('.search');
  if (search && search.value.trim()) return;
  route();
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(poll, 30000);
  // Coming back to the tab is exactly when someone expects to see what changed.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') poll();
  });
}


async function refreshCounts() {
  try {
    const stats = await api('/stats');
    counts = stats.counts || {};
    rentalCounts = stats.rentals || {};
  } catch { counts = {}; rentalCounts = {}; }
}

function route() {
  const hash = location.hash.replace(/^#\/?/, '') || 'requests';
  const [tab, id] = hash.split('/');
  if (tab === 'employees') return viewEmployees();
  if (tab === 'rentals') return id ? openRental(id) : viewRentals();
  if (tab === 'requests' && id) return openRequest(id);
  if (tab === 'schedule' && id === 'calendar') return viewCalendar();
  if (tab === 'schedule' && id) { schedState.from = id; schedState.days = 1; return viewSchedule(); }
  if (tab === 'schedule') return viewSchedule();
  if (tab === 'inventory') return viewInventory();
  if (tab === 'settings') return viewSettings();
  if (tab === 'customers') return id ? viewCustomer(id) : viewCustomers();
  if (SOON[tab]) return viewSoon(tab);
  return viewRequests();
}

(async () => {
  try {
    const meRes = await api('/me');
    me = meRes.user;
    bookingHost = meRes.booking_host || 'book.beehivebin.co';
    cities = meRes.cities || [];
  } catch (err) {
    root.replaceChildren($(`<div class="gate"><div class="box">
      <h1>No access</h1>
      <p>${esc(err.message)}</p>
      <p style="margin-top:14px;font-size:13px">If you think this is wrong, ask an owner to add your address in the Employees tab.</p>
    </div></div>`));
    return;
  }
  await refreshCounts();
  window.addEventListener('hashchange', route);
  route();
  startPolling();
})();
</script>
</body>
</html>
