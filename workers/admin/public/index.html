          <div class="meta">${card ? `Charged to the card on file — ${esc(card.brand || 'card')} &bull;&bull;${esc(card.last4 || '')}, as §4 allows. Plus tax.`
            : 'No card on file — this sends an invoice they pay themselves. Plus tax.'}</div></div>
        ${owner ? `<button class="btn primary" id="c-invoice">${card ? 'Charge the card' : 'Send the invoice'}</button>` : '<span class="meta">An owner charges this.</span>'}</div>`
        : owed_cents > 0 ? `<div class="chgfoot"><div class="meta">Settled — ${esc(money(owed_cents))} charged on this rental.</div></div>` : ''}
      ${owner ? '<details class="manual"><summary>Add a charge by hand</summary><div id="c-manual"></div></details>' : ''}
      <div id="c-msg"></div>
    </div>`));
    if (owner) manualForm(container.querySelector('#c-manual'));

    const q = id => container.querySelector('#' + id);
    const fail = err => q('c-msg')?.replaceChildren(banner(err.message));
    container.querySelectorAll('[data-prop]').forEach(b => b.addEventListener('click', async () => {
      const p = props[+b.dataset.prop];
      if (p.confirm && !(await sure({ title: p.reason, body: `${esc(p.note)}<br><br><b>${esc(p.confirm)}</b>`, ok: 'Add the charge', danger: true }))) return;
      b.disabled = true;
      try {
        await api(`/rentals/${rentalId}/charges`, { method: 'POST', body: JSON.stringify({ kind: p.kind, qty: p.qty, unit_cents: p.unit_cents, taxable: !!p.taxable, reason: p.reason, bin_labels: p.bin_labels || null }) });
        draw();
      } catch (err) { fail(err); b.disabled = false; }
    }));
    container.querySelectorAll('[data-waive]').forEach(b => b.addEventListener('click', async () => {
      const v = await ask({ title: 'Waive this charge', body: 'The reason is the record of the decision.', fields: [{ name: 'reason', label: 'Why', required: true, placeholder: 'Bereavement' }], ok: 'Waive it' });
      if (!v) return;
      try { await api(`/charges/${b.dataset.waive}/waive`, { method: 'POST', body: JSON.stringify({ reason: v.reason }) }); draw(); } catch (err) { fail(err); }
    }));
    q('c-invoice')?.addEventListener('click', async () => {
      const okd = await sure({ title: card ? `Charge ${money(outstanding_cents)} plus tax to the card ending ${card.last4}?` : `Send an invoice for ${money(outstanding_cents)} plus tax?`,
        body: 'They get an email either way.', ok: card ? 'Charge it' : 'Send it' });
      if (!okd) return;
      q('c-invoice').disabled = true;
      try { await api(`/rentals/${rentalId}/charges/invoice`, { method: 'POST' }); draw(); }
      catch (err) { fail(err); q('c-invoice').disabled = false; }
    });
  };

  const manualForm = box => {
    if (!box) return;
    box.replaceChildren($(`<div>
      <div class="frow">
        <div><label class="fl" for="c-kind">Kind</label><select id="c-kind">
          <option value="late">Late return</option><option value="missing">Unreturned bins</option>
          <option value="damage">Damage</option><option value="other" selected>Other</option></select></div>
        <div><label class="fl" for="c-qty">Quantity</label><input id="c-qty" type="number" min="1" max="1000" value="1"></div>
      </div>
      <div class="frow">
        <div><label class="fl" for="c-unit">Each</label><input id="c-unit" placeholder="15.00"></div>
        <div><label class="fl" for="c-tax">Sales tax</label><select id="c-tax"><option value="1">Add tax</option><option value="0">No tax</option></select></div>
      </div>
      <label class="fl" for="c-why">What the customer sees on the invoice</label>
      <input id="c-why" placeholder="Two bins returned with tape residue">
      <div style="margin-top:12px"><button class="btn sm" id="c-add">Add charge</button></div>
    </div>`));
    box.querySelector('#c-add').addEventListener('click', async () => {
      const g = id => box.querySelector('#' + id);
      const unit = Math.round(parseFloat(String(g('c-unit').value).replace(/[^\d.]/g, '')) * 100);
      try {
        await api(`/rentals/${rentalId}/charges`, { method: 'POST', body: JSON.stringify({ kind: g('c-kind').value, qty: g('c-qty').value, unit_cents: unit, taxable: g('c-tax').value === '1', reason: g('c-why').value }) });
        draw();
      } catch (err) { container.querySelector('#c-msg')?.replaceChildren(banner(err.message)); }
    });
  };
  draw();
}

/* ---------- extensions ----------
   Extra weeks on a rental in progress, priced from the same source as the
   booking form and invoiced separately. */

function extensionsPanel(container, rentalId, r) {
  // Nothing to extend before the rental is real or after the bins are back.
  const canExtend = r.status !== 'cancelled' && !r.returned_at
    && r.agreement_signed_at && r.paid_at;

  const render = exts => {
    const rows = exts.map(e => `
      <div class="ext">
        <span class="w">${e.weeks === 1 ? '1 extra week' : `${e.weeks} extra weeks`}</span>
        <span class="meta">${esc(money(e.amount_cents))} · back ${esc(niceDate(e.new_due_date))}
          · ${esc((e.created_by || '').split('@')[0])} ${esc(ago(e.created_at))}</span>
        ${e.square_invoice_url
          ? `<a class="btn sm" href="${esc(e.square_invoice_url)}" target="_blank" rel="noopener">Invoice</a>` : ''}
        <span class="st ${e.paid_at ? 'paid' : 'due'}">${e.paid_at ? 'paid' : (e.square_status || 'unpaid')}</span>
      </div>`).join('');

    container.replaceChildren($(`<div class="exts">
      ${exts.length ? `<label class="fl">Extensions</label>${rows}` : ''}
      <div id="ext-slot"></div>
    </div>`));

    const slot = container.querySelector('#ext-slot');
    if (!canExtend || !isOwner()) {
      if (!exts.length) container.replaceChildren();
      return;
    }

    const showButton = () => {
      slot.replaceChildren($(`<button class="btn sm">${exts.length ? 'Extend again' : 'Extend this rental'}</button>`));
      slot.querySelector('button').addEventListener('click', showForm);
    };

    const showForm = () => {
      slot.replaceChildren($(`<div class="extform">
        <label class="fl">How many extra weeks?</label>
        <div class="weekpick">${[1,2,3,4,5,6].map(w =>
          `<button type="button" data-w="${w}" aria-pressed="${w === 1}">${w}</button>`).join('')}</div>
        <div class="extquote" id="ext-quote"></div>
        <label class="fl" for="ext-why">Why <span style="text-transform:none;letter-spacing:0;font-weight:400">(optional)</span></label>
        <input id="ext-why" placeholder="Closing delayed, still packing…">
        <div class="actions" style="margin-top:10px">
          <button class="btn sm primary" id="ext-go">Create extension invoice</button>
          <button class="btn sm" id="ext-cancel">Cancel</button>
        </div>
        <div id="ext-msg"></div>
      </div>`));

      let weeks = 1;
      const quote = slot.querySelector('#ext-quote');
      const sync = () => {
        const per = EXTRA[r.bins];
        const back = new Date(`${r.due_date}T12:00:00`);
        back.setDate(back.getDate() + 7 * weeks);
        quote.innerHTML = per == null
          ? `<small>No extra-week rate on file for ${r.bins} bins.</small>`
          : `$${per * weeks} <small>+ tax · back ${back.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' })}</small>`;
      };
      slot.querySelectorAll('[data-w]').forEach(b => b.addEventListener('click', () => {
        weeks = +b.dataset.w;
        slot.querySelectorAll('[data-w]').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.w === weeks)));
        sync();
      }));
      sync();

      slot.querySelector('#ext-cancel').addEventListener('click', showButton);
      slot.querySelector('#ext-go').addEventListener('click', async e => {
        e.target.disabled = true;
        e.target.textContent = 'Creating…';
        try {
          await api(`/rentals/${rentalId}/extensions`, {
            method: 'POST',
            body: JSON.stringify({ weeks, reason: slot.querySelector('#ext-why').value }),
          });
          openRental(rentalId);
        } catch (err) {
          slot.querySelector('#ext-msg').replaceChildren(banner(err.message));
          e.target.disabled = false;
          e.target.textContent = 'Create extension invoice';
        }
      });
    };
    showButton();
  };

  api(`/rentals/${rentalId}/extensions`)
    .then(({ extensions }) => render(extensions))
    .catch(() => container.replaceChildren());
}

/* ---------- internal notes ----------
   Attributed and append-only, so the input only appears when someone is
   actually writing — a permanently open box invites overwriting a colleague's
   note, which is the habit this replaces. */

function notesPanel(container, entity, id) {
  const render = notes => {
    const rows = notes.map(n => `
      <div class="n" data-pinned="${n.pinned}" data-deleted="${n.deleted_at ? 1 : 0}">
        <div class="body">${esc(n.body)}</div>
        <div class="meta">
          <span class="who">${esc(n.author)}</span>
          <span title="${esc(n.created_at)}">${esc(ago(n.created_at))}</span>
          ${n.deleted_at ? `<span>· deleted by ${esc(n.deleted_by || '—')}</span>` : `
            <button data-pin="${n.id}" data-to="${n.pinned ? 0 : 1}" class="pin">${
              n.pinned ? 'Unpin' : 'Pin'}</button>
            ${n.author === me.email || isOwner() ? `<button data-del="${n.id}">Delete</button>` : ''}`}
        </div>
      </div>`).join('');

    container.replaceChildren($(`<div>
      <label class="fl">Internal notes <span style="font-weight:400;text-transform:none;letter-spacing:0">— staff only, never shown to the customer</span></label>
      <div class="notes">
        ${rows || '<div class="empty-n">No notes yet.</div>'}
      </div>
      <div id="n-add"></div>
    </div>`));

    const addBox = container.querySelector('#n-add');
    const showButton = () => {
      addBox.replaceChildren($('<button class="btn sm">Add a note</button>'));
      addBox.querySelector('button').addEventListener('click', showForm);
    };
    const showForm = () => {
      addBox.replaceChildren($(`<div>
        <textarea id="n-body" placeholder="What happened, or what the next person needs to know."></textarea>
        <div class="actions" style="margin-top:8px">
          <button class="btn sm primary" id="n-save">Save note</button>
          <button class="btn sm" id="n-cancel">Cancel</button>
          <label style="display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)">
            <input type="checkbox" id="n-pin"> Pin it
          </label>
        </div>
        <div id="n-msg"></div>
      </div>`));
      const ta = addBox.querySelector('#n-body');
      ta.focus();
      addBox.querySelector('#n-cancel').addEventListener('click', showButton);
      addBox.querySelector('#n-save').addEventListener('click', async e => {
        const text = ta.value.trim();
        if (!text) { ta.focus(); return; }
        e.target.disabled = true;
        try {
          const { notes: fresh } = await api(`/${entity}/${id}/notes`, {
            method: 'POST',
            body: JSON.stringify({ body: text, pinned: addBox.querySelector('#n-pin').checked }),
          });
          render(fresh);
        } catch (err) {
          addBox.querySelector('#n-msg').replaceChildren(banner(err.message));
          e.target.disabled = false;
        }
      });
    };
    showButton();

    container.querySelectorAll('[data-pin]').forEach(b => b.addEventListener('click', async () => {
      try { render((await api(`/notes/${b.dataset.pin}`, { method: 'PATCH', body: JSON.stringify({ pinned: b.dataset.to === '1' }) })).notes); }
      catch (err) { container.prepend(banner(err.message)); }
    }));
    container.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
      if (!(await sure({ title: 'Delete this note?', body: 'It stays in the record, marked deleted.', ok: 'Delete', danger: true }))) return;
      try { render((await api(`/notes/${b.dataset.del}`, { method: 'PATCH', body: JSON.stringify({ deleted: true }) })).notes); }
      catch (err) { container.prepend(banner(err.message)); }
    }));
  };

  container.replaceChildren($('<div class="empty-n">Loading notes…</div>'));
  api(`/${entity}/${id}/notes`)
    .then(({ notes }) => render(notes))
    .catch(err => container.replaceChildren(banner(err.message)));
}

/* ---------- request drawer ---------- */
/* Only ever one drawer. Hash navigation (browser back/forward, or a link
   straight to another request) otherwise stacks a second one on top of the
   first, leaving a stale panel visible over the one you asked for. */
function closeAnyDrawer() {
  document.querySelectorAll('.scrim, .drawer').forEach(el => el.remove());
}

async function openRequest(id) {
  if (!document.getElementById('app')) await viewRequests();
  closeAnyDrawer();

  const scrim = $('<div class="scrim"></div>');
  const drawer = $('<div class="drawer" role="dialog" aria-modal="true"><div class="dbody">Loading…</div></div>');
  const close = () => { scrim.remove(); drawer.remove(); document.removeEventListener('keydown', onKey);
    if (location.hash.startsWith('#/requests/')) location.hash = '#/requests'; };
  const onKey = e => { if (e.key === 'Escape') close(); };
  scrim.addEventListener('click', close);
  document.addEventListener('keydown', onKey);
  document.body.append(scrim, drawer);

  let r;
  try {
    ({ request: r } = await api(`/requests/${id}`));
  } catch (err) {
    drawer.replaceChildren($(`<div class="dbody"><div class="banner err">${esc(err.message)}</div></div>`));
    return;
  }

  /* tel:/sms: want E.164; the stored string is whatever the customer typed. */
  const pref = r.contact_pref;
  const actions = contactActions(r);

  const extras = [];
  if (r.kind === 'reserve' && r.return_date) extras.push(['Back by', niceDate(r.return_date)]);
  if (r.pickup_city && r.pickup_city !== r.delivery_city) extras.push(['Pickup city', r.pickup_city]);

  drawer.replaceChildren($(`
    <div class="dhead">
      <div style="flex:1">
        <h2>${esc(fullName(r))}</h2>
        <div class="meta">${r.kind === 'reserve' ? 'Reservation' : 'Question'} · #${r.id} · ${esc(ago(r.created_at))}</div>
      </div>
      <span class="pill ${r.status}" style="margin-top:3px">${r.status}</span>
      <button class="x" aria-label="Close">×</button>
    </div>
    <div class="dbody">
      ${actions ? `<div class="contactbar">${actions}${
        pref ? `<span class="prefnote">prefers ${esc(pref)}</span>` : ''}</div>` : ''}
      <dl class="kv">
        <dt>Phone</dt><dd>${esc(r.phone || '—')}</dd>
        <dt>Email</dt><dd>${esc(r.email || '—')}</dd>
        ${r.kind === 'reserve' ? `
        <dt>Package</dt><dd>${esc(pkg(r))}</dd>
        <dt>Bins free</dt><dd>${light(r)} <span style="font-weight:400">${esc(lightTitle(r.fit, r))}</span></dd>
        <dt>Quoted</dt><dd>${esc(money(r.quoted_total_cents))} <span style="color:var(--muted);font-weight:400">before tax</span></dd>` : ''}
        <dt>${r.kind === 'reserve' ? 'Starts' : 'Needs bins'}</dt><dd>${esc(niceDate(r.start_date))}</dd>
        ${extras.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}
        <dt>Delivery city</dt><dd>${esc(r.delivery_city || '—')}</dd>
        ${r.decided_by ? `<dt>Decided</dt><dd>${esc(r.decided_by)}<br><span style="color:var(--muted);font-weight:400">${esc(ago(r.decided_at))}</span></dd>` : ''}
      </dl>

      ${r.message ? `<div class="note"><h4>Their message</h4>${esc(r.message)}</div>` : ''}
      ${r.customer_notes ? `<div class="note"><h4>Notes from the customer</h4>${esc(r.customer_notes)}</div>` : ''}
      ${r.decline_reason ? `<div class="note"><h4>Why it was declined</h4>${esc(r.decline_reason)}</div>` : ''}

      <div id="req-notes"></div>
      <div id="req-history" style="margin-top:6px"></div>

      <div class="actions" style="margin-top:22px;border-top:1px solid var(--line);padding-top:18px">
        ${!isOwner() ? '<span style="color:var(--muted);font-size:13px">An owner approves or declines this.</span>'
        : r.status === 'converted' ? `<a class="btn" href="#/rentals/${r.rental_id}">Open rental #${r.rental_id}</a>
          <span style="color:var(--muted);font-size:13px">Booked. To call it off, cancel the rental.</span>`
        : r.status === 'new' && r.kind === 'contact' ? `
          <button class="btn primary" id="req-book">Turn into a booking</button>
          <button class="btn" data-act="answer">Mark answered</button>
          <span style="color:var(--muted);font-size:13px">Reply with the buttons above; this just closes it.</span>`
        : r.status === 'new' && r.lapsed ? `
          <button class="btn primary" id="req-redate">New date</button>
          <button class="btn danger" data-act="decline">Decline</button>
          <span style="color:var(--muted);font-size:13px">The day they asked for has passed.</span>`
        : r.status === 'new' ? `
          <button class="btn primary" data-act="approve">Approve</button>
          <button class="btn danger" data-act="decline">Decline</button>`
        : r.status === 'answered' ? `<span style="color:var(--muted);font-size:13px">Answered${r.decline_reason ? ` — ${esc(r.decline_reason)}` : ''}.</span>
          <button class="btn" data-act="reopen">Reopen</button>`
        : `<button class="btn" data-act="reopen">Reopen as new</button>`}
        ${r.customer_id ? `<a class="linkish" href="#/customers/${r.customer_id}" style="margin-left:auto">Customer record</a>` : ''}
      </div>
      <div id="drawer-msg"></div>
    </div>`));

  drawer.querySelector('.x').addEventListener('click', close);

  const msg = drawer.querySelector('#drawer-msg');
  const act = async (action, extra = {}) => {
    msg.replaceChildren();
    try {
      const res = await api(`/requests/${id}/decision`, { method: 'POST', body: JSON.stringify({ action, ...extra }) });
      await refreshCounts();
      close();
      // Approving creates a rental; go straight to it, since the next thing
      // anyone does is fill in the address and chase the agreement.
      if (res.rental_id) { location.hash = `#/rentals/${res.rental_id}`; return; }
      viewRequests();
    } catch (err) {
      /* Not enough bins free. A refusal rather than a warning, because
         approving is what emails the customer their confirmation link — but
         sometimes you know a set is coming back early, so it can be overridden
         on purpose and the override is recorded. */
      if (/approve anyway/i.test(err.message) && !extra.force) {
        if (await sure({ title: 'Not enough bins free', body: esc(err.message.replace(/ Move the date.*$/, '')), ok: 'Approve anyway' })) return act(action, { ...extra, force: true });
        return;
      }
      msg.replaceChildren(banner(err.message));
    }
  };

  notesPanel(drawer.querySelector('#req-notes'), 'requests', id);
  historyPanel(drawer.querySelector('#req-history'), 'requests', id);
  drawer.querySelector('[data-act="approve"]')?.addEventListener('click', () => act('approve'));
  drawer.querySelector('#req-redate')?.addEventListener('click', async () => {
    const v = await ask({ title: 'A new date', body: `${esc(fullName(r))} asked for ${esc(niceDate(r.start_date))}, which has passed.`,
      fields: [{ name: 'start_date', label: 'New delivery date', type: 'date', value: todayISO(), min: todayISO(), required: true }], ok: 'Set the date' });
    if (!v) return;
    try { await api(`/requests/${id}`, { method: 'PATCH', body: JSON.stringify({ start_date: v.start_date }) }); close(); viewRequests(); }
    catch (err) { msg.replaceChildren(banner(err.message)); }
  });
  drawer.querySelector('[data-act="reopen"]')?.addEventListener('click', () => act('reopen'));
  drawer.querySelector('#req-book')?.addEventListener('click', () => openNewRequest(r));
  drawer.querySelector('[data-act="answer"]')?.addEventListener('click', async () => {
    const v = await ask({ title: 'Mark this question answered', body: 'It leaves the list and stays on the customer. What did you tell them?',
      fields: [{ name: 'reason', label: 'The answer, in a line', optional: true, placeholder: 'Yes to Hooper — 20 is the smallest package' }], ok: 'Answered' });
    if (!v) return;
    act('answer', { reason: v.reason });
  });
  drawer.querySelector('[data-act="decline"]')?.addEventListener('click', async () => {
    const v = await ask({ title: 'Decline this request', body: 'The customer never sees the reason. They stay on the Customers tab for next time.',
      fields: [{ name: 'reason', label: 'Why', optional: true, placeholder: 'Outside our area' }], ok: 'Decline', danger: true });
    if (!v) return;
    act('decline', { reason: v.reason });
  });
}

/* ---------- new request (phone-in) ---------- */
// PRICING:start
const PRICES = { 10: 39, 20: 79, 40: 129, 60: 179 };
const EXTRA  = { 10: 25, 20: 40, 40: 65, 60: 90 };
// PRICING:end

function openNewRequest(from = null) {
  closeAnyDrawer();
  const scrim = $('<div class="scrim"></div>');
  const drawer = $('<div class="drawer" role="dialog" aria-modal="true"></div>');
  const close = () => { scrim.remove(); drawer.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  scrim.addEventListener('click', close);
  document.addEventListener('keydown', onKey);

  const today = todayISO();

  drawer.append($(`
    <div class="dhead">
      <div style="flex:1"><h2>New request</h2>
        <div class="meta">Taken by phone or in person</div></div>
      <button class="x" aria-label="Close">\u00D7</button>
    </div>`), $(`
    <div class="dbody">
      <div class="frow one">
        <div><label class="fl" for="n-kind">Type</label>
          <select id="n-kind">
            <option value="reserve">Reservation</option>
            <option value="contact">Question / enquiry</option>
          </select></div>
      </div>
      <div class="frow">
        <div><label class="fl" for="n-first">First name</label><input id="n-first" required></div>
        <div><label class="fl" for="n-last">Last name</label><input id="n-last"></div>
      </div>
      <div class="frow">
        <div><label class="fl" for="n-phone">Phone</label><input id="n-phone" type="tel"></div>
        <div><label class="fl" for="n-email">Email</label><input id="n-email" type="email"></div>
      </div>
      <div class="frow one">
        <div><label class="fl" for="n-pref">Best way to reach them</label>
          <select id="n-pref">
            <option value="text">Text</option>
            <option value="call" selected>Call</option>
            <option value="email">Email</option>
          </select></div>
      </div>

      <div id="n-reserve">
        <div class="frow">
          <div><label class="fl" for="n-bins">Package</label>
            <select id="n-bins">
              <option value="10">10 bins</option><option value="20">20 bins</option>
              <option value="40" selected>40 bins</option><option value="60">60 bins</option>
            </select></div>
          <div><label class="fl" for="n-weeks">Weeks</label>
            <input id="n-weeks" type="number" min="1" max="26" value="1"></div>
        </div>
        <div class="quote">
          <span>Standard rate <small id="n-back"></small></span>
          <strong id="n-quote">\u2014</strong>
        </div>
        <div class="frow">
          <div><label class="fl" for="n-start">Start date</label>
            <input id="n-start" type="date" min="${today}"></div>
          <div><label class="fl" for="n-override">Custom price</label>
            <input id="n-override" placeholder="Leave blank for standard"></div>
        </div>
      </div>

      <div class="frow">
        <div><label class="fl" for="n-dcity">Delivery city</label>
          <select id="n-dcity"><option value="">Pick a city…</option>${cities.map(c => `<option>${esc(c)}</option>`).join('')}</select></div>
        <div><label class="fl" for="n-pcity">Pickup city</label>
          <select id="n-pcity"><option value="">Same as delivery</option>${cities.map(c => `<option>${esc(c)}</option>`).join('')}</select></div>
      </div>

      <label class="fl" for="n-notes">Notes from the customer</label>
      <textarea id="n-notes" placeholder="Stairs, gate codes, custom quantities\u2026"></textarea>

      <div style="height:12px"></div>
      <label class="fl" for="n-internal">Internal notes</label>
      <textarea id="n-internal" placeholder="Only staff see this."></textarea>

      <div id="n-msg" style="margin-top:14px"></div>
      <div class="actions" style="margin-top:16px;border-top:1px solid var(--line);padding-top:18px">
        <button class="btn primary" id="n-save">Create request</button>
        <button class="btn" id="n-cancel">Cancel</button>
      </div>
    </div>`));

  document.body.append(scrim, drawer);
  const q = id => drawer.querySelector('#' + id);

  // Started from a question: their details are already known.
  if (from) {
    q('n-first').value = from.first_name || '';
    q('n-last').value = from.last_name || '';
    q('n-phone').value = from.phone || '';
    q('n-email').value = from.email || '';
    if (from.contact_pref) q('n-pref').value = from.contact_pref;
    if (from.delivery_city) q('n-dcity').value = from.delivery_city;
    if (from.start_date) q('n-start').value = from.start_date;
    drawer.querySelector('.dhead .meta').textContent = `In reply to their question: “${(from.message || '').slice(0, 80)}${(from.message || '').length > 80 ? '…' : ''}”`;
  }

  // Mirror the site's quote so a phoned-in customer hears the same number the
  // website would have shown them.
  const sync = () => {
    const bins = +q('n-bins').value;
    const weeks = Math.max(1, +q('n-weeks').value || 1);
    q('n-quote').textContent = '$' + (PRICES[bins] + (weeks - 1) * EXTRA[bins]);
    const start = q('n-start').value;
    if (start) {
      const d = new Date(start + 'T12:00:00');
      d.setDate(d.getDate() + 7 * weeks);
      q('n-back').textContent = '\u00B7 back ' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    } else q('n-back').textContent = '';
  };
  ['n-bins', 'n-weeks', 'n-start'].forEach(id => q(id).addEventListener('input', sync));
  sync();

  const isReserve = () => q('n-kind').value === 'reserve';
  q('n-kind').addEventListener('change', () => { q('n-reserve').hidden = !isReserve(); });

  drawer.querySelector('.x').addEventListener('click', close);
  q('n-cancel').addEventListener('click', close);

  q('n-save').addEventListener('click', async () => {
    const btn = q('n-save');
    btn.disabled = true;
    q('n-msg').replaceChildren();
    try {
      const { request } = await api('/requests', { method: 'POST', body: JSON.stringify({
        kind: q('n-kind').value,
        first_name: q('n-first').value, last_name: q('n-last').value,
        phone: q('n-phone').value, email: q('n-email').value,
        contact_pref: q('n-pref').value,
        bins: q('n-bins').value, weeks: q('n-weeks').value,
        start_date: q('n-start').value, delivery_city: q('n-dcity').value,
        pickup_city: q('n-pcity').value, quoted_total: q('n-override').value,
        customer_notes: isReserve() ? q('n-notes').value : '',
        message: isReserve() ? '' : q('n-notes').value,
        internal_notes: q('n-internal').value,
        answers: from?.id || null,
      })});
      close();
      await refreshCounts();
      await viewRequests();
      location.hash = `#/requests/${request.id}`;
    } catch (err) {
      q('n-msg').replaceChildren(banner(err.message));
      btn.disabled = false;
    }
  });
}

/* ---------- rentals ---------- */
let savedView = 'list';
try { savedView = localStorage.getItem('rentals.view') || 'list'; } catch {}
const rentState = { status: 'active', view: savedView };
const RENT_FILTERS = [['active','Active'],['booked','Booked'],['confirmed','Confirmed'],['out','Out'],
  ['back','Back'],['settling','Settling'],['stalled','Stalled']];
/* The board's columns: the live phases, in order, with what each is waiting on. */
const PHASE_COLS = [
  ['booked',    'Booked',    'waiting on the customer'],
  ['confirmed', 'Confirmed', 'waiting for delivery day'],
  ['out',       'Out',       'at their house'],
  ['back',      'Back',      'to inspect and clean'],
  ['settling',  'Settling',  'to decide and charge'],
];

const isLate = r => r.status === 'out' && r.due_date && r.due_date < todayISO();

async function viewRentals() {
  const board = rentState.view === 'board';
  const view = $(`<div>
    <div class="head"><h1>Rentals</h1><span class="count" id="ncount"></span>
      <div class="seg viewseg"><button data-v="list" aria-pressed="${!board}">List</button><button data-v="board" aria-pressed="${board}">Board</button></div></div>
    <p class="sub">Live jobs, booked through settled. Finished ones live on the customer.</p>
    ${board ? '' : `<div class="toolbar"><div class="seg">${RENT_FILTERS.map(([f, label]) =>
        `<button data-f="${f}" aria-pressed="${f === rentState.status}">${label}</button>`).join('')}</div></div>`}
    <div id="nlist" class="${board ? '' : 'card'}"><div class="empty">Loading…</div></div>
  </div>`);
  render('rentals', view);

  view.querySelectorAll('.viewseg button').forEach(b => b.addEventListener('click', () => {
    rentState.view = b.dataset.v;
    try { localStorage.setItem('rentals.view', rentState.view); } catch {}
    viewRentals();
  }));
  view.querySelectorAll('.seg:not(.viewseg) button').forEach(b => b.addEventListener('click', () => {
    rentState.status = b.dataset.f;
    viewRentals();
  }));

  const list = view.querySelector('#nlist');
  try {
    const { rentals } = await api(`/rentals?status=${board ? 'active' : rentState.status}`);
    view.querySelector('#ncount').textContent = rentals.length || '';

    if (!rentals.length) {
      list.classList.add('card');
      list.replaceChildren($(`<div class="empty"><strong>Nothing here</strong>${
        rentState.status === 'active' || board ? 'No live rentals. Approve a request to start one.' : 'No rentals in this list.'}</div>`));
      return;
    }

    const flags = r => [
      r.overdue ? '<span class="pill overdue">overdue</span>' : '',
      r.stalled ? '<span class="pill stalled" title="Not confirmed, and the start date has passed">stalled</span>' : '',
    ].filter(Boolean).join(' ');

    if (board) {
      /* One column per live phase. Cards are the rental in a glance and a
         click through; they do not drag, because every stage has a rule —
         a photo, a date, an inspection — that a drag would go around. */
      const cols = PHASE_COLS.map(([phase, label, hint]) => {
        const cards = rentals.filter(r => r.phase === phase).sort((a, b) =>
          (phase === 'out' ? a.due_date.localeCompare(b.due_date) : a.start_date.localeCompare(b.start_date)));
        return `<div class="col">
          <h4>${label} <span class="n">${cards.length}</span><small>${hint}</small></h4>
          ${cards.map(r => `<a class="kcard${r.overdue ? ' overdue' : r.stalled ? ' stalled' : ''}" href="#/rentals/${r.id}">
            <b>${esc(fullName(r))}</b>
            <span>${r.bins} bins · ${esc(r.delivery_city || '')}</span>
            <span class="when">${phase === 'out' || phase === 'back' ? `back ${esc(niceDate(r.due_date))}` : phase === 'booked' || phase === 'confirmed' ? `out ${esc(niceDate(r.start_date))}` : esc(niceDate(r.due_date))}${
              (phase === 'confirmed' && r.delivery_window) ? `, ${esc(r.delivery_window)}` : (phase === 'out' && r.pickup_window) ? `, ${esc(r.pickup_window)}` : ''}</span>
            ${flags(r) ? `<span class="flags">${flags(r)}</span>` : ''}
          </a>`).join('') || '<div class="none">—</div>'}
        </div>`;
      }).join('');
      list.replaceChildren($(`<div class="board">${cols}</div>`));
      return;
    }

    const rows = rentals.map(r => `<tr class="clickable${r.overdue ? ' late' : r.stalled ? ' stale' : ''}" data-id="${r.id}">
      <td><span class="pill ${r.phase}">${r.phase}</span> ${flags(r)}</td>
      <td><div class="who">${esc(fullName(r))}<small>${esc(r.delivery_city || '—')}</small></div></td>
      <td class="nowrap">${r.bins} bins · ${r.weeks === 1 ? '1 wk' : r.weeks + ' wks'}</td>
      <td class="nowrap num">${esc(niceDate(r.start_date))}</td>
      <td class="nowrap num">${esc(niceDate(r.due_date))}</td>
      <td class="nowrap num hide-sm">${esc(money(r.total_cents))}</td>
    </tr>`).join('');
    const table = $(`<table><thead><tr>
      <th>Status</th><th>Who</th><th>Package</th><th>Out</th><th>Back</th><th class="hide-sm">Total</th>
    </tr></thead><tbody>${rows}</tbody></table>`);
    table.querySelectorAll('tbody tr').forEach(tr => tr.addEventListener('click', () => { location.hash = `#/rentals/${tr.dataset.id}`; }));
    list.replaceChildren(table);
  } catch (err) {
    list.replaceChildren($(`<div class="empty"><strong>Could not load rentals</strong>${esc(err.message)}</div>`));
  }
}

const STEPS = [
  ['agreement', 'agreement_signed_at', 'Agreement signed'],
  ['paid',      'paid_at',             'Paid'],
  ['delivered', 'delivered_at',        'Bins delivered'],
  ['returned',  'returned_at',         'Bins back'],
  ['inspected', 'inspected_at',        'Inspected & cleaned'],
];

/* ---------- availability ----------

   When each person can drive: a weekly pattern, and days that differ. Shown
   on the Employees tab. Staff edit their own row; an owner edits anyone's.
   What it produces — who is on tonight, which hours have room — is on the
   Schedule tab and, for customers, on the address step of their link. */

const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const hhmm = v => /^([01]\d|2[0-3]):[0-5]\d$/.test(v) ? v : null;
const tlabel = t => { const [h, m] = t.split(':').map(Number); return `${h % 12 || 12}${m ? ':' + String(m).padStart(2, '0') : ''}${h < 12 ? 'am' : 'pm'}`; };

function availabilityPanel(container, employees) {
  const draw = async () => {
    let shifts;
    try { ({ shifts } = await api('/shifts')); }
    catch (err) { container.replaceChildren(banner(err.message)); return; }

    const canEdit = e => me.role === 'owner' || e.id === me.id;
    const people = employees.filter(e => e.active);
    const rows = people.map(e => {
      const mine = shifts.filter(s => s.employee_id === e.id);
      const pattern = WD.map((d, wd) => {
        const s = mine.find(x => x.weekday === wd);
        return `<td class="wd${s ? ' on' : ''}" data-emp="${e.id}" data-wd="${wd}" title="${d}${s ? ` ${tlabel(s.start)}–${tlabel(s.end)}` : ''}">${
          s ? `<b>${esc(tlabel(s.start))}</b><small>to ${esc(tlabel(s.end))}</small>` : '<span class="no">—</span>'}</td>`;
      }).join('');
      const oneOffs = mine.filter(s => s.date).sort((a, b) => a.date.localeCompare(b.date)).map(s =>
        `<span class="oneoff${s.off ? ' off' : ''}" title="${esc(s.note || '')}">${esc(niceDate(s.date))}: ${
          s.off ? `off${s.note ? ` — ${esc(s.note)}` : ''}` : `${esc(tlabel(s.start))}–${esc(tlabel(s.end))}`}${
          canEdit(e) ? ` <button class="linkish" data-rmshift="${s.id}">×</button>` : ''}</span>`).join('');
      return `<tr>
        <td><strong>${esc(e.name || e.email)}</strong>${canEdit(e) ? `<br><button class="linkish" data-addday="${e.id}">+ a day that differs</button>` : ''}</td>
        ${pattern}
        <td class="oneoffs">${oneOffs || '<span style="color:var(--muted)">—</span>'}</td>
      </tr>`;
    }).join('');

    container.replaceChildren($(`<div>
      <p class="sub">Click a day to set hours. ${shifts.length ? '' : '<strong>Nothing entered yet</strong> — until someone is, every evening counts as covered.'}</p>
      <table class="avail"><thead><tr><th>Who</th>${WD.map(d => `<th>${d}</th>`).join('')}<th>Days that differ</th></tr></thead>
      <tbody>${rows}</tbody></table>
      <div id="av-msg"></div>
    </div>`));

    const fail = err => container.querySelector('#av-msg').replaceChildren(banner(err.message));
    container.querySelectorAll('td.wd').forEach(td => td.addEventListener('click', async () => {
      const e = people.find(p => p.id === +td.dataset.emp);
      if (!canEdit(e)) return;
      const wd = +td.dataset.wd;
      const cur = shifts.find(s => s.employee_id === e.id && s.weekday === wd);
      const v = await ask({ title: `${e.name || e.email} on ${WD[wd]}s`,
        fields: [{ name: 'on', type: 'choice', value: cur ? 'on' : 'off', required: true, options: [['on', 'Working', 'Set the hours below'], ['off', 'Not working']] },
                 { name: 'start', label: 'From', type: 'time', value: cur?.start || '17:00' }, { name: 'end', label: 'To', type: 'time', value: cur?.end || '21:00' }], ok: 'Save' });
      if (!v) return;
      try {
        if (v.on === 'off') { if (cur) await api(`/shifts/${cur.id}`, { method: 'DELETE' }); }
        else await api('/shifts', { method: 'POST', body: JSON.stringify({ employee_id: e.id, weekday: wd, start: v.start, end: v.end }) });
        draw();
      } catch (err) { fail(err); }
    }));
    container.querySelectorAll('[data-addday]').forEach(b => b.addEventListener('click', async () => {
      const e = people.find(p => p.id === +b.dataset.addday);
      const v = await ask({ title: `A day that differs for ${e.name || e.email}`,
        fields: [{ name: 'date', label: 'Date', type: 'date', value: todayISO(), required: true },
                 { name: 'what', type: 'choice', value: 'off', required: true, options: [['off', 'Off that day', 'Whatever the weekly pattern says'], ['on', 'Working these hours', 'Extra, or different, hours']] },
                 { name: 'start', label: 'From', type: 'time', value: '17:00' }, { name: 'end', label: 'To', type: 'time', value: '21:00' },
                 { name: 'note', label: 'Note', optional: true, placeholder: 'Dentist' }], ok: 'Save' });
      if (!v) return;
      try {
        if (v.what === 'off') await api('/shifts', { method: 'POST', body: JSON.stringify({ employee_id: e.id, date: v.date, off: true, note: v.note }) });
        else await api('/shifts', { method: 'POST', body: JSON.stringify({ employee_id: e.id, date: v.date, start: v.start, end: v.end, note: v.note }) });
        draw();
      } catch (err) { fail(err); }
    }));
    container.querySelectorAll('[data-rmshift]').forEach(b => b.addEventListener('click', async () => {
      try { await api(`/shifts/${b.dataset.rmshift}`, { method: 'DELETE' }); draw(); } catch (err) { fail(err); }
    }));
  };
  draw();
}

/* ---------- calendar ----------

   A month at a glance: for each day, who is on, how many jobs are booked,
   and how many bins are free. The question it answers is "when can we take
   the next one" — the stoplight, but for a date you have not been asked for
   yet. */
async function viewCalendar() {
  const first = (schedState.month || todayISO()).slice(0, 8) + '01';
  const d0 = new Date(`${first}T12:00:00Z`);
  const monthName = d0.toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
  const startPad = d0.getUTCDay();
  const daysIn = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 0)).getUTCDate();
  const shift = n => { const d = new Date(d0); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 10); };

  const view = $(`<div>
    <div class="head"><h1>Calendar</h1>
      <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
        <button class="btn sm" id="cal-prev">‹</button><strong style="min-width:150px;text-align:center">${esc(monthName)}</strong><button class="btn sm" id="cal-next">›</button>
      </div></div>
    <p class="sub">Who is driving, what is booked, and how many bins are free each day. <a href="#/schedule">Back to tonight</a>.</p>
    <div class="month" id="month"><div class="empty">Loading…</div></div>
  </div>`);
  render('schedule', view);
  view.querySelector('#cal-prev').addEventListener('click', () => { schedState.month = shift(-1); viewCalendar(); });
  view.querySelector('#cal-next').addEventListener('click', () => { schedState.month = shift(1); viewCalendar(); });

  try {
    const [cov, sched, inv] = await Promise.all([
      api(`/coverage?from=${first}&days=${daysIn}`), api(`/schedule?from=${first}&days=${daysIn}`), api(`/inventory?from=${first}&days=${daysIn}`),
    ]);
    const cells = [];
    for (let i = 0; i < startPad; i++) cells.push('<div class="cell pad"></div>');
    for (let i = 0; i < daysIn; i++) {
      const c = cov.days[i], s = sched.days[i], a = inv.days[i];
      const past = c.date < todayISO();
      const jobs = s.jobs.length;
      const free = a.available;
      const cls = ['cell', past ? 'past' : '', c.date === todayISO() ? 'today' : '',
        c.blackout ? 'closed' : !c.open && c.configured ? 'nobody' : '', free < 0 ? 'over' : ''].filter(Boolean).join(' ');
      cells.push(`<a class="${cls}" href="#/schedule/${c.date}">
        <div class="n">${i + 1}${c.closedDay ? `<small>${esc(c.closedDay.slice(0, 3))} · closed</small>` : ''}</div>
        ${c.blackout ? `<div class="tag">Closed${c.blackout !== 'closed' ? ` · ${esc(c.blackout)}` : ''}</div>`
          : c.configured && !c.staff.length ? '<div class="tag">Nobody on</div>'
          : c.staff.length ? `<div class="who">${c.staff.map(x => esc(x.name.split('@')[0])).join(', ')}</div>` : ''}
        ${jobs ? `<div class="jobs">${jobs} job${jobs === 1 ? '' : 's'}${s.binsOut ? ` · ${s.binsOut} out` : ''}${s.binsBack ? ` · ${s.binsBack} back` : ''}</div>` : ''}
        <div class="free${free <= 0 ? ' none' : ''}">${free < 0 ? `${-free} short` : `${free} free`}</div>
      </a>`);
    }
    view.querySelector('#month').replaceChildren($(`<div>
      <div class="dow">${WD.map(d => `<div>${d}</div>`).join('')}</div>
      <div class="grid">${cells.join('')}</div>
    </div>`));
  } catch (err) {
    view.querySelector('#month').replaceChildren(banner(err.message));
  }
}

/* ---------- my hours ----------

   The staff view of the Employees page: one row, theirs. The list, roles and
   the activity log are the owner's business. */
async function viewMyHours() {
  const view = $(`<div>
    <div class="head"><h1>My hours</h1></div>
    <p class="sub">When you can drive. Click a day to set hours; add a day that differs for time off or extra shifts.</p>
    <div class="card" id="avail" style="padding:16px 18px"><div class="empty">Loading…</div></div>

/* ---------- customers ----------

   One row per person: everyone who has asked for bins or rented them. The
   list answers "have we dealt with them" and "who should we call in March";
   the record holds their rentals, their requests — including the declined
   and lapsed ones, which are leads rather than dead rows — and notes that
   outlive any one rental. */

const custState = { filter: 'all', q: '' };
const CUST_FILTERS = [['all', 'Everyone'], ['renters', 'Past renters'], ['lapsed', 'Lapsed'], ['declined', 'Declined']];
const custName = c => [c.first_name, c.last_name].filter(Boolean).join(' ') || c.email || c.phone || '(no name)';
const fmtPhone = p => p && p.length === 10 ? `(${p.slice(0, 3)}) ${p.slice(3, 6)}-${p.slice(6)}` : (p || '');

async function viewCustomers() {
  const view = $(`<div>
    <div class="head"><h1>Customers</h1><span class="count" id="ccount"></span></div>
    <p class="sub">Everyone who has asked or rented. Finished rentals and answered requests live here.</p>
    <div class="toolbar">
      <div class="seg">${CUST_FILTERS.map(([f, label]) =>
        `<button data-f="${f}" aria-pressed="${f === custState.filter}">${label}</button>`).join('')}</div>
      <input class="search" placeholder="Name, email, phone, city…" value="${esc(custState.q)}">
    </div>
    <div class="card" id="clist"><div class="empty">Loading…</div></div>
  </div>`);
  render('customers', view);
  view.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { custState.filter = b.dataset.f; viewCustomers(); }));
  let t;
  view.querySelector('.search').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { custState.q = e.target.value; load(); }, 200); });

  const list = view.querySelector('#clist');
  const load = async () => {
    try {
      const { customers } = await api(`/customers?filter=${custState.filter}&q=${encodeURIComponent(custState.q)}`);
      view.querySelector('#ccount').textContent = customers.length || '';
      if (!customers.length) {
        list.replaceChildren($(`<div class="empty"><strong>Nobody here</strong>${custState.q ? 'Try a different search.' : 'People appear as requests come in.'}</div>`));
        return;
      }
      const rows = customers.map(c => `<tr class="clickable" data-id="${c.id}">
        <td><div class="who">${esc(custName(c))}<small>${esc(c.email || '')}${c.email && c.phone ? ' · ' : ''}${esc(fmtPhone(c.phone))}</small></div></td>
        <td class="hide-sm">${esc(c.city || '—')}</td>
        <td class="nowrap">${c.finished ? `${c.finished} rental${c.finished === 1 ? '' : 's'}` : '<span style="color:var(--muted)">—</span>'}${
          c.rentals > c.finished ? ` <span class="pill confirmed">${c.rentals - c.finished} live</span>` : ''}</td>
        <td class="nowrap num hide-sm">${c.spent_cents ? esc(money(c.spent_cents)) : '—'}</td>
        <td class="nowrap">${c.open_requests && !c.lapsed ? '<span class="pill new">asking</span>' : ''}${
          c.lapsed ? '<span class="pill lapsed">lapsed</span>' : ''}${c.declined ? ' <span class="pill declined">declined</span>' : ''}</td>
        <td class="nowrap hide-sm" style="color:var(--muted)">${c.last_seen ? esc(ago(c.last_seen)) : ''}</td>
      </tr>`).join('');
      const table = $(`<table><thead><tr><th>Who</th><th class="hide-sm">City</th><th>Rented</th><th class="hide-sm">Spent</th><th></th><th class="hide-sm">Last</th></tr></thead><tbody>${rows}</tbody></table>`);
      table.querySelectorAll('tbody tr').forEach(tr => tr.addEventListener('click', () => { location.hash = `#/customers/${tr.dataset.id}`; }));
      list.replaceChildren(table);
    } catch (err) { list.replaceChildren($(`<div class="empty">${esc(err.message)}</div>`)); }
  };
  load();
}

async function viewCustomer(id) {
  const page = $('<div class="rentalpage"><div class="empty">Loading…</div></div>');
  render('customers', page);
  let d;
  try { d = await api(`/customers/${id}`); }
  catch (err) { page.replaceChildren(banner(err.message)); return; }
  const { customer: c, requests, rentals } = d;
  const contact = contactActions({ phone: c.phone, email: c.email, contact_pref: requests[0]?.contact_pref });

  /* One line per story. A request that became a rental is that rental —
     the request is where it started, not a second thing that happened. Only
     a request that went nowhere (declined, lapsed, still open, a question)
     stands on its own. */
  const byRequest = new Map(rentals.map(r => [r.request_id, r]));
  const stories = [
    ...rentals.map(r => ({ kind: 'rental', at: r.start_date, live: !['done', 'cancelled'].includes(r.phase), r })),
    ...requests.filter(q => !byRequest.has(q.id)).map(q => ({ kind: 'request', at: q.start_date || q.created_at.slice(0, 10), live: q.status === 'new', q })),
  ].sort((a, b) => b.at.localeCompare(a.at));
  const live = stories.filter(s => s.live), past = stories.filter(s => !s.live);
  const spent = rentals.filter(r => r.paid_at && r.status !== 'cancelled').reduce((n, r) => n + (r.total_cents || 0), 0);

  const row = st => st.kind === 'rental' ? `<tr class="clickable" data-rental="${st.r.id}">
      <td><span class="pill ${st.r.phase}">${st.r.phase}</span>${st.r.overdue ? ' <span class="pill overdue">overdue</span>' : st.r.stalled ? ' <span class="pill stalled">stalled</span>' : ''}</td>
      <td class="nowrap">${st.r.bins} bins · ${st.r.weeks === 1 ? '1 wk' : st.r.weeks + ' wks'}</td>
      <td class="nowrap num">${esc(niceDate(st.r.start_date))} → ${esc(niceDate(st.r.due_date))}</td>
      <td class="hide-sm">${esc(st.r.delivery_city || '')}</td>
      <td class="nowrap num">${esc(money(st.r.total_cents))}${st.r.paid_at ? '' : ' <span style="color:var(--muted)">unpaid</span>'}</td>
      <td class="nowrap hide-sm" style="color:var(--muted)">asked ${esc(ago(st.r.created_at))}</td>
    </tr>` : `<tr class="clickable" data-request="${st.q.id}">
      <td>${st.q.lapsed ? '<span class="pill lapsed">lapsed</span>' : `<span class="pill ${st.q.status}">${st.q.kind === 'contact' && st.q.status === 'new' ? 'question' : st.q.status}</span>`}</td>
      <td class="nowrap">${st.q.kind === 'contact' ? '<em style="color:var(--muted)">Question</em>' : esc(pkg(st.q))}</td>
      <td class="nowrap num">${st.q.start_date ? esc(niceDate(st.q.start_date)) : ''}</td>
      <td class="hide-sm" colspan="2" style="color:var(--muted)">${esc(st.q.decline_reason || st.q.message?.slice(0, 70) || st.q.customer_notes?.slice(0, 70) || '')}</td>
      <td class="nowrap hide-sm" style="color:var(--muted)">asked ${esc(ago(st.q.created_at))}</td>
    </tr>`;

  page.replaceChildren($(`
    <div class="rhead">
      <a class="back" href="#/customers">&larr; Customers</a>
      <div class="title"><h1>${esc(custName(c))}</h1>
        <div class="meta">${[c.city, c.email, fmtPhone(c.phone)].filter(Boolean).map(esc).join(' · ')}
          · customer since ${esc(niceDate(c.created_at.slice(0, 10)))}${spent ? ` · ${esc(money(spent))} paid` : ''}</div></div>
    </div>
    <div class="rgrid">
      <div class="rmain">
        ${live.length ? `<h3 class="sect">Now</h3><div class="card"><table><tbody>${live.map(row).join('')}</tbody></table></div>` : ''}
        <h3 class="sect">History <span class="cnt">${past.length}</span></h3>
        <div class="card">${past.length ? `<table><tbody>${past.map(row).join('')}</tbody></table>`
          : '<div class="empty">Nothing finished yet.</div>'}</div>
      </div>
      <aside class="rside">
        <div class="card side">
          ${contact ? `<div class="contactbar">${contact}</div>` : ''}
          <dl class="kv">
            <dt>Email</dt><dd>${esc(c.email || '—')}</dd>
            <dt>Phone</dt><dd>${esc(fmtPhone(c.phone) || '—')}</dd>
            <dt>City</dt><dd>${esc(c.city || '—')}</dd>
          </dl>
          ${isOwner() ? '<button class="btn sm" id="c-edit" style="margin-top:10px">Edit details</button>' : ''}
        </div>
        <div id="cust-notes"></div>
      </aside>
    </div>`));

  page.querySelectorAll('[data-rental]').forEach(tr => tr.addEventListener('click', () => { location.hash = `#/rentals/${tr.dataset.rental}`; }));
  page.querySelectorAll('[data-request]').forEach(tr => tr.addEventListener('click', () => openRequest(tr.dataset.request)));
  notesPanel(page.querySelector('#cust-notes'), 'customers', id);
  page.querySelector('#c-edit')?.addEventListener('click', async () => {
    const v = await ask({ title: 'Customer details', fields: [
      { name: 'first_name', label: 'First name', value: c.first_name || '' }, { name: 'last_name', label: 'Last name', value: c.last_name || '' },
      { name: 'email', label: 'Email', type: 'email', value: c.email || '' }, { name: 'phone', label: 'Phone', type: 'tel', value: fmtPhone(c.phone) },
      { name: 'city', label: 'City', value: c.city || '' }], ok: 'Save' });
    if (!v) return;
    try {
      await api(`/customers/${id}`, { method: 'PATCH', body: JSON.stringify(v) });
      viewCustomer(id);
    } catch (err) { page.querySelector('.rside').prepend(banner(err.message)); }
  });
}

/* ---------- activity ----------

   Who did what, when. The audit log is append-only and every write in the
   Worker leaves a line here; this is the page that reads it. Owner only. */

const actState = { actor: '', from: '', to: '', q: '' };
const ACTION_WORDS = {
  'request.create': 'took a request', 'request.approve': 'approved', 'request.decline': 'declined', 'request.reopen': 'reopened', 'request.redated': 're-dated',
  'rental.create': 'made a rental', 'rental.confirm_sent': 'sent the link', 'rental.agreement': 'agreement', 'rental.paid': 'payment',
  'rental.delivered': 'delivered', 'rental.returned': 'collected', 'rental.inspected': 'inspected', 'rental.cancel': 'cancelled', 'rental.reinstate': 'reinstated',
  'rental.reschedule': 'moved the date', 'rental.bins_assigned': 'loaded bins', 'rental.bin_removed': 'took a bin off', 'rental.inspection_flags': 'flagged bins',
  'rental.photo_delivery': 'delivery photo', 'rental.photo_pickup': 'pickup photo', 'rental.delivered_no_photo': 'delivered, no photo', 'rental.returned_no_photo': 'collected, no photo',
  'rental.delivery_unlocked': 'unlocked delivery', 'rental.pickup_unlocked': 'unlocked pickup', 'rental.overbooked': 'approved over the fleet',
  'charge.add': 'added a charge', 'charge.waive': 'waived a charge', 'charge.invoice': 'charged', 'rental.counted': 'counted bins',
  'employee.add': 'added staff', 'employee.update': 'changed staff', 'employee.auto_enroll': 'first sign-in', 'shift.set': 'set hours', 'shift.remove': 'removed hours',
  'items.add': 'added inventory', 'item.condition': 'changed a bin', 'item.remove': 'removed an item', 'settings.update': 'changed a setting',
  'blackout.add': 'added a day off', 'blackout.remove': 'removed a day off', 'photos.swept': 'photo retention', 'customer.update': 'edited a customer',
  'rental.reminded_deliver': 'delivery reminder', 'rental.reminded_collect': 'pickup reminder', 'rental.slot_forced': 'booked a full slot',
};
const actionWord = a => ACTION_WORDS[a] || a.replace(/^square\./, 'Square: ').replace(/[._]/g, ' ');

async function viewActivity() {
  const view = $(`<div>
    <div class="head"><h1>Activity</h1><span class="count" id="acount"></span></div>
    <p class="sub">Everything anyone — or Square, or the overnight jobs — has done. Append-only.</p>
    <div class="toolbar" style="flex-wrap:wrap;gap:8px">
      <select id="a-actor"><option value="">Everyone</option></select>
      <input type="date" id="a-from" value="${esc(actState.from)}" title="From">
      <input type="date" id="a-to" value="${esc(actState.to)}" title="To">
      <input class="search" id="a-q" placeholder="Rental #, bin, word…" value="${esc(actState.q)}" style="flex:1;min-width:160px">
    </div>
    <div class="card" id="alist"><div class="empty">Loading…</div></div>
  </div>`);
  render('activity', view);
  const list = view.querySelector('#alist');
  const load = async () => {
    const qs = new URLSearchParams({ actor: actState.actor, from: actState.from, to: actState.to, q: actState.q });
    try {
      const { entries, actors } = await api(`/audit?${qs}`);
      const sel = view.querySelector('#a-actor');
      if (sel.options.length === 1) {
        for (const a of actors) sel.append(new Option(a.includes('@') ? a.split('@')[0] : a, a));
        sel.value = actState.actor;
      }
      view.querySelector('#acount').textContent = entries.length || '';
      if (!entries.length) { list.replaceChildren($('<div class="empty">Nothing matches.</div>')); return; }
      let lastDay = '';
      const rows = entries.map(e => {
        const day = businessDay(e.at);
        const head = day !== lastDay ? `<tr class="dayhead"><td colspan="4">${esc(day)}</td></tr>` : '';
        lastDay = day;
        const link = e.entity === 'rental' ? `<a href="#/rentals/${e.entity_id}">rental #${e.entity_id}</a>`
          : e.entity === 'request' ? `<a href="#/requests/${e.entity_id}">request #${e.entity_id}</a>`
          : e.entity === 'customer' ? `<a href="#/customers/${e.entity_id}">customer</a>`
          : e.entity ? `${esc(e.entity)} ${esc(e.entity_id || '')}` : '';
        return head + `<tr>
          <td class="nowrap" style="color:var(--muted)">${esc(stamp(e.at).replace(/^\w+, \w+ \d+, /, ''))}</td>
          <td class="nowrap"><strong>${esc(e.actor_email.includes('@') ? e.actor_email.split('@')[0] : e.actor_email)}</strong></td>
          <td class="nowrap">${esc(actionWord(e.action))}${link ? ` · ${link}` : ''}</td>
          <td style="color:var(--muted)">${esc(e.detail || '')}</td>
        </tr>`;
      }).join('');
      list.replaceChildren($(`<table><tbody>${rows}</tbody></table>`));
    } catch (err) { list.replaceChildren($(`<div class="empty">${esc(err.message)}</div>`)); }
  };
  const businessDay = iso => new Date(iso).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'America/Denver' });
  let t;
  view.querySelector('#a-actor').addEventListener('change', e => { actState.actor = e.target.value; load(); });
  view.querySelector('#a-from').addEventListener('change', e => { actState.from = e.target.value; load(); });
  view.querySelector('#a-to').addEventListener('change', e => { actState.to = e.target.value; load(); });
  view.querySelector('#a-q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { actState.q = e.target.value; load(); }, 200); });
  load();
}
