name = "beehive-forms"
main = "src/index.js"
compatibility_date = "2026-09-01"

routes = [
  { pattern = "api.beehivebin.co", custom_domain = true },
  { pattern = "book.beehivebin.co", custom_domain = true }
]
# Custom domain api.beehivebin.co is attached via the account-level Workers
# Domains API (not here) — the deploy token lacks zone Workers Routes access.

# Shared with beehive-admin: this Worker writes requests, the panel reads them.
[[d1_databases]]
binding = "DB"
database_name = "beehive"
database_id = "4dfd9b23-a6a4-40ba-87ee-0e9abc57d828"       # same id as workers/admin/wrangler.toml
migrations_dir = "../migrations"

[vars]
# Square signs (this exact URL + the raw body). It must match the endpoint
# registered in the Square dashboard byte for byte, which is why it is
# configured rather than derived from the incoming request.
SQUARE_WEBHOOK_URL = "https://api.beehivebin.co/square/webhook"
# SQUARE_WEBHOOK_SIGNATURE_KEY is a secret, set with:
#   npx wrangler secret put SQUARE_WEBHOOK_SIGNATURE_KEY -c workers/form-handler/wrangler.toml
# The confirmation flow answers here; everything else on this Worker is the API.
BOOKING_HOST = "book.beehivebin.co"
# Public identifiers for Square's Web Payments SDK — these are safe in a browser.
# Production app id: sq0idp-f2V-CQfcwNUQb0oqa0IOPg
SQUARE_ENV = "sandbox"
SQUARE_APP_ID = "sandbox-sq0idb-4duyIU8g4gLpO4L1canjEw"
SQUARE_LOCATION_ID = "LJR9D95SRQSN7"

# The Square access token lives only on beehive-admin. This Worker asks it to
# store cards and raise invoices rather than holding a second copy.
[[services]]
binding = "BILLING"
service = "beehive-admin"
entrypoint = "Billing"
